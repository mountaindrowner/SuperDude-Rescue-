# Codemagic CI/CD - build Super Dude Danny (Capacitor) for the iOS App
# Store ENTIRELY in the cloud, so no local Xcode and no macOS upgrade is
# needed. Codemagic runs this on its own modern macOS + Xcode machines.
#
# One-time setup is documented step-by-step in CODEMAGIC_SETUP.md. The
# short version:
#   1. Create an App Store Connect API key (.p8) with ADMIN access and
#      upload it to Codemagic as an integration named exactly
#      superdude_asc (or rename it here to whatever you call it). Admin
#      is required so the signing step below can CREATE the certificate
#      + profile + bundle ID automatically.
#   2. Create the app record in App Store Connect (New App, same bundle
#      ID). Needed so the final TestFlight upload has a target. (The App
#      ID / bundle identifier itself is auto-registered by the signing
#      step's --create, so you don't have to register it by hand first.)
#   3. Connect this GitHub repo + branch in Codemagic, then run the
#      "ios-appstore" workflow below.
#
# Nothing here changes the game. build:web just assembles the same clean
# web bundle that Netlify already publishes; Capacitor wraps it.

workflows:
  ios-appstore:
    name: Super Dude Danny - iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    # The App Store Connect API key you upload to Codemagic. The name on
    # the right MUST match the integration name you create in the
    # Codemagic UI (Teams/Personal settings -> Integrations -> App Store
    # Connect). See CODEMAGIC_SETUP.md Phase 5.
    integrations:
      app_store_connect: superdude_asc

    environment:
      # Imports the Codemagic UI variable group named "signing" so the
      # signing step can read $CERT_PRIVATE_KEY (the stable key for
      # certificate reuse). Add the variable to a group called exactly
      # "signing" in the Codemagic UI. If the group/variable is absent
      # the build still works - the signing step falls back to generating
      # a fresh key.
      groups:
        - signing
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "org.thecrossroads.superdudeadventures"
        # Marketing version shown on the store. Keep in step with
        # SDD.VERSION in js/main.js (strip the leading "v").
        MARKETING_VERSION: "1.0.22"

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Assemble the clean web bundle (www/)
        script: npm run build:web

      - name: Add the iOS platform + sync the web bundle into it
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Generate the app icon + splash from resources/
        script: npx @capacitor/assets generate --ios || true

      - name: BULLETPROOF iOS app icon generation (sips fallback)
        script: |
          # v1.0.22: @capacitor/assets@3 has been unreliable - sometimes
          # it produces no icons at all (silently), leaving the .ipa with
          # Capacitor's default placeholder. This step uses macOS-builtin
          # `sips` to manually regenerate EVERY required iOS app-icon size
          # from resources/icon.png + write a correct Contents.json.
          # Idempotent: overwrites whatever the previous step did.
          set -e
          APPICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$APPICON_DIR"
          SRC="resources/icon.png"
          if [ ! -f "$SRC" ]; then
            echo "FATAL: $SRC missing"; exit 1
          fi
          echo "Generating iOS app icons from $SRC (using sips)..."
          sips -s format png -z 40    40    "$SRC" --out "$APPICON_DIR/AppIcon-20x20@2x.png"
          sips -s format png -z 60    60    "$SRC" --out "$APPICON_DIR/AppIcon-20x20@3x.png"
          sips -s format png -z 58    58    "$SRC" --out "$APPICON_DIR/AppIcon-29x29@2x.png"
          sips -s format png -z 87    87    "$SRC" --out "$APPICON_DIR/AppIcon-29x29@3x.png"
          sips -s format png -z 80    80    "$SRC" --out "$APPICON_DIR/AppIcon-40x40@2x.png"
          sips -s format png -z 120   120   "$SRC" --out "$APPICON_DIR/AppIcon-40x40@3x.png"
          sips -s format png -z 120   120   "$SRC" --out "$APPICON_DIR/AppIcon-60x60@2x.png"
          sips -s format png -z 180   180   "$SRC" --out "$APPICON_DIR/AppIcon-60x60@3x.png"
          sips -s format png -z 152   152   "$SRC" --out "$APPICON_DIR/AppIcon-76x76@2x.png"
          sips -s format png -z 167   167   "$SRC" --out "$APPICON_DIR/AppIcon-83.5x83.5@2x.png"
          sips -s format png -z 1024  1024  "$SRC" --out "$APPICON_DIR/AppIcon-1024x1024.png"
          # Write Contents.json mapping every required size -> the files above.
          # Modern (iOS 14+) AppIcon catalog format.
          cat > "$APPICON_DIR/Contents.json" <<'JSON'
          {
            "images" : [
              { "size" : "20x20",       "idiom" : "iphone", "filename" : "AppIcon-20x20@2x.png",     "scale" : "2x" },
              { "size" : "20x20",       "idiom" : "iphone", "filename" : "AppIcon-20x20@3x.png",     "scale" : "3x" },
              { "size" : "29x29",       "idiom" : "iphone", "filename" : "AppIcon-29x29@2x.png",     "scale" : "2x" },
              { "size" : "29x29",       "idiom" : "iphone", "filename" : "AppIcon-29x29@3x.png",     "scale" : "3x" },
              { "size" : "40x40",       "idiom" : "iphone", "filename" : "AppIcon-40x40@2x.png",     "scale" : "2x" },
              { "size" : "40x40",       "idiom" : "iphone", "filename" : "AppIcon-40x40@3x.png",     "scale" : "3x" },
              { "size" : "60x60",       "idiom" : "iphone", "filename" : "AppIcon-60x60@2x.png",     "scale" : "2x" },
              { "size" : "60x60",       "idiom" : "iphone", "filename" : "AppIcon-60x60@3x.png",     "scale" : "3x" },
              { "size" : "20x20",       "idiom" : "ipad",   "filename" : "AppIcon-20x20@2x.png",     "scale" : "2x" },
              { "size" : "29x29",       "idiom" : "ipad",   "filename" : "AppIcon-29x29@2x.png",     "scale" : "2x" },
              { "size" : "40x40",       "idiom" : "ipad",   "filename" : "AppIcon-40x40@2x.png",     "scale" : "2x" },
              { "size" : "76x76",       "idiom" : "ipad",   "filename" : "AppIcon-76x76@2x.png",     "scale" : "2x" },
              { "size" : "83.5x83.5",   "idiom" : "ipad",   "filename" : "AppIcon-83.5x83.5@2x.png", "scale" : "2x" },
              { "size" : "1024x1024",   "idiom" : "ios-marketing",                                    "filename" : "AppIcon-1024x1024.png", "scale" : "1x" }
            ],
            "info" : { "version" : 1, "author" : "xcode" }
          }
          JSON
          echo "=== Contents of $APPICON_DIR (verify all PNGs are present + sized): ==="
          ls -la "$APPICON_DIR/"
          echo "=== Verify the 1024 App Store icon exists + dimensions ==="
          if [ ! -f "$APPICON_DIR/AppIcon-1024x1024.png" ]; then
            echo "FATAL: 1024 App Store icon missing"; exit 1
          fi
          sips -g pixelWidth -g pixelHeight "$APPICON_DIR/AppIcon-1024x1024.png"
          echo "=== iOS app icons successfully generated ==="

      - name: Lock the iOS app to landscape-only orientation
        script: |
          # Capacitor regenerates Info.plist on every build, so we force
          # landscape-only here (Mark: "landscape only, no turn-phone
          # words"). iOS then simply keeps the app in landscape - the user
          # is never prompted to rotate. Applies to both iPhone + iPad.
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy
          for KEY in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            $PB -c "Delete :$KEY" "$PLIST" 2>/dev/null || true
            $PB -c "Add :$KEY array" "$PLIST"
            $PB -c "Add :$KEY:0 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
            $PB -c "Add :$KEY:1 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          done
          # iPad normally REQUIRES all 4 orientations (for Split View /
          # multitasking) - landscape-only otherwise triggers App Store
          # upload error 90474. We're a full-screen landscape game, so opt
          # OUT of multitasking with UIRequiresFullScreen=true, which makes
          # the landscape-only lock valid on iPad too. (Standard for games.)
          $PB -c "Delete :UIRequiresFullScreen" "$PLIST" 2>/dev/null || true
          $PB -c "Add :UIRequiresFullScreen bool true" "$PLIST"
          echo "--- iPhone orientations now: ---"
          $PB -c "Print :UISupportedInterfaceOrientations" "$PLIST"
          echo "--- UIRequiresFullScreen: ---"
          $PB -c "Print :UIRequiresFullScreen" "$PLIST"

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Set up code signing (mint a fresh distribution cert + profile)
        script: |
          keychain initialize
          # ROOT-CAUSE FIX (confirmed from the diagnostic build):
          # the account has ZERO iOS Distribution certificates whose
          # private key lives on this cloud Mac, so Codemagic could not
          # save a signing identity ("Cannot save Signing Certificates
          # without certificate private key"). We generate a fresh private
          # key and pass it with --certificate-key, so --create mints a
          # brand-new iOS Distribution certificate we own PLUS the App
          # Store provisioning profile for our bundle id, and saves a
          # usable .p12 into the keychain.
          # CERT REUSE: if you've stored a stable private key as the
          # Codemagic secure env var CERT_PRIVATE_KEY, we reuse it so
          # fetch-signing-files finds the SAME certificate every build
          # (no new cert minted - avoids Apple's 2-cert limit). If the
          # var is unset, we fall back to generating a fresh key (which
          # mints a new cert that build). To enable reuse: Codemagic app
          # settings -> Environment variables -> add CERT_PRIVATE_KEY =
          # (output of `openssl genrsa 2048`), mark it Secure.
          CERT_KEY=/tmp/codemagic_dist_key.pem
          if [ -n "$CERT_PRIVATE_KEY" ]; then
            printf '%s' "$CERT_PRIVATE_KEY" > "$CERT_KEY"
            echo "Using stored CERT_PRIVATE_KEY (certificate will be reused)."
          else
            openssl genrsa -out "$CERT_KEY" 2048
            echo "No CERT_PRIVATE_KEY set - generating a fresh key (mints a new cert this build)."
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:"$CERT_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
          echo "--- codesigning identities after setup (expect 1 valid) ---"
          security find-identity -v -p codesigning || true

      - name: Set the marketing version + auto-incrementing build number
        script: |
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build the signed .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Upload the build to App Store Connect, but do NOT auto-submit
        # to TestFlight EXTERNAL beta review - that needs Beta App Review
        # contact info + a separate Apple review, and is NOT required to
        # release on the App Store. The build still lands in App Store
        # Connect, ready to attach to a version and submit for App Store
        # review. (You can also add yourself as an INTERNAL TestFlight
        # tester - no beta review needed.) Set back to true + fill in the
        # test info only if you later want to distribute EXTERNAL betas.
        submit_to_testflight: false
