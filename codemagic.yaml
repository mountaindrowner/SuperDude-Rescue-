# Codemagic CI/CD - build Super Dude Danny (Capacitor) for the iOS App
# Store ENTIRELY in the cloud, so no local Xcode and no macOS upgrade is
# needed. Codemagic runs this on its own modern macOS + Xcode machines.
#
# One-time setup is documented step-by-step in CODEMAGIC_SETUP.md. The
# short version:
#   1. Create an App Store Connect API key (.p8) with ADMIN access and
#      upload it to Codemagic as an integration named exactly
#      superdude_asc (or rename it here to whatever you call it). Admin
#      is required so the signing step below can CREATE the certificate
#      + profile + bundle ID automatically.
#   2. Create the app record in App Store Connect (New App, same bundle
#      ID). Needed so the final TestFlight upload has a target. (The App
#      ID / bundle identifier itself is auto-registered by the signing
#      step's --create, so you don't have to register it by hand first.)
#   3. Connect this GitHub repo + branch in Codemagic, then run the
#      "ios-appstore" workflow below.
#
# Nothing here changes the game. build:web just assembles the same clean
# web bundle that Netlify already publishes; Capacitor wraps it.

workflows:
  ios-appstore:
    name: Super Dude Danny - iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    # The App Store Connect API key you upload to Codemagic. The name on
    # the right MUST match the integration name you create in the
    # Codemagic UI (Teams/Personal settings -> Integrations -> App Store
    # Connect). See CODEMAGIC_SETUP.md Phase 5.
    integrations:
      app_store_connect: superdude_asc

    environment:
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "org.thecrossroads.superdudeadventures"
        # Marketing version shown on the store. Keep in step with
        # SDD.VERSION in js/main.js (strip the leading "v").
        MARKETING_VERSION: "1.0.3"

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Assemble the clean web bundle (www/)
        script: npm run build:web

      - name: Add the iOS platform + sync the web bundle into it
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Generate the app icon + splash from resources/
        script: npx @capacitor/assets generate --ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Set up code signing (DIAGNOSTIC - prints account state)
        script: |
          echo "========== A. distribution certificates in the account =========="
          # If this lists 2 already, we're at Apple's limit and a NEW one
          # can't be created -> the cloud Mac then has a profile but no
          # usable signing identity (private key), which is the likely
          # root cause. We do NOT have the private keys for certs created
          # on your personal Mac for your other app.
          app-store-connect certificates list --type IOS_DISTRIBUTION || true
          echo "========== B. existing app_store profiles =========="
          app-store-connect profiles list --type IOS_APP_STORE || true
          echo "========== C. initialize keychain =========="
          keychain initialize
          echo "========== D. fetch/create signing files (verbose) =========="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --verbose
          echo "========== E. import certs into keychain =========="
          keychain add-certificates
          echo "========== F. provisioning profiles now on disk =========="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || echo "NONE on disk"
          echo "========== G. valid codesigning identities in keychain =========="
          # '0 valid identities found' here = the cert/private-key problem.
          security find-identity -v -p codesigning || true
          echo "========== H. apply profiles to the Xcode project =========="
          xcode-project use-profiles --verbose

      - name: Set the marketing version + auto-incrementing build number
        script: |
          cd ios/App
          agvtool new-marketing-version "$MARKETING_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build the signed .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Uploads the build to TestFlight automatically. We leave the
        # final "submit to App Store review" step MANUAL for the first
        # release, so you can fill in screenshots + metadata in App Store
        # Connect first, then hit Submit there. Flip this to true later
        # if you want fully hands-off releases.
        submit_to_testflight: true
