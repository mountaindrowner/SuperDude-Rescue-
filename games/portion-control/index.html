<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Portion Control</title>
<style>
  html, body { margin: 0; padding: 0; background: #1b1530; height: 100%; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<div id="game"></div>
<!-- PC_BUILD is THE version bump point: it stamps every screen (via
     PC.VERSION) and cache-busts every script + art URL, so a device can
     never mix files from two builds (the v0.11.3 "purple squares" bug
     was exactly that: new weapon code + a stale cached asset registry). -->
<script>window.PC_BUILD = '0.17.1';</script>
<script>
(function () {
  var files = [
    'vendor/phaser.min.js',
    'assets/art/manifest.js',
    'src/config.js',
    'src/handart.js',
    'src/assets.js',
    'src/systems/input.js',
    'src/systems/world.js',
    'src/systems/ground.js',
    'src/systems/spatialhash.js',
    'src/systems/enemies.js',
    'src/systems/spawn.js',
    'src/systems/audio.js',
    'src/systems/fx.js',
    'src/systems/juice.js',
    'src/systems/vfx.js',
    'src/systems/gems.js',
    'src/systems/pickups.js',
    'src/systems/weapons.js',
    'src/systems/kits.js',
    'src/systems/arsenal2.js',
    'src/systems/arsenal3.js',
    'src/systems/heroes2.js',
    'src/data/evolutions.js',
    'src/data/powerups.js',
    'src/data/story/scripts.js',
    'src/data/story/map1.js',
    'src/story/dialogue.js',
    'src/story/cutscene.js',
    'src/story/region.js',
    'src/systems/boss.js',
    'src/scenes/boot.js',
    'src/scenes/title.js',
    'src/scenes/select.js',
    'src/scenes/shop.js',
    'src/scenes/game.js',
    'src/scenes/results.js',
    'src/main.js',
  ];
  for (var i = 0; i < files.length; i++) {
    document.write('<script src="' + files[i] + '?v=' + window.PC_BUILD + '"><\/script>');
  }
})();
</script>
</body>
</html>
