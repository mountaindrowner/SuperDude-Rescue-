<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15182a">
<title>Super Dude Runner — 3D Lab Escape</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0c14; overflow: hidden;
    font-family: system-ui, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#game { background: #15182a; width: 100vw; height: 100vh; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none;
        font-family: system-ui, "Segoe UI", sans-serif; }
  #topbar { position: absolute; top: 8px; left: 8px; right: 8px;
            background: rgba(20,24,38,0.74); border-radius: 10px; padding: 8px 12px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .row { display: flex; justify-content: space-between; align-items: center; color: #e8ecf3; }
  .row + .row { margin-top: 4px; }
  .lbl { font-weight: 700; font-size: 16px; }
  .lbl.big { font-size: 22px; color: #b8a8ff; text-shadow: 0 0 10px rgba(184,168,255,0.45); }
  .lbl.dim { color: #9aa0c4; font-weight: 600; font-size: 13px; }
  .lbl.cyan { color: #46f0ff; }
  .bar { height: 4px; background: rgba(155,108,255,0.20); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: linear-gradient(to right, #6a1880, #b8a8ff, #46f0ff); transition: width .12s linear;
               box-shadow: 0 0 10px rgba(184,168,255,0.5); }
  #powers { position: absolute; left: 14px; top: 88px; display: flex; gap: 8px; pointer-events: none; }
  .pwr { padding: 5px 12px; border-radius: 18px; color: #fff; font-weight: 800; font-size: 12px;
         box-shadow: 0 2px 12px rgba(0,0,0,0.4); display: none; letter-spacing: 1px; }
  .pwr.on { display: inline-block; }
  .pwr.shield { background: linear-gradient(135deg, #0fb8d0, #1ab3ff); }
  .pwr.magnet { background: linear-gradient(135deg, #d33a3a, #ff6a4a); }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
             flex-direction: column; background: rgba(10,12,20,0.86); color: #fff; pointer-events: auto; cursor: pointer; }
  #overlay.on { display: flex; }
  #overlay h1 { margin: 0; font-size: 48px; letter-spacing: 2px; color: #ffd23a;
                text-shadow: 0 0 16px rgba(255,210,58,0.5); }
  #overlay h2 { margin: 6px 0 12px; font-size: 28px; color: #e8a516; }
  #overlay p  { margin: 4px 0; color: #cfd6e4; }
  #overlay .blink { margin-top: 24px; font-size: 18px; opacity: .9; }
  #hint { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center;
          color: #6d7398; font-size: 12px; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="ui">
  <div id="topbar">
    <div class="row">
      <span class="lbl big">💎 <span id="ui-gears">0</span> / <span id="ui-goal">50</span></span>
      <span class="lbl"><span style="color:#9aa0c4">BEST</span> <span id="ui-best" style="color:#b8a8ff">0</span></span>
    </div>
    <div class="row">
      <span class="lbl cyan">SCORE <span id="ui-score">0</span></span>
      <span class="lbl dim"><span id="ui-dist">0</span> m</span>
    </div>
    <div class="bar"><div id="ui-prog" style="width:0%"></div></div>
  </div>
  <div id="powers">
    <span class="pwr shield" id="pwr-shield">🛡 SHIELD</span>
    <span class="pwr magnet" id="pwr-magnet">🧲 MAGNET</span>
  </div>
  <div id="overlay">
    <h1 id="ov-h1">CAUGHT!</h1>
    <h2 id="ov-h2"></h2>
    <p id="ov-p1"></p>
    <p id="ov-p2"></p>
    <div class="blink" id="ov-cta">TAP TO RUN AGAIN</div>
  </div>
</div>
<div id="hint">← → swap &nbsp;•&nbsp; ↑ jump &nbsp;•&nbsp; ↓ slide &nbsp;•&nbsp; swipe on touch</div>

<script type="module">
import * as THREE from 'three';

// ============ scene setup =============================================
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0f1a);
scene.fog = new THREE.Fog(0x0c0f1a, 18, 80);

// 45° elevated camera looking down at Danny — no roof needed
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 200);
camera.position.set(0, 9.0, 11.0);
camera.lookAt(0, 0.5, 1.0);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

// ============ lighting (moody industrial) =============================
scene.add(new THREE.AmbientLight(0x6a7a90, 0.5));
const sun = new THREE.DirectionalLight(0xa0b8d0, 0.55);
sun.position.set(2, 10, 4);
scene.add(sun);

const ceilLights = [];
for (let i = 0; i < 8; i++) {
  const pl = new THREE.PointLight(0xfff1c8, 0.85, 12, 1.8);
  pl.position.set(0, 4.2, -i * 14);
  scene.add(pl); ceilLights.push(pl);
}
// accent point lights from specimen tubes (green glow)
const tubeLights = [];

// ============ procedural textures =====================================
function makeWallTexture() {
  const W = 2048, H = 512;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');

  // dark industrial base
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0e1a');
  bg.addColorStop(0.30, '#1a2030');
  bg.addColorStop(0.70, '#2a3144');
  bg.addColorStop(1, '#15192a');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  // ceiling girder
  g.fillStyle = '#0a0e1a'; g.fillRect(0, 0, W, 28);
  // cyan LED accent strip
  g.fillStyle = '#1ab3ff'; g.fillRect(0, 28, W, 2);
  g.fillStyle = 'rgba(70,240,255,0.35)'; g.fillRect(0, 30, W, 4);

  // baseboard
  g.fillStyle = '#05070d'; g.fillRect(0, H - 22, W, 22);
  g.fillStyle = '#2a3144'; g.fillRect(0, H - 24, W, 2);
  // floor warning stripe
  for (let x = 0; x < W; x += 22) {
    g.fillStyle = (x / 22) % 2 < 1 ? '#ffd23a' : '#1a2030';
    g.fillRect(x, H - 10, 22, 4);
  }

  // panel seams
  for (let x = 0; x < W; x += 256) {
    g.fillStyle = '#0a0e1a'; g.fillRect(x - 2, 32, 4, H - 56);
    g.fillStyle = '#3a4d75'; g.fillRect(x, 32, 1, H - 56);
  }
  // horizontal mid-rail
  g.fillStyle = '#0a0e1a'; g.fillRect(0, H * 0.50, W, 4);
  g.fillStyle = '#3a4d75'; g.fillRect(0, H * 0.50 + 4, W, 1);

  // helpers
  function bracketBox(px, py, w, h, tint, label) {
    // back box
    g.fillStyle = '#05070d'; g.fillRect(px, py, w, h);
    // face
    g.fillStyle = '#1a2030'; g.fillRect(px + 4, py + 4, w - 8, h - 8);
    // tinted accent
    g.fillStyle = tint; g.fillRect(px + 8, py + 8, w - 16, 4);
    g.fillRect(px + 8, py + h - 12, w - 16, 4);
    // label plate
    g.fillStyle = '#05070d';
    g.fillRect(px + 12, py + h - 36, w - 24, 24);
    g.fillStyle = tint; g.font = 'bold 14px system-ui'; g.textAlign = 'center';
    g.fillText(label, px + w/2, py + h - 18);
  }
  function monitor(px) {
    const x = px + 28, y = 80, w = 200, h = 140;
    // backing
    g.fillStyle = '#05070d'; g.fillRect(x - 6, y - 6, w + 12, h + 50);
    // screen bezel
    g.fillStyle = '#0a0e1a'; g.fillRect(x, y, w, h);
    g.fillStyle = '#1ab3ff'; g.fillRect(x + 4, y + 4, w - 8, h - 8);
    g.fillStyle = '#0a1a2a'; g.fillRect(x + 8, y + 8, w - 16, h - 18);
    // waveform
    g.fillStyle = '#46f0ff';
    for (let bi = 0; bi < 14; bi++) {
      const bh = (h - 30) * (0.20 + 0.7 * Math.abs(Math.sin(bi * 1.7 + px * 0.01)));
      const bxx = x + 12 + bi * ((w - 24) / 14);
      g.fillRect(bxx, y + h - bh - 14, (w - 24) / 14 - 2, bh);
    }
    // bottom controls
    g.fillStyle = '#d33a3a'; g.fillRect(x + 20, y + h + 8, 10, 10);
    g.fillStyle = '#10b981'; g.fillRect(x + 42, y + h + 8, 10, 10);
    g.fillStyle = '#ffd23a'; g.fillRect(x + 64, y + h + 8, 10, 10);
    g.fillStyle = '#46f0ff'; g.font = 'bold 11px system-ui'; g.textAlign = 'left';
    g.fillText('LAB OS v3.4', x + 90, y + h + 18);
  }
  function pipesRack(px) {
    const x = px, y = 30, w = 256, h = 420;
    const cols = ['#d33a3a','#1ab3ff','#10b981','#e8a516'];
    for (let pi = 0; pi < 4; pi++) {
      const px2 = x + 28 + pi * 56;
      g.fillStyle = '#0a0e1a'; g.fillRect(px2 - 2, y, 22, h);
      g.fillStyle = '#2a3144'; g.fillRect(px2, y, 18, h);
      g.fillStyle = cols[pi]; g.fillRect(px2 + 6, y, 6, h);
      g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(px2 + 5, y, 3, h);
      g.fillStyle = '#05070d';
      g.fillRect(px2 - 4, y + 60, 26, 10);
      g.fillRect(px2 - 4, y + 220, 26, 10);
      g.fillRect(px2 - 4, y + 360, 26, 10);
      g.fillStyle = '#5a6378';
      g.beginPath(); g.arc(px2 + 9, y + 140, 14, 0, 7); g.fill();
      g.fillStyle = '#aab4c4';
      g.beginPath(); g.arc(px2 + 9, y + 140, 4, 0, 7); g.fill();
    }
    // warning sign
    bracketBox(x + 88, y + 380, 80, 30, '#d33a3a', 'HIGH PRES');
  }
  function vent(px) {
    const x = px + 30, y = 84, w = 196, h = 240;
    g.fillStyle = '#05070d'; g.fillRect(x - 6, y - 6, w + 12, h + 12);
    g.fillStyle = '#0a0e1a'; g.fillRect(x, y, w, h);
    g.strokeStyle = '#5a6378'; g.lineWidth = 2;
    for (let vi = 0; vi < 12; vi++) {
      const vy = y + 10 + vi * ((h - 20) / 12);
      g.beginPath(); g.moveTo(x + 8, vy); g.lineTo(x + w - 8, vy); g.stroke();
    }
    g.fillStyle = '#3a4d75';
    g.fillRect(x - 4, y - 4, w + 8, 6);
    g.fillRect(x - 4, y + h - 2, w + 8, 6);
    bracketBox(x + 24, y + h + 16, w - 48, 30, '#ffd23a', 'AIR FLOW ⟶');
  }
  function locker(px) {
    const x = px + 24, y = 40, w = 208, h = 420;
    g.fillStyle = '#05070d'; g.fillRect(x, y, w, h);
    for (let li = 0; li < 3; li++) {
      const lx = x + 6 + li * ((w - 12) / 3);
      const lw = (w - 12) / 3 - 4;
      g.fillStyle = '#1a2030'; g.fillRect(lx, y + 6, lw, h - 12);
      g.fillStyle = '#3a4d75'; g.fillRect(lx, y + 6, lw, 4);
      g.fillStyle = '#3a4d75'; g.fillRect(lx, y + h/2, lw, 1);
      g.fillStyle = '#ffd23a'; g.fillRect(lx + lw - 14, y + h/2 - 4, 8, 6);
      g.fillStyle = ['#1b9fb3','#10b981','#d33a3a'][li];
      g.fillRect(lx + 6, y + 22, lw - 12, 22);
      g.fillStyle = '#fff'; g.font = 'bold 14px system-ui'; g.textAlign = 'center';
      g.fillText(['BIO','CHEM','RAD'][li], lx + lw/2, y + 38);
    }
  }
  function bigsign(px, color, label) {
    const x = px + 12, y = 38, w = 232, h = 60;
    g.fillStyle = '#05070d'; g.fillRect(x, y, w, h);
    g.fillStyle = color; g.fillRect(x + 4, y + 4, w - 8, h - 8);
    // adaptive font size — scale down for long labels so they fit
    const fontSize = label.length <= 8 ? 28 : label.length <= 14 ? 22 : 18;
    g.fillStyle = '#0a0e1a'; g.font = 'bold ' + fontSize + 'px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(label, x + w/2, y + h/2);
    g.textBaseline = 'alphabetic';
    g.fillStyle = '#ffd23a';
    g.fillRect(x + 8, y + 8, 4, 4); g.fillRect(x + w - 12, y + 8, 4, 4);
    g.fillRect(x + 8, y + h - 12, 4, 4); g.fillRect(x + w - 12, y + h - 12, 4, 4);
  }
  const features = [
    p => monitor(p),
    p => pipesRack(p),
    p => vent(p),
    p => locker(p),
    p => monitor(p),
    p => pipesRack(p),
  ];
  for (let i = 0, x = 0; x < W; i++, x += 256) {
    features[i % features.length](x);
  }
  // 8 funny signs (rotated through Mark's list)
  bigsign(20,   '#1b9fb3', "DANNY'S LAB");
  bigsign(280,  '#d33a3a', 'DO NOT PRESS');
  bigsign(540,  '#f59e0b', 'CAUTION');
  bigsign(810,  '#10b981', 'WET FLOOR');
  bigsign(1080, '#1b9fb3', 'EXPERIMENT IN PROGRESS');
  bigsign(1340, '#d33a3a', 'NOT THAT EMERGENCY');
  bigsign(1600, '#f59e0b', 'RUNNING DETECTED');
  bigsign(1860, '#10b981', 'SLIPPERY SCIENCE');

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.repeat.set(4, 1);
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipMapLinearFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeFloorTexture() {
  const W = 1024, H = 1024;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  // base concrete floor (slightly noisy gray)
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#3e4453'); bg.addColorStop(1, '#5a6378');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // noise
  for (let i = 0; i < 1400; i++) {
    g.fillStyle = 'rgba(255,255,255,' + (0.02 + Math.random()*0.04) + ')';
    g.fillRect(Math.random()*W, Math.random()*H, 1.5, 1.5);
  }
  // panel cracks
  g.strokeStyle = '#2a3144'; g.lineWidth = 2;
  for (let x = 0; x <= W; x += 256) {
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
  }
  for (let y = 0; y <= H; y += 512) {
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  // BOLD WHITE PAINTED CENTER STRIPE (the iconic Subway-Surfers look)
  g.fillStyle = '#e8ecf3';
  g.fillRect(W/2 - 9, 0, 18, H);
  // chips and wear on the stripe
  for (let y = 0; y < H; y += 64) {
    if (Math.random() < 0.18) {
      g.fillStyle = '#3e4453';
      g.fillRect(W/2 - 9 + Math.random()*18, y, 2 + Math.random()*4, 4 + Math.random()*4);
    }
  }
  // lane edge thin lines (very subtle)
  g.fillStyle = 'rgba(255,255,255,0.10)';
  g.fillRect(W/2 - 220, 0, 2, H);
  g.fillRect(W/2 + 218, 0, 2, H);

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 24);
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipMapLinearFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeCeilTexture() {
  const W = 512, H = 1024;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#15192a'; g.fillRect(0, 0, W, H);
  // pipe channels
  ['#d33a3a','#1ab3ff','#10b981'].forEach((col, i) => {
    g.fillStyle = '#05070d'; g.fillRect(60 + i * 60 - 2, 0, 22, H);
    g.fillStyle = '#2a3144'; g.fillRect(60 + i * 60, 0, 18, H);
    g.fillStyle = col; g.fillRect(64 + i * 60, 0, 10, H);
  });
  for (let y = 0; y < H; y += 128) {
    g.fillStyle = '#05070d';
    g.fillRect(56, y, 218, 8);
  }
  // recessed light fixtures (glowy bands)
  for (let y = 64; y < H; y += 256) {
    g.fillStyle = '#05070d'; g.fillRect(W/2 - 86, y - 22, 172, 44);
    g.fillStyle = '#fff8d8'; g.fillRect(W/2 - 78, y - 14, 156, 28);
    g.fillStyle = '#ffffff'; g.fillRect(W/2 - 68, y - 8, 136, 6);
  }
  // vents
  for (let y = 192; y < H; y += 256) {
    g.fillStyle = '#05070d'; g.fillRect(W - 110, y - 32, 88, 64);
    g.strokeStyle = '#5a6378'; g.lineWidth = 1.5;
    for (let li = 0; li < 6; li++) {
      g.beginPath();
      g.moveTo(W - 102, y - 26 + li * 10);
      g.lineTo(W - 30, y - 26 + li * 10);
      g.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 18);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ============ corridor ===============================================
const LANE_X = 1.8;
const CORR_HALF_W = 4.0;
const CORR_H = 5;
const CORR_LEN = 240;
const CORR_CENTER_Z = -CORR_LEN / 2 + 6;

const wallTex = makeWallTexture();
const floorTex = makeFloorTexture();
const ceilTex = makeCeilTexture();

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(CORR_HALF_W * 2, CORR_LEN),
  new THREE.MeshLambertMaterial({ map: floorTex })
);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, CORR_CENTER_Z);
scene.add(floor);

// Mark's note: "the game doesn't need a roof" — ceiling removed.
// Ceiling point lights kept (they still illuminate from above) so the
// corridor doesn't go dark.

const wallGeo = new THREE.PlaneGeometry(CORR_LEN, CORR_H);
const wallMatL = new THREE.MeshLambertMaterial({ map: wallTex });
const wallTexR = wallTex.clone(); wallTexR.needsUpdate = true; wallTexR.offset.x = 0.5;
const wallMatR = new THREE.MeshLambertMaterial({ map: wallTexR });
const wallL = new THREE.Mesh(wallGeo, wallMatL);
wallL.rotation.y = Math.PI / 2;
wallL.position.set(-CORR_HALF_W, CORR_H/2, CORR_CENTER_Z);
scene.add(wallL);
const wallR = new THREE.Mesh(wallGeo, wallMatR);
wallR.rotation.y = -Math.PI / 2;
wallR.position.set(CORR_HALF_W, CORR_H/2, CORR_CENTER_Z);
scene.add(wallR);

// ============ side props (3D décor) =================================
// SPECIMEN TUBES — the iconic green-glowing alien jars from the reference
function makeSpecimenTube(alienColor) {
  const grp = new THREE.Group();
  // base pedestal
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.55, 0.65, 0.35, 16),
    new THREE.MeshLambertMaterial({ color: 0x2a3144 })
  );
  base.position.y = 0.175;
  grp.add(base);
  // base rim
  const rim = new THREE.Mesh(
    new THREE.CylinderGeometry(0.58, 0.58, 0.10, 16),
    new THREE.MeshLambertMaterial({ color: 0x1ab3ff, emissive: 0x0a76b0 })
  );
  rim.position.y = 0.38;
  grp.add(rim);
  // glass cylinder (transparent green)
  const glass = new THREE.Mesh(
    new THREE.CylinderGeometry(0.48, 0.48, 2.2, 18, 1, true),
    new THREE.MeshLambertMaterial({
      color: 0x39e36e, emissive: 0x0e6a2a, emissiveIntensity: 0.8,
      transparent: true, opacity: 0.55, side: THREE.DoubleSide
    })
  );
  glass.position.y = 1.55;
  grp.add(glass);
  // liquid (slightly more solid green)
  const liquid = new THREE.Mesh(
    new THREE.CylinderGeometry(0.46, 0.46, 2.0, 18),
    new THREE.MeshLambertMaterial({
      color: 0x39e36e, emissive: 0x1aa040, emissiveIntensity: 1.2,
      transparent: true, opacity: 0.45
    })
  );
  liquid.position.y = 1.55;
  grp.add(liquid);
  // top cap
  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.52, 0.52, 0.20, 16),
    new THREE.MeshLambertMaterial({ color: 0x05070d })
  );
  cap.position.y = 2.75;
  grp.add(cap);
  const cap2 = new THREE.Mesh(
    new THREE.CylinderGeometry(0.55, 0.52, 0.10, 16),
    new THREE.MeshLambertMaterial({ color: 0x3a4d75 })
  );
  cap2.position.y = 2.90;
  grp.add(cap2);
  // alien creature inside
  const alien = new THREE.Mesh(
    new THREE.SphereGeometry(0.30, 14, 12),
    new THREE.MeshLambertMaterial({ color: alienColor, emissive: alienColor, emissiveIntensity: 0.3 })
  );
  alien.scale.set(1, 1.2, 1);
  alien.position.y = 1.4;
  grp.add(alien);
  grp.userData.alien = alien;
  // eyes
  for (let i = -1; i <= 1; i += 2) {
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );

const FACTORIES = {
  crystal: makeChronoCrystal, shield: makeShield, magnet: makeMagnet,
  // Mark's MVP-10:
  redx: makeRedXCrate, lowlaser: makeLowLaser, highlaser: makeHighLaser,
  efence: makeElecFence, labcart: makeLabCart, steamvent: makeSteamVent,
  slime: makeSlimePuddle, robotarm: makeRobotArm, spectank: makeSpecimenTankBlock,
  portalcrack: makePortalCrack
};
// clearance metadata: how each hazard is cleared by the player
const HAZARD_META = {
  redx:        { clear: 'lane',  height: 1.2 },
  lowlaser:    { clear: 'jump',  height: 0.7 },
  highlaser:   { clear: 'slide', height: 1.6 },
  efence:      { clear: 'lane',  height: 1.7 },
  labcart:     { clear: 'lane',  height: 1.0 },
  steamvent:   { clear: 'timed', height: 2.0 },   // jump during off-cycle
  slime:       { clear: 'jump',  height: 0.3 },
  robotarm:    { clear: 'slide', height: 1.3 },
  spectank:    { clear: 'lane',  height: 2.2 },
  portalcrack: { clear: 'jump',  height: 0.1 }
};
const HAZARDS_BY_CLEAR = {
  jump:  ['lowlaser','slime','portalcrack'],
  slide: ['highlaser','robotarm'],
  lane:  ['redx','efence','labcart','spectank'],
  timed: ['steamvent']
};
function pickHazardByWeights() {
  // 30% jump / 20% slide / 40% lane / 10% timed
  const r = Math.random();
  let bucket;
  if      (r < 0.30) bucket = 'jump';
  else if (r < 0.50) bucket = 'slide';
  else if (r < 0.90) bucket = 'lane';
  else               bucket = 'timed';
  const opts = HAZARDS_BY_CLEAR[bucket];
  return opts[Math.floor(Math.random() * opts.length)];
}
function spawnObj(kind, lane, z) {
  const m = FACTORIES[kind]();
  m.position.set(lanePosX(lane), 0, z);
  if (kind === 'crystal' || kind === 'shield' || kind === 'magnet') m.position.y = 1.1;
  pickGroup.add(m);
  const meta = HAZARD_META[kind] || null;
  objects.push({
    kind, lane, z, mesh: m, got: false,
    phase: Math.random() * Math.PI * 2,
    clear: meta ? meta.clear : null,
    height: meta ? meta.height : 0,
    // timed-hazard cycle state (steam vent)
    cycleT: Math.random() * 1.4
  });
}
const FAR_Z = -110;
function trySpawn() {
  const r = Math.random();
  const lane = Math.floor(Math.random()*3) - 1;
  if      (r < 0.06) spawnObj('shield', lane, FAR_Z);
  else if (r < 0.10) spawnObj('magnet', lane, FAR_Z);
  else if (r < 0.46) {
    // single hazard
    const pick = pickHazardByWeights();
    spawnObj(pick, lane, FAR_Z);
    // 22% chance to double up in another lane (forces a swap or right input)
    if (Math.random() < 0.22) {
      const opts = [-1,0,1].filter(L => L !== lane);
      const lane2 = opts[Math.floor(Math.random()*opts.length)];
      const pick2 = pickHazardByWeights();
      spawnObj(pick2, lane2, FAR_Z - 1.2);
    }
  } else if (r < 0.62) {
    // crystal string (3-5 in a lane)
    const n = 3 + Math.floor(Math.random()*3);
    for (let k = 0; k < n; k++) spawnObj('crystal', lane, FAR_Z - k * 2.0);
  } else {
    spawnObj('crystal', lane, FAR_Z);
  }
}

// ============ game state =============================================
const CRYSTAL_GOAL = 50;
let state = 'play';
let dist = 0, speed = 16.0, crystals = 0, goalDone = false;
let best = parseInt(localStorage.getItem('sdr_best') || '0', 10) || 0;
let bestC = parseInt(localStorage.getItem('sdr_bestC') || '0', 10) || 0;
let lane = 0, laneF = 0;
let jumpV = 0, jumpY = 0, onGround = true;
let slideT = 0;                                    // seconds remaining in slide
const SLIDE_DURATION = 0.6;
let shield = 0, magnet = 0;
let spawnAcc = 0;
let runT = 0;
// Mark: "right now he's just shaking." Bug was driving stride animation
// from runT (which advances by dt*speed = ~0.27/frame at speed 16),
// times the 6.5 stride multiplier = 1.74 rad/frame — faster than the
// lerp can chase, so limbs vibrated near zero. Stride now drives off
// a dedicated wall-clock phase that advances at a real-world cadence
// (~1.7 cycles/sec at base speed, ramping with run speed).
let stridePhase = 0;
let shake = 0;

// ============ input ==================================================
function moveLane(d) { if (state==='play') lane = Math.max(-1, Math.min(1, lane + d)); }
function doJump() {
  if (state !== 'play') return;
  // Slide cancels into jump if you tap up while sliding
  if (slideT > 0) slideT = 0;
  if (onGround) { jumpV = 7.0; onGround = false; }
}
function doSlide() {
  if (state !== 'play') return;
  // mid-air slide drops you to ground for a slide
  if (!onGround) { jumpY = 0; jumpV = 0; onGround = true; }
  slideT = SLIDE_DURATION;
}
window.addEventListener('keydown', e => {
  if (state !== 'play' && (e.key === ' ' || e.key === 'Enter')) { reset(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'a') moveLane(-1);
  else if (e.key === 'ArrowRight' || e.key === 'd') moveLane(1);
  else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') { e.preventDefault(); doJump(); }
  else if (e.key === 'ArrowDown' || e.key === 's') { e.preventDefault(); doSlide(); }
});
let tsx = 0, tsy = 0, tracking = false;
canvas.addEventListener('pointerdown', e => { tsx = e.clientX; tsy = e.clientY; tracking = true; });
canvas.addEventListener('pointerup', e => {
  if (!tracking) return; tracking = false;
  if (state !== 'play') { reset(); return; }
  const dx = e.clientX - tsx, dy = e.clientY - tsy;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) { doJump(); return; }
  if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
  else if (dy < 0) doJump();
  else doSlide();                                  // swipe DOWN = slide
});
document.getElementById('overlay').addEventListener('click', () => { if (state !== 'play') reset(); });

// ============ reset / overlay ========================================
function reset() {
  for (const o of objects) pickGroup.remove(o.mesh);
  objects.length = 0;
  state = 'play'; dist = 0; speed = 16.0; crystals = 0; goalDone = false;
  lane = 0; laneF = 0; jumpV = 0; jumpY = 0; onGround = true;
  slideT = 0;
  shield = 0; magnet = 0; spawnAcc = 0; runT = 0; stridePhase = 0; shake = 0;
  document.getElementById('overlay').classList.remove('on');
  for (let i = 0; i < 6; i++) {
    spawnObj('crystal', Math.floor(Math.random()*3) - 1, -25 - i * 8);
  }
}
function score() { return Math.floor(dist * 3) + crystals * 20; }
function showOverlay(title, kind) {
  const ov = document.getElementById('overlay');
  document.getElementById('ov-h1').textContent = title;
  document.getElementById('ov-h2').textContent = kind === 'won' ? 'TIMELINE STABILIZED!' : '';
  document.getElementById('ov-h1').style.color = kind === 'won' ? '#b8a8ff' : '#d33a3a';
  document.getElementById('ov-p1').textContent = '💎 ' + crystals + ' / ' + CRYSTAL_GOAL;
  document.getElementById('ov-p2').textContent = 'SCORE ' + score() + '   •   ' + Math.floor(dist * 3) + ' m';
  ov.classList.add('on');
}

// ============ update + render ========================================
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  if (state === 'play') {
    runT += dt * speed;
    speed = Math.min(36, 16.0 + dist * 0.012);
    dist += speed * dt;
    if (shield > 0) shield = Math.max(0, shield - dt);
    if (magnet > 0) magnet = Math.max(0, magnet - dt);
    if (shake > 0)  shake  = Math.max(0, shake - dt);

    laneF += (lane - laneF) * Math.min(1, dt * 18);
    if (!onGround) {
      jumpY += jumpV * dt - 0.5 * 18 * dt * dt;
      jumpV -= 18 * dt;
      if (jumpY <= 0) { jumpY = 0; onGround = true; jumpV = 0; }
    }
    // slide timer countdown
    if (slideT > 0) slideT = Math.max(0, slideT - dt);
    // texture scroll = illusion of forward motion (no ceiling — skipped)
    floorTex.offset.y -= dt * speed * 0.018;
    wallTex.offset.x  -= dt * speed * 0.0085;
    wallTexR.offset.x -= dt * speed * 0.0085;

    // ceiling lights cycle z position to feel like fixtures passing
    for (let i = 0; i < ceilLights.length; i++) {
      ceilLights[i].intensity = 0.7 + 0.15 * Math.sin(runT * 2.0 + i);
      ceilLights[i].position.z += dt * speed * 1.2;
      if (ceilLights[i].position.z > 12) ceilLights[i].position.z -= 14 * ceilLights.length;
    }

    // side props slide toward camera at world speed, recycle when behind
    for (let i = 0; i < sideProps.length; i++) {
      const sp = sideProps[i];
      sp.mesh.position.z += speed * dt;
      sp.z = sp.mesh.position.z;
      if (sp.z > 10) {
        sp.mesh.position.z -= PROP_COUNT * PROP_SPACING;
        sp.z = sp.mesh.position.z;
        // randomize the specimen tube creature color when recycled (variety)
        const al = sp.mesh.userData && sp.mesh.userData.alien;
        if (al) {
          const palette = [0x7a3aff, 0xff6a4a, 0x1ab3ff, 0xff39c5, 0x39e36e];
          al.material.color.setHex(palette[Math.floor(Math.random() * palette.length)]);
        }
      }
      // animate specimen bubbles
      const al = sp.mesh.userData && sp.mesh.userData.alien;
      if (al) {
        al.position.y = 1.4 + Math.sin(runT * 2 + i) * 0.10;
        al.rotation.y = Math.sin(runT * 1.4 + i) * 0.4;
      }
    }

    spawnAcc += speed * dt;
    if (spawnAcc > 14) { trySpawn(); spawnAcc = 0; }

    for (let i = 0; i < objects.length; i++) {
      const o = objects[i];
      if (o.got) continue;
      o.z += speed * dt;
      // magnet pulls chrono crystals
      if (magnet > 0 && o.kind === 'crystal' && o.z > -30 && o.z < 5) {
        if (o.lane !== Math.round(laneF)) o.lane = Math.round(laneF);
      }
      o.mesh.position.x += (lanePosX(o.lane) - o.mesh.position.x) * Math.min(1, dt * 14);
      o.mesh.position.z = o.z;
      // per-kind animations
      if (o.kind === 'crystal') {
        o.mesh.rotation.y = runT * 1.8 + o.phase;
        o.mesh.rotation.z = Math.sin(runT * 1.2 + o.phase) * 0.10;
        o.mesh.position.y = 1.0 + Math.sin(runT * 2 + o.phase) * 0.10;
      } else if (o.kind === 'shield' || o.kind === 'magnet') {
        o.mesh.rotation.y = runT * 1.2;
        o.mesh.position.y = 1.1 + Math.sin(runT*2 + o.phase) * 0.08;
      } else if (o.kind === 'robotarm') {
        // swing the arm back and forth horizontally
        const armG = o.mesh.userData.armG;
        if (armG) armG.rotation.z = Math.sin(runT * 3 + o.phase) * 0.55;
      } else if (o.kind === 'efence') {
        // pulse arc opacity
        const arcs = o.mesh.userData.arcs;
        if (arcs) for (const a of arcs) a.material.opacity = 0.5 + 0.5 * Math.abs(Math.sin(runT * 9 + o.phase));
      } else if (o.kind === 'lowlaser' || o.kind === 'highlaser') {
        // subtle beam flicker
        const beam = o.mesh.userData.beam;
        if (beam) beam.material.opacity = 0.85 + 0.15 * Math.sin(runT * 14 + o.phase);
      } else if (o.kind === 'slime') {
        for (const b of o.mesh.children) {
          if (b.userData && b.userData.phase != null) {
            b.position.y = 0.18 + 0.18 * Math.abs(Math.sin(runT*3 + b.userData.phase));
          }
        }
      } else if (o.kind === 'spectank') {
        const al = o.mesh.userData.alien;
        if (al) al.position.y = 1.10 + Math.sin(runT * 2 + o.phase) * 0.10;
      } else if (o.kind === 'labcart') {
        // slight horizontal sway
        o.mesh.rotation.y = Math.sin(runT * 3 + o.phase) * 0.05;
      } else if (o.kind === 'portalcrack') {
        // floating glow particles bob
        for (const c of o.mesh.children) {
          if (c.userData && c.userData.baseY != null) {
            c.position.y = c.userData.baseY + Math.sin(runT * 4 + c.userData.phase) * 0.05;
          }
        }
      } else if (o.kind === 'steamvent') {
        // 1.4s cycle: 0.7s on, 0.7s off. Active when (cycleT % 1.4) < 0.7.
        o.cycleT += dt;
        const on = (o.cycleT % 1.4) < 0.7;
        const sList = o.mesh.userData.steam || [];
        for (const s of sList) s.visible = on;
        o.steamOn = on;
        // pulse steam scale during the on phase
        if (on) {
          const ph = (o.cycleT % 1.4) / 0.7;
          for (const s of sList) s.scale.y = 0.6 + 1.2 * Math.sin(ph * Math.PI);
        }
      }

      // collision window — player is around z=5
      const px = lanePosX(Math.round(laneF));
      if (o.z > 4.0 && o.z < 6.5 && Math.abs(o.mesh.position.x - px) < 1.0) {
        if (o.kind === 'crystal') {
          o.got = true; crystals++; pickGroup.remove(o.mesh);
          if (crystals >= CRYSTAL_GOAL && !goalDone) {
            goalDone = true; state = 'won';
            if (score() > best) { best = score(); localStorage.setItem('sdr_best', best); }
            if (crystals > bestC)  { bestC = crystals; localStorage.setItem('sdr_bestC', bestC); }
            showOverlay('YOU DID IT!', 'won');
          }
        } else if (o.kind === 'shield') {
          o.got = true; shield = 6; pickGroup.remove(o.mesh);
        } else if (o.kind === 'magnet') {
          o.got = true; magnet = 6; pickGroup.remove(o.mesh);
        } else {
          // HAZARD — check clear method
          let cleared = false;
          if (o.clear === 'jump') {
            cleared = jumpY > 0.6;
          } else if (o.clear === 'slide') {
            cleared = slideT > 0;
          } else if (o.clear === 'lane') {
            cleared = false;        // must be in a different lane (already filtered by x-check)
          } else if (o.clear === 'timed') {
            // steam vent: cleared if steam is currently OFF
            cleared = !o.steamOn;
            // also cleared if you jump over it during the on-phase
            if (!cleared && jumpY > 1.2) cleared = true;
          }
          if (!cleared) {
            if (shield > 0) { o.got = true; shield = 0; shake = 0.25; pickGroup.remove(o.mesh); }
            else {
              state = 'dead'; shake = 0.4;
              if (score() > best) { best = score(); localStorage.setItem('sdr_best', best); }
              if (crystals > bestC)  { bestC = crystals; localStorage.setItem('sdr_bestC', bestC); }
              showOverlay('CAUGHT!', 'dead');
            }
          }
        }
      }
    }
    for (let i = objects.length - 1; i >= 0; i--) {
      const o = objects[i];
      if (o.got || o.z > 12) {
        if (!o.got) pickGroup.remove(o.mesh);
        objects.splice(i, 1);
      }
    }

    // Danny run animation — smoother, larger amplitude, easeOut on each pose
    // Advance stride phase at a real run cadence: ~1.7 cycles/sec at
    // base speed, ramping to ~2.3 cycles/sec at top speed. NOT tied to
    // runT (which scales with world speed and was way too fast).
    const sliding = slideT > 0;
    if (onGround && !sliding) stridePhase += dt * (10 + speed * 0.2);
    const targetStride = sliding ? 0.2 : (onGround ? Math.sin(stridePhase) : 0.2);
    const targetStride2 = sliding ? 0.0 : (onGround ? Math.cos(stridePhase) : -0.2);
    const lerp = Math.min(1, dt * 12);
    // legs: while sliding, both legs out front
    const tLegL = sliding ? 1.0 : (targetStride * 0.90);
    const tLegR = sliding ? 0.8 : (-targetStride * 0.90);
    const tArmL = sliding ? 0.4 : (-targetStride * 0.70);
    const tArmR = sliding ? 0.4 : (targetStride * 0.70);
    danny.userData.legAngL += (tLegL - danny.userData.legAngL) * lerp;
    danny.userData.legAngR += (tLegR - danny.userData.legAngR) * lerp;
    danny.userData.armAngL += (tArmL - danny.userData.armAngL) * lerp;
    danny.userData.armAngR += (tArmR - danny.userData.armAngR) * lerp;
    legL.rotation.x = danny.userData.legAngL;
    legR.rotation.x = danny.userData.legAngR;
    armL.rotation.x = danny.userData.armAngL;
    armR.rotation.x = danny.userData.armAngR;
    // shoulder lift on swing (more dynamic feel)
    armL.position.y = 1.95 + Math.abs(danny.userData.armAngL) * 0.04;
    armR.position.y = 1.95 + Math.abs(danny.userData.armAngR) * 0.04;
    // smooth lane lerp
    danny.position.x += (lanePosX(laneF) - danny.position.x) * Math.min(1, dt * 18);
    // base Y: jump height when in air; while sliding, drop the body lower
    const slideDip = sliding ? -0.4 : 0;
    const targetY = jumpY + slideDip;
    danny.position.y += (targetY - danny.position.y) * Math.min(1, dt * 18);
    // body lean while running (side twist only — keep X stable to avoid fighting the 180° face flip)
    // While sliding, body tilts forward strongly
    const targetZRot = sliding ? 0 : (targetStride * 0.05);
    const targetXRot = sliding ? -0.85 : 0;
    danny.rotation.z = targetZRot;
    danny.rotation.x = (danny.rotation.x || 0) + (targetXRot - (danny.rotation.x || 0)) * lerp;
    // head bob
    head.position.y = 2.35 + Math.abs(targetStride2) * 0.025;
    // shadow follows in world-space (stays on the floor)
    shadow.position.x = danny.position.x;
    shadow.position.z = danny.position.z;
    shadow.position.y = 0.02;
    const sScale = Math.max(0.5, 1 - jumpY * 0.3);
    shadow.scale.set(sScale, 1, sScale);
  }

  if (shake > 0) {
    camera.position.x = (Math.random() - 0.5) * shake * 0.6;
    camera.position.y = 3.0 + (Math.random() - 0.5) * shake * 0.4;
  } else {
    camera.position.x += (0 - camera.position.x) * 0.15;
    camera.position.y += (3.0 - camera.position.y) * 0.15;
  }

  document.getElementById('ui-gears').textContent = crystals;
  document.getElementById('ui-score').textContent = score();
  document.getElementById('ui-dist').textContent = Math.floor(dist * 3);
  document.getElementById('ui-best').textContent  = best;
  document.getElementById('ui-prog').style.width = (Math.min(1, crystals / CRYSTAL_GOAL) * 100) + '%';
  document.getElementById('pwr-shield').classList.toggle('on', shield > 0);
  document.getElementById('pwr-magnet').classList.toggle('on', magnet > 0);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

reset();
tick();
</script>
</body>
</html>
