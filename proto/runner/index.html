<style>

            background: rgba(20,24,38,0.74); border-radius: 10px; padding: 8px 12px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .row { display: flex; justify-content: space-between; align-items: center; color: #e8ecf3; }

  .bar > div { height: 100%; background: linear-gradient(to right, #6a1880, #b8a8ff, #46f0ff); transition: width .12s linear;
               box-shadow: 0 0 10px rgba(184,168,255,0.5); }

<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="ui">
  <div id="topbar">
    <div class="row">
      <span class="lbl big" style="color:#ffd23a">🪙 <span id="ui-gears">0</span> / <span id="ui-goal">50</span></span>
      <span class="lbl"><span style="color:#9aa0c4">BEST</span> <span id="ui-best" style="color:#b8a8ff">0</span></span>
    </div>
    <div class="row">
      <span class="lbl cyan">SCORE <span id="ui-score">0</span></span>
      <span class="lbl dim"><span id="ui-dist">0</span> m</span>
    </div>
    <div class="bar"><div id="ui-prog" style="width:0%"></div></div>
    <div class="row" style="margin-top:6px;justify-content:center">
      <span class="lbl" style="font-size:12px;letter-spacing:2px"><span id="ui-zone" style="color:#fff">MAIN LAB</span></span>
    </div>
    <div style="text-align:center;font-size:10px;color:#46f0ff;margin-top:6px;letter-spacing:1.5px;font-weight:700;opacity:0.7">
      v32 &nbsp;•&nbsp; <span id="vsize">—</span>
    </div>

<!-- LIVE CAMERA TUNING PANEL — toggle with the ⚙ button (bottom-right).
     Each row has a label, − button, current value, + button.
     URL copy at bottom so Mark can share a tuned config. -->
<button id="cam-toggle" style="position:fixed;right:10px;bottom:34px;width:42px;height:42px;border-radius:21px;border:1px solid #46f0ff;background:rgba(20,24,38,0.85);color:#46f0ff;font-size:20px;cursor:pointer;z-index:20;pointer-events:auto">⚙</button>
<div id="cam-panel" style="position:fixed;right:10px;bottom:84px;background:rgba(20,24,38,0.92);color:#e8ecf3;font-family:system-ui;font-size:13px;padding:10px 12px;border-radius:10px;border:1px solid #46f0ff;display:none;z-index:20;pointer-events:auto;min-width:200px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)">
  <div style="font-weight:700;color:#46f0ff;margin-bottom:6px;letter-spacing:1px">CAMERA</div>
  <div data-cam="height"    data-step="0.25" data-label="Height"></div>
  <div data-cam="back"      data-step="0.5"  data-label="Back"></div>
  <div data-cam="lookAhead" data-step="0.5"  data-label="Look Ahead"></div>
  <div data-cam="lookHeight" data-step="0.25" data-label="Look Y"></div>
  <div data-cam="fov"       data-step="2"    data-label="FOV"></div>
  <div data-cam="laneSway"  data-step="0.05" data-label="Lane Sway"></div>
  <div style="font-weight:700;color:#ffd23a;margin:8px 0 4px;letter-spacing:1px">GRAPHICS</div>
  <div data-gfx="toneExposure" data-step="0.05" data-label="Brightness"></div>
  <div data-gfx="envIntensity" data-step="0.1"  data-label="Reflection"></div>
  <div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(70,240,255,0.3)">
    <div style="font-size:11px;color:#9aa0c4">Copy this URL to lock the config:</div>
    <input id="cam-url" readonly style="width:100%;background:#0a0c14;color:#e8ecf3;border:1px solid #3a4d75;border-radius:4px;padding:4px;font-size:10px;font-family:monospace;margin-top:2px" />
  </div>
</div>
<script>
(function () {
  const panel = document.getElementById('cam-panel');
  const tog = document.getElementById('cam-toggle');
  const urlBox = document.getElementById('cam-url');
  function wireRow(row, store, key, step) {
    if (!row.firstChild) {
      const lbl = row.dataset.label;
      row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:6px;margin:4px 0';
      row.innerHTML = '<span style="flex:1">' + lbl + '</span>' +
        '<button class="cm-btn" data-delta="-1" style="width:26px;height:26px;border-radius:6px;border:1px solid #3a4d75;background:#0a0c14;color:#e8ecf3;font-size:16px;cursor:pointer">−</button>' +
        '<span class="cm-val" style="min-width:42px;text-align:center;color:#ffd23a;font-weight:700"></span>' +
        '<button class="cm-btn" data-delta="1" style="width:26px;height:26px;border-radius:6px;border:1px solid #3a4d75;background:#0a0c14;color:#e8ecf3;font-size:16px;cursor:pointer">+</button>';
      row.querySelectorAll('.cm-btn').forEach(b => b.addEventListener('click', () => {
        store[key] += parseInt(b.dataset.delta, 10) * step;
        render();
      }));
    }
    row.querySelector('.cm-val').textContent = (+store[key]).toFixed(2);
  }
  function render() {
    panel.querySelectorAll('[data-cam]').forEach(row =>
      wireRow(row, window.CAMERA, row.dataset.cam, parseFloat(row.dataset.step)));
    panel.querySelectorAll('[data-gfx]').forEach(row =>
      wireRow(row, window.GFX, row.dataset.gfx, parseFloat(row.dataset.step)));
    const camP = ['height=h','back=b','fov=fov','lookAhead=la','lookHeight=lh','laneSway=sway']
      .map(s => { const [k, p] = s.split('='); return p + '=' + (+window.CAMERA[k]).toFixed(2); }).join('&');
    const gfxP = ['toneExposure','envIntensity']
      .map(k => k + '=' + (+window.GFX[k]).toFixed(2)).join('&');
    urlBox.value = location.origin + location.pathname + '?' + camP + '&' + gfxP;
  }
  tog.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    const open = panel.style.display !== 'none';
    panel.style.display = open ? 'none' : 'block';
    if (!open) render();
  });
  // Re-render so the values stay live if changed elsewhere
  setInterval(() => { if (panel.style.display !== 'none') render(); }, 250);
})();
</script>

<script type="module">
import * as THREE from 'three';

// ============ scene setup =============================================
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
// v25: filmic tone mapping for a graded, 'real game' look. Live-tunable.
// v25 (Subway Surfers vibe): bright atmosphere, less fog, warmer tone.
const GFX = { toneExposure: 1.15, envIntensity: 1.1, fogNear: 45, fogFar: 160 };
(function applyGfxURL() {
  const p = new URLSearchParams(location.search);
  ['toneExposure', 'envIntensity', 'fogNear', 'fogFar'].forEach(k => {
    const v = parseFloat(p.get(k));
    if (!Number.isNaN(v)) GFX[k] = v;
  });
})();
window.GFX = GFX;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = GFX.toneExposure;

const scene = new THREE.Scene();
// v25.1: Mark: 'I don't think the sky will work' — the lab corridor
// shouldn't have an outdoor sky beyond the walls. Background reverts to
// a bright neutral off-white so distance fades to ambient interior tone.
scene.background = new THREE.Color(0xe8eef5);
scene.fog = new THREE.Fog(0xe8eef5, GFX.fogNear, GFX.fogFar);

// ============ ENVIRONMENT MAP (for PBR reflections) ==================
// Procedural equirectangular 'lab ambience' → PMREM → scene.environment.
// Gives MeshStandardMaterials something to reflect so metal reads as
// metal instead of going flat-dark. All core three, no extra CDN.
(function buildEnvironment() {
  const ec = document.createElement('canvas');
  ec.width = 512; ec.height = 256;
  const eg = ec.getContext('2d');
  // v25 white-lab env: bright top, soft white middle, light grey floor
  const grad = eg.createLinearGradient(0, 0, 0, 256);
  // v25.1: neutral bright interior gradient (no sky)
  grad.addColorStop(0,   '#f4f6fa');   // bright ceiling tone
  grad.addColorStop(0.4, '#dde2eb');
  grad.addColorStop(0.7, '#b8c0cc');
  grad.addColorStop(1,   '#88909c');   // mid-grey floor reflection
  eg.fillStyle = grad; eg.fillRect(0, 0, 512, 256);
  // bright ceiling light bands (reflect as highlights on metal)
  for (let i = 0; i < 7; i++) {
    eg.fillStyle = 'rgba(255,250,230,0.95)';
    eg.fillRect(i * 75 + 14, 14, 50, 18);
  }
  // cyan accent strip near top
  eg.fillStyle = 'rgba(70,240,255,0.5)';
  eg.fillRect(0, 36, 512, 5);
  // colored specimen-tank glows at mid-height for color in reflections
  ['#39e36e', '#7a3aff', '#ff39c5', '#39c5ff'].forEach((c, i) => {
    eg.fillStyle = c;
    eg.globalAlpha = 0.22;
    eg.beginPath(); eg.arc(80 + i * 130, 160, 28, 0, 7); eg.fill();
    eg.globalAlpha = 1;
  });
  const envTex = new THREE.CanvasTexture(ec);
  envTex.mapping = THREE.EquirectangularReflectionMapping;
  envTex.colorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const envRT = pmrem.fromEquirectangular(envTex);
  scene.environment = envRT.texture;
  envTex.dispose();
  pmrem.dispose();
})();

// ============ CAMERA CONFIG (live-tunable, decoupled from gameplay) ===
// Gameplay space lives at world origin: Danny runs in z; lanes in x.
// The camera is a separate object framing that space. Adjust freely
// here, via URL params, on-screen panel, or keyboard shortcuts —
// gameplay stays put.
//
// URL params (override defaults): ?h=4&b=6&fov=62&la=4&lh=1.5&sway=0.4
// Defaults locked from Mark's in-game tuning. v25: laneSway = 0 so
// when Danny moves, only he moves (no camera follow). The world feels
// static; he runs through it.
const CAMERA = {
  height:     6.75,
  back:       8.00,
  lookAhead:  15.50,
  lookHeight: -0.20,
  fov:        55,
  laneSway:   0.0,          // was 1.85 — camera locked horizontally now
  smoothing:  10
};
(function applyURLParams() {
  const p = new URLSearchParams(location.search);
  const map = { h:'height', b:'back', fov:'fov', la:'lookAhead', lh:'lookHeight', sway:'laneSway', sm:'smoothing' };
  for (const k in map) {
    const v = parseFloat(p.get(k));
    if (!Number.isNaN(v)) CAMERA[map[k]] = v;
  }
})();

const camera = new THREE.PerspectiveCamera(CAMERA.fov, 1, 0.1, 200);
// Initial placement — updateCamera() will re-set every frame.
camera.position.set(0, CAMERA.height, CAMERA.back);
camera.lookAt(0, CAMERA.lookHeight, -CAMERA.lookAhead);

// Smoothed camera target so adjustments don't snap.
const _camPos = new THREE.Vector3(0, CAMERA.height, CAMERA.back);
const _camLook = new THREE.Vector3(0, CAMERA.lookHeight, -CAMERA.lookAhead);

function updateCamera(dt) {
  if (typeof danny === 'undefined') return;
  // Desired position: a fixed offset behind + above Danny.
  // Lane sway: optionally drift sideways with Danny's lane shift for life.
  const targetX = danny.position.x * CAMERA.laneSway;
  const targetY = CAMERA.height;
  const targetZ = danny.position.z + CAMERA.back;
  const lookX = danny.position.x * (CAMERA.laneSway * 0.6);
  const lookY = CAMERA.lookHeight;
  const lookZ = danny.position.z - CAMERA.lookAhead;
  const k = Math.min(1, dt * CAMERA.smoothing);
  _camPos.x += (targetX - _camPos.x) * k;
  _camPos.y += (targetY - _camPos.y) * k;
  _camPos.z += (targetZ - _camPos.z) * k;
  _camLook.x += (lookX - _camLook.x) * k;
  _camLook.y += (lookY - _camLook.y) * k;
  _camLook.z += (lookZ - _camLook.z) * k;
  camera.position.copy(_camPos);
  // v26: camera + character stay axis-aligned to -Z; the WORLD swings
  // around the character during a turn (see applyWorldTransform).
  // No look-angle swing needed — the rotating corridor sells the turn.
  camera.lookAt(_camLook);

  if (camera.fov !== CAMERA.fov) {
    camera.fov = CAMERA.fov; camera.updateProjectionMatrix();
  }
}

// Expose for DevTools tweaking on the phone via Safari Web Inspector
window.CAMERA = CAMERA;

// ============ v25: ROUNDED-BOX HELPER ================================
// Returns a BufferGeometry that's like BoxGeometry but with chamfered/
// rounded corners. Used for obstacle shapes to lose the harsh
// industrial right-angles and pick up the cartoon vibe.
function roundedBox(w, h, d, r) {
  // v25.1 FIX: clamp r against ALL three dimensions including depth.
  // Was only clamping w/h → thin panels with depth < 2r produced
  // negative ExtrudeGeometry depth → page crash on load.
  r = Math.max(0.001, Math.min(r, w/2 - 0.001, h/2 - 0.001, d/2 - 0.001));
  const shape = new THREE.Shape();
  const wh = w/2, hh = h/2;
  shape.moveTo(-wh + r, -hh);
  shape.lineTo(wh - r, -hh);
  shape.quadraticCurveTo(wh, -hh, wh, -hh + r);
  shape.lineTo(wh, hh - r);
  shape.quadraticCurveTo(wh, hh, wh - r, hh);
  shape.lineTo(-wh + r, hh);
  shape.quadraticCurveTo(-wh, hh, -wh, hh - r);
  shape.lineTo(-wh, -hh + r);
  shape.quadraticCurveTo(-wh, -hh, -wh + r, -hh);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: d - r * 2,
    bevelEnabled: true,
    bevelThickness: r,
    bevelSize: r,
    bevelSegments: 4,
    curveSegments: 6
  });
  geo.translate(0, 0, -(d / 2) + r);
  return geo;
}

// ============ AUDIO ===================================================
// SFX are synthesized inline via Web Audio API (no asset files, instant).
// Music streams the Adventure City tracks from the SDA assets folder.
// iOS Safari blocks all audio until a user gesture — init lazy-loads on
// the first input event.
const AUDIO = {
  ctx: null, master: null, sfxGain: null,
  musicEl: null, musicFadeIv: null,
  initialized: false, unlocked: false,
  master_vol: 0.7, sfx_vol: 0.65, music_vol: 0.42,
  lastStepSin: 0
};
function initAudio() {
  if (AUDIO.initialized) return;
  try {
    AUDIO.ctx = new (window.AudioContext || window.webkitAudioContext)();
    AUDIO.master = AUDIO.ctx.createGain();
    AUDIO.master.gain.value = AUDIO.master_vol;
    AUDIO.master.connect(AUDIO.ctx.destination);
    AUDIO.sfxGain = AUDIO.ctx.createGain();
    AUDIO.sfxGain.gain.value = AUDIO.sfx_vol;
    AUDIO.sfxGain.connect(AUDIO.master);
    AUDIO.initialized = true;
  } catch (e) { console.warn('audio init failed', e); }
}
function unlockAudio() {
  if (AUDIO.unlocked) return;
  initAudio();
  if (AUDIO.ctx && AUDIO.ctx.state === 'suspended') {
    AUDIO.ctx.resume().catch(() => {});
  }
  // play a silent buffer to fully unlock iOS WebAudio (the AVAudioSession
  // warmup trick from the SDA audio system).
  if (AUDIO.ctx) {
    const buf = AUDIO.ctx.createBuffer(1, 1, 22050);
    const src = AUDIO.ctx.createBufferSource();
    src.buffer = buf; src.connect(AUDIO.ctx.destination); src.start(0);
  }
  AUDIO.unlocked = true;
  startMusic();
}
function startMusic() {
  if (AUDIO.musicEl) return;
  // Reuse the Adventure City music from the SDA bundle. Relative path
  // from proto/runner/index.html.
  const tracks = [
    encodeURI('../../assets/New Assets/Adventure city Music/SDDG city.mp3'),
    encodeURI('../../assets/New Assets/Adventure city Music/SDDG city 2.mp3'),
    encodeURI('../../assets/New Assets/Adventure city Music/AW City remix.mp3')
  ];
  const url = tracks[Math.floor(Math.random() * tracks.length)];
  const el = new Audio(url);
  el.loop = true; el.volume = 0; el.preload = 'auto';
  el.crossOrigin = 'anonymous';
  el.play().then(() => {
    // smooth fade-in over ~1.4s
    let t = 0;
    AUDIO.musicFadeIv = setInterval(() => {
      t += 0.06;
      el.volume = Math.min(AUDIO.music_vol, t * AUDIO.music_vol);
      if (el.volume >= AUDIO.music_vol) {
        el.volume = AUDIO.music_vol;
        clearInterval(AUDIO.musicFadeIv); AUDIO.musicFadeIv = null;
      }
    }, 80);
  }).catch(e => console.warn('music play() failed (expected on first call before gesture):', e.message));
  AUDIO.musicEl = el;
}
function fadeMusic(toVol, ms) {
  if (!AUDIO.musicEl) return;
  if (AUDIO.musicFadeIv) clearInterval(AUDIO.musicFadeIv);
  const el = AUDIO.musicEl;
  const start = el.volume; const dur = ms / 80; let step = 0;
  AUDIO.musicFadeIv = setInterval(() => {
    step++;
    el.volume = Math.max(0, Math.min(1, start + (toVol - start) * (step / dur)));
    if (step >= dur) {
      el.volume = toVol;
      clearInterval(AUDIO.musicFadeIv); AUDIO.musicFadeIv = null;
    }
  }, 80);
}
function sfx(name) {
  if (!AUDIO.initialized || !AUDIO.unlocked) return;
  const ctx = AUDIO.ctx, now = ctx.currentTime, out = AUDIO.sfxGain;
  function tone(freq, dur, type, gainPeak, ramp) {
    const osc = ctx.createOscillator(), env = ctx.createGain();
    osc.type = type || 'sine';
    if (Array.isArray(freq)) {
      osc.frequency.setValueAtTime(freq[0], now);
      if (ramp === 'exp') osc.frequency.exponentialRampToValueAtTime(freq[1], now + dur);
      else osc.frequency.linearRampToValueAtTime(freq[1], now + dur);
    } else osc.frequency.value = freq;
    env.gain.setValueAtTime(0.0001, now);
    env.gain.linearRampToValueAtTime(gainPeak, now + 0.008);
    env.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(env).connect(out);
    osc.start(now); osc.stop(now + dur + 0.02);
  }
  function noise(dur, lpFreq, gainPeak) {
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() - 0.5) * 2;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    if (Array.isArray(lpFreq)) {
      filter.frequency.setValueAtTime(lpFreq[0], now);
      filter.frequency.exponentialRampToValueAtTime(lpFreq[1], now + dur);
    } else filter.frequency.value = lpFreq;
    const env = ctx.createGain();
    env.gain.setValueAtTime(gainPeak, now);
    env.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(filter).connect(env).connect(out);
    src.start(now); src.stop(now + dur + 0.02);
  }
  switch (name) {
    case 'jump':     tone([400, 800], 0.12, 'sine', 0.35, 'exp'); break;
    case 'slide':    noise(0.4, [800, 200], 0.20); break;
    case 'crystal':
      tone(523, 0.18, 'sine', 0.28);
      setTimeout(() => tone(659, 0.18, 'sine', 0.26), 30);
      break;
    case 'powerup':
      [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.12, 'square', 0.18), i * 60));
      break;
    case 'hit':
      tone([200, 50], 0.18, 'square', 0.40, 'exp');
      noise(0.10, 1200, 0.28);
      break;
    case 'goal':

// Bulletproof resize: visualViewport (correct on iOS Safari w/ URL bar)
// fallback to innerWidth/innerHeight. Force inline canvas size in CSS
// pixels so the layout can't get fooled by 100vh quirks.
function resize() {
  const vv = window.visualViewport;
  const w = Math.round((vv && vv.width)  || window.innerWidth);
  const h = Math.round((vv && vv.height) || window.innerHeight);
  renderer.setSize(w, h, true);            // updateStyle=true → set canvas.style w/h directly
  canvas.style.width  = w + 'px';
  canvas.style.height = h + 'px';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  // Surface the actual size for diagnostics
  const vs = document.getElementById('vsize');
  if (vs) vs.textContent = w + '×' + h;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', resize);

// and unique from each other').
function makeWallTexture(palette) {
  palette = palette || {
    bgStops: ['#a8b4c4', '#d8dde6', '#f4f6fa', '#dde2eb', '#9aa6b8'],
    led: '#46f0ff',
    baseboard: '#3a4d75',
    stripeYellow: '#ffd23a',
    seamDark: '#aab4c4',

    monitorBar: '#46f0ff',
    monitorOSTxt: 'LAB OS v3.4',
    lockerLabels: ['BIO', 'CHEM', 'RAD'],
    lockerColors: ['#1b9fb3','#10b981','#d33a3a'],
    pipesRack: ['#d33a3a','#1ab3ff','#10b981','#e8a516'],
    signs: [
      { x: 540,  color: '#1b9fb3', text: "DANNY'S LAB" },

  // Clean off-white panels with cool grey shadows + cyan/yellow accents.
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0,    palette.bgStops[0]);
  bg.addColorStop(0.20, palette.bgStops[1]);
  bg.addColorStop(0.50, palette.bgStops[2]);
  bg.addColorStop(0.80, palette.bgStops[3]);
  bg.addColorStop(1,    palette.bgStops[4]);

  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  // panel surface texture — subtle DARKER noise on white
  for (let i = 0; i < 400; i++) {
    g.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.025) + ')';
    g.fillRect(Math.random() * W, 36 + Math.random() * (H - 60), 1, 1);

  // top ceiling beam (slate contrast)
  g.fillStyle = palette.baseboard; g.fillRect(0, 0, W, 22);
  g.fillStyle = palette.baseboardEdge || '#5a6890'; g.fillRect(0, 22, W, 4);
  // LED accent strip (zone-colored)
  g.fillStyle = palette.led; g.fillRect(0, 26, W, 3);
  g.fillStyle = palette.ledGlow || 'rgba(70,240,255,0.55)'; g.fillRect(0, 29, W, 8);

  // baseboard with safety stripe
  g.fillStyle = palette.baseboard; g.fillRect(0, H - 22, W, 22);
  g.fillStyle = palette.baseboardEdge || '#5a6890'; g.fillRect(0, H - 24, W, 2);
  for (let x = 0; x < W; x += 22) {
    g.fillStyle = (x / 22) % 2 < 1 ? palette.stripeYellow : (palette.stripeDark || '#1a2540');
    g.fillRect(x, H - 10, 22, 4);
  }

  // panel seams
  for (let x = 0; x < W; x += 256) {
    g.fillStyle = palette.seamDark; g.fillRect(x - 1, 36, 2, H - 60);
    g.fillStyle = palette.seamLight; g.fillRect(x, 36, 1, H - 60);
  }
  // horizontal mid-rail
  g.fillStyle = palette.seamDark; g.fillRect(0, H * 0.50, W, 2);
  g.fillStyle = palette.seamLight; g.fillRect(0, H * 0.50 + 2, W, 1);

  // helpers
  function bracketBox(px, py, w, h, tint, label) {
    // back box
    g.fillStyle = '#05070d'; g.fillRect(px, py, w, h);
    // face
    g.fillStyle = '#1a2030'; g.fillRect(px + 4, py + 4, w - 8, h - 8);
    // tinted accent
    g.fillStyle = tint; g.fillRect(px + 8, py + 8, w - 16, 4);
    g.fillRect(px + 8, py + h - 12, w - 16, 4);

    g.fillStyle = '#05070d';

    g.fillStyle = '#1ab3ff'; g.fillRect(x + 4, y + 4, w - 8, h - 8);
    g.fillStyle = '#0a1a2a'; g.fillRect(x + 8, y + 8, w - 16, h - 18);
    // waveform
    g.fillStyle = '#46f0ff';

  function pipesRack(px) {
    const x = px, y = 30, w = 256, h = 420;
    const cols = ['#d33a3a','#1ab3ff','#10b981','#e8a516'];
    for (let pi = 0; pi < 4; pi++) {

  function vent(px) {
    const x = px + 30, y = 84, w = 196, h = 240;
    g.fillStyle = '#05070d'; g.fillRect(x - 6, y - 6, w + 12, h + 12);
    g.fillStyle = '#0a0e1a'; g.fillRect(x, y, w, h);

  function locker(px) {
    const x = px + 24, y = 40, w = 208, h = 420;
    g.fillStyle = '#05070d'; g.fillRect(x, y, w, h);
    for (let li = 0; li < 3; li++) {
      const lx = x + 6 + li * ((w - 12) / 3);
      const lw = (w - 12) / 3 - 4;
      g.fillStyle = '#1a2030'; g.fillRect(lx, y + 6, lw, h - 12);
      g.fillStyle = '#3a4d75'; g.fillRect(lx, y + 6, lw, 4);
      g.fillStyle = '#3a4d75'; g.fillRect(lx, y + h/2, lw, 1);
      g.fillStyle = '#ffd23a'; g.fillRect(lx + lw - 14, y + h/2 - 4, 8, 6);
      g.fillStyle = ['#1b9fb3','#10b981','#d33a3a'][li];
      g.fillRect(lx + 6, y + 22, lw - 12, 22);
      g.fillStyle = '#fff'; g.font = 'bold 14px system-ui'; g.textAlign = 'center';
      g.fillText(['BIO','CHEM','RAD'][li], lx + lw/2, y + 38);

  }
  function bigsign(px, color, label) {
    const x = px + 12, y = 38, w = 232, h = 60;
    g.fillStyle = '#05070d'; g.fillRect(x, y, w, h);
    g.fillStyle = color; g.fillRect(x + 4, y + 4, w - 8, h - 8);
    // adaptive font size — scale down for long labels so they fit
    const fontSize = label.length <= 8 ? 28 : label.length <= 14 ? 22 : 18;
    g.fillStyle = '#0a0e1a'; g.font = 'bold ' + fontSize + 'px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(label, x + w/2, y + h/2);

    g.fillStyle = '#ffd23a';
    g.fillRect(x + 8, y + 8, 4, 4); g.fillRect(x + w - 12, y + 8, 4, 4);
    g.fillRect(x + 8, y + h - 12, 4, 4); g.fillRect(x + w - 12, y + h - 12, 4, 4);

  // v25: Mark: 'too many signs being spammed on the side walls.'
  // Replaced 6-features-out-of-8-panels with sparse feature placement:
  // mostly clean brushed-metal panels with the occasional subtle accent
  // panel (light strip, conduit hatch, monitor). Only 2 signs across the
  // whole 2048 px (instead of 8).
  function emptyPanel(px) {
    // Clean panel with a faint vertical brushed-metal sheen and a thin
    // accent stripe — reads as 'wall', not as visual noise.
    const x = px + 24, y = 60, w = 208, h = H - 110;
    // very subtle vertical sheen lines
    for (let xi = 0; xi < w; xi += 4) {
      g.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.025) + ')';
      g.fillRect(x + xi, y, 1, h);
    }
    // thin horizontal accent strip at mid
    g.fillStyle = palette.panelAccent;
    g.fillRect(x, y + h * 0.5, w, 2);
    g.fillStyle = 'rgba(255,255,255,0.10)';
    g.fillRect(x, y + h * 0.5 + 2, w, 1);
    // 2 small bolt circles in the corners
    g.fillStyle = '#5a6890';
    for (const [bx, by] of [[10, 10], [w - 14, 10], [10, h - 14], [w - 14, h - 14]]) {
      g.beginPath(); g.arc(x + bx, y + by, 3, 0, 7); g.fill();
    }
  }
  function lightStripPanel(px) {
    // Tall vertical cyan light strip — reads as 'ambient corridor lighting'
    const x = px + 100, y = 80, w = 16, h = H - 140;
    g.fillStyle = palette.stripeDark || '#1a2540'; g.fillRect(x - 6, y - 4, w + 12, h + 8);
    g.fillStyle = palette.led; g.fillRect(x, y, w, h);
    // soft glow halo
    g.fillStyle = palette.ledGlowHalo || 'rgba(70,240,255,0.18)'; g.fillRect(x - 20, y, 60, h);
    // mounting bolts
    g.fillStyle = '#5a6890';
    g.beginPath(); g.arc(x + w/2, y, 4, 0, 7); g.fill();
    g.beginPath(); g.arc(x + w/2, y + h, 4, 0, 7); g.fill();
    // surrounding plain panel
    emptyPanel(px);
  }
  const features = [
    emptyPanel,
    monitor,
    emptyPanel,
    lightStripPanel,
    emptyPanel,
    vent,
    emptyPanel,
    lightStripPanel,
  ];
  for (let i = 0, x = 0; x < W; i++, x += 256) {
    features[i % features.length](x);

  // 2 sparse signs (zone-themed)
  for (const s of palette.signs) bigsign(s.x, s.color, s.text);

  const tex = new THREE.CanvasTexture(c);

  tex.minFilter = THREE.LinearMipMapLinearFilter;
  tex.colorSpace = THREE.SRGBColorSpace;

}

function makeFloorTexture(palette) {

  g.strokeStyle = palette.crack; g.lineWidth = 2;

    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
  }
  for (let y = 0; y <= H; y += 512) {
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
  }
  // BOLD PAINTED CENTER STRIPE
  g.fillStyle = palette.stripe;
  g.fillRect(W/2 - 9, 0, 18, H);

      g.fillStyle = palette.stripeChip;
      g.fillRect(W/2 - 9 + Math.random()*18, y, 2 + Math.random()*4, 4 + Math.random()*4);

  g.fillStyle = palette.laneEdge;
  g.fillRect(W/2 - 220, 0, 2, H);

  const tex = new THREE.CanvasTexture(c);

  tex.minFilter = THREE.LinearMipMapLinearFilter;
  tex.colorSpace = THREE.SRGBColorSpace;

function makeCeilTexture() {
  const W = 512, H = 1024;

// the end of a turn can swap the corridor's look in one step. (Both
// wallMatL and wallMatR share the same map; wallMatR uses a +0.5
// UV-offset clone for variety.)
// v31: per-zone texture cache + swap function (defined here only;
// PRE-BAKING happens once ZONE_WALL_PALETTES / ZONE_FLOOR_PALETTES are
// declared further below — see the second half of this file).
const ZONE_WALL_TEX   = {};
const ZONE_FLOOR_TEX  = {};
const ZONE_WALL_TEX_R = {};
function applyZoneTextures(zoneKey) {
  const wTex = ZONE_WALL_TEX[zoneKey];
  const wTexR = ZONE_WALL_TEX_R[zoneKey];
  const fTex = ZONE_FLOOR_TEX[zoneKey];
  if (wTex && wallMatL)  { wallMatL.map = wTex;  wallMatL.needsUpdate = true; }
  if (wTexR && wallMatR) { wallMatR.map = wTexR; wallMatR.needsUpdate = true; }
  if (fTex && floor && floor.material) {
    floor.material.map = fTex;
    floor.material.needsUpdate = true;
  }
}

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(CORR_HALF_W * 2, CORR_LEN),
  new THREE.MeshStandardMaterial({ map: floorTex, metalness: 0.45, roughness: 0.42, envMapIntensity: GFX.envIntensity })
);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, CORR_CENTER_Z);

// ============ v26: WORLD GROUP (rotates around character for turns) ===
// Everything corridor-related goes into worldGrp instead of scene root,
// so we can rotate the whole corridor around the character during a
// hallway turn. The character + camera stay in their own frames; the
// corridor swings around the character so the new direction stays
// visually ahead. Excluded from worldGrp: Danny (he stays put visually),
// camera, ambient + sun lights, HUD.
const worldGrp = new THREE.Group();
scene.add(worldGrp);
// Don't auto-update matrix — we set it manually each frame to pivot
// around the character's position.
worldGrp.matrixAutoUpdate = false;
worldGrp.matrix.identity();
worldGrp.matrixWorld.copy(worldGrp.matrix);
function applyWorldTransform(angle) {
  // v28: pivot at the ORIGIN (0,0,0) which is on the camera's view axis.
  // After turns, the perpendicular wing geometry rotates cleanly into
  // the camera's forward view (offset only by the player's lane width).
  // Reasoning: pivots near the player can leave wings well-offset from
  // the new -Z direction; origin gives the closest visual alignment.
  const cosA = Math.cos(angle);
  const sinA = Math.sin(angle);
  const m = worldGrp.matrix.elements;
  m[0] = cosA;  m[1] = 0;  m[2] = -sinA; m[3] = 0;
  m[4] = 0;     m[5] = 1;  m[6] = 0;     m[7] = 0;
  m[8] = sinA;  m[9] = 0;  m[10]= cosA;  m[11]= 0;
  m[12]= 0;
  m[13]= 0;
  m[14]= 0;
  m[15]= 1;
  worldGrp.matrixWorld.copy(worldGrp.matrix);
}
worldGrp.add(floor);

// Mark's note: "the game doesn't need a roof" — ceiling removed.
// Ceiling point lights kept (they still illuminate from above) so the
// corridor doesn't go dark.

const wallGeo = new THREE.PlaneGeometry(CORR_LEN, CORR_H);
const wallMatL = new THREE.MeshStandardMaterial({ map: wallTex, metalness: 0.55, roughness: 0.5, envMapIntensity: GFX.envIntensity, transparent: true, opacity: 1.0 });
const wallTexR = wallTex.clone(); wallTexR.needsUpdate = true; wallTexR.offset.x = 0.5;
const wallMatR = new THREE.MeshStandardMaterial({ map: wallTexR, metalness: 0.55, roughness: 0.5, envMapIntensity: GFX.envIntensity, transparent: true, opacity: 1.0 });
const wallL = new THREE.Mesh(wallGeo, wallMatL);
wallL.rotation.y = Math.PI / 2;
wallL.position.set(-CORR_HALF_W, CORR_H/2, CORR_CENTER_Z);
worldGrp.add(wallL);
const wallR = new THREE.Mesh(wallGeo, wallMatR);
wallR.rotation.y = -Math.PI / 2;
wallR.position.set(CORR_HALF_W, CORR_H/2, CORR_CENTER_Z);
worldGrp.add(wallR);

// 3D WALL PIPES — vertical colored pipes that hug the wall surface.
// Per Mark's reference image: red + blue pipes running vertically with
// metal joint bands. Sit FLAT against the wall (low z offset).
function makeWallPipes() {
  // v25 — Mark: 'redraw pipes and such on the wall decoration assets to
  // improve decorations.' Rebuilt as a proper lab MANIFOLD: 3 vertical
  // pipes with 90° elbows at the top connecting to a horizontal header,
  // a gauge dial centered on the header, a valve wheel mid-height, and
  // a brushed-metal mount plate with rivets.
  const grp = new THREE.Group();
  const colors = [0xd33a3a, 0x1ab3ff, 0xffd23a];   // red water / blue air / yellow gas
  const matSilver = new THREE.MeshStandardMaterial({ color: 0x9ba5b8, metalness: 0.9, roughness: 0.28 });
  const matDarkSteel = new THREE.MeshStandardMaterial({ color: 0x3a4d75, metalness: 0.8, roughness: 0.35 });
  const matBolt = new THREE.MeshStandardMaterial({ color: 0x5a6378, metalness: 0.85, roughness: 0.3 });

  // Mount bracket plate (brushed steel, with bolt rivets at the corners)
  const plate = new THREE.Mesh(new THREE.BoxGeometry(0.95, 3.8, 0.05), matSilver);
  plate.position.set(0, 1.95, -0.08); grp.add(plate);
  // Rivet bolts
  for (const [bx, by] of [[-0.40, 0.18], [0.40, 0.18], [-0.40, 3.72], [0.40, 3.72]]) {
    const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.04, 8), matBolt);
    bolt.rotation.x = Math.PI / 2;
    bolt.position.set(bx, by, -0.03);
    grp.add(bolt);
  }

  // 3 vertical pipes (different colors, different functions)
  const pipeRadius = 0.07;
  const pipeXs = [-0.28, 0, 0.28];
  for (let i = 0; i < 3; i++) {
    const mat = new THREE.MeshStandardMaterial({
      color: colors[i], metalness: 0.8, roughness: 0.25, envMapIntensity: 1.2
    });
    const pipeX = pipeXs[i];

    // Vertical pipe runs from y=0.20 (just above floor) to y=3.30 (where it elbows over)
    const vert = new THREE.Mesh(
      new THREE.CylinderGeometry(pipeRadius, pipeRadius, 3.10, 12), mat
    );
    vert.position.set(pipeX, 1.75, 0);
    grp.add(vert);

    // Bottom cap (closed end at the floor)
    const botCap = new THREE.Mesh(
      new THREE.CylinderGeometry(pipeRadius + 0.015, pipeRadius + 0.015, 0.06, 12), matDarkSteel
    );
    botCap.position.set(pipeX, 0.20, 0);
    grp.add(botCap);

    // 90° elbow at the top connecting vertical → horizontal header
    const elbow = new THREE.Mesh(
      new THREE.TorusGeometry(pipeRadius * 1.4, pipeRadius, 8, 12, Math.PI / 2),
      mat
    );
    elbow.position.set(pipeX, 3.30, 0);
    // Orient the elbow so it bends from "going up" to "going inward toward the header"
    elbow.rotation.x = -Math.PI / 2;
    elbow.rotation.z = (i === 1) ? 0 : (i < 1 ? -Math.PI / 2 : Math.PI / 2);
    grp.add(elbow);

    // Joint band wraps (where the pipe is bolted to the wall)
    for (let by = 0; by < 3; by++) {
      const band = new THREE.Mesh(
        new THREE.CylinderGeometry(pipeRadius + 0.025, pipeRadius + 0.025, 0.08, 12),
        matDarkSteel
      );
      band.position.set(pipeX, 0.55 + by * 0.9, 0);
      grp.add(band);
    }
  }

  // Horizontal header pipe at the top connecting all 3
  const header = new THREE.Mesh(
    new THREE.CylinderGeometry(pipeRadius, pipeRadius, 0.65, 12),
    new THREE.MeshStandardMaterial({ color: 0x8a93a8, metalness: 0.85, roughness: 0.3 })
  );
  header.rotation.z = Math.PI / 2;
  header.position.set(0, 3.45, 0);
  grp.add(header);

  // VALVE WHEEL on the middle pipe (the iconic lab look)
  const valveStem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.025, 0.025, 0.10, 8), matDarkSteel
  );
  valveStem.position.set(0, 1.85, 0.10);
  valveStem.rotation.x = Math.PI / 2;
  grp.add(valveStem);
  const valveHub = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.035, 0.04, 10), matBolt
  );
  valveHub.position.set(0, 1.85, 0.16);
  valveHub.rotation.x = Math.PI / 2;
  grp.add(valveHub);
  // valve wheel (red 5-spoke)
  const wheelMat = new THREE.MeshStandardMaterial({
    color: 0xd33a3a, metalness: 0.5, roughness: 0.4, emissive: 0x4a1010, emissiveIntensity: 0.3
  });
  const wheelOuter = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.018, 8, 18), wheelMat);
  wheelOuter.position.set(0, 1.85, 0.20);
  grp.add(wheelOuter);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.13, 0.025), wheelMat);
    spoke.position.set(Math.cos(a) * 0.07, 1.85 + Math.sin(a) * 0.07, 0.20);
    spoke.rotation.z = a;
    grp.add(spoke);
  }

  // PRESSURE GAUGE on the header (round dial with red needle)
  const gaugeBack = new THREE.Mesh(
    new THREE.CylinderGeometry(0.13, 0.13, 0.04, 16), matDarkSteel
  );
  gaugeBack.position.set(0, 3.45, 0.10);
  gaugeBack.rotation.x = Math.PI / 2;
  grp.add(gaugeBack);
  const gaugeFace = new THREE.Mesh(
    new THREE.CylinderGeometry(0.11, 0.11, 0.005, 16),
    new THREE.MeshStandardMaterial({ color: 0xf4f6fa, metalness: 0.1, roughness: 0.5 })
  );
  gaugeFace.position.set(0, 3.45, 0.13);
  gaugeFace.rotation.x = Math.PI / 2;
  grp.add(gaugeFace);
  const gaugeNeedle = new THREE.Mesh(
    new THREE.BoxGeometry(0.015, 0.10, 0.01),
    new THREE.MeshStandardMaterial({ color: 0xd33a3a, emissive: 0x6a1010, emissiveIntensity: 0.6 })
  );
  gaugeNeedle.position.set(0, 3.48, 0.135);
  gaugeNeedle.rotation.z = -0.6;
  grp.add(gaugeNeedle);
  const gaugePin = new THREE.Mesh(
    new THREE.CylinderGeometry(0.012, 0.012, 0.005, 8), matBolt
  );
  gaugePin.position.set(0, 3.45, 0.137);
  gaugePin.rotation.x = Math.PI / 2;
  grp.add(gaugePin);

  return grp;
}

// ARMS — built as separate UPPER + LOWER pieces around an ELBOW pivot.
// Returns { shoulder, elbow } so the run animator can drive each joint.
// Hierarchy: shoulder → upper arm → elbow → forearm → hand
function makeArm(side) {
  // Shoulder pivot — sits at the shoulder joint position. Rotating it
  // swings the WHOLE arm (upper + elbow + forearm + hand) forward/back.
  const shoulder = new THREE.Group();
  shoulder.position.set(side * 0.50, 1.95, 0);

  // Shoulder ball (visual cap that makes the joint feel volumetric)
  const shoulderBall = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 14, 12), matCoatShd
  );
  shoulder.add(shoulderBall);

  // Upper arm — hangs DOWN from shoulder pivot
  const upper = new THREE.Mesh(
    new THREE.CylinderGeometry(0.085, 0.075, 0.45, 12), matCoat
  );
  upper.position.y = -0.225;
  shoulder.add(upper);

  // Sleeve cuff (where coat meets skin)
  const cuff = new THREE.Mesh(
    new THREE.CylinderGeometry(0.085, 0.085, 0.04, 12), matCoatShd
  );
  cuff.position.y = -0.46;
  shoulder.add(cuff);

  // Elbow pivot — sits at end of upper arm. Rotating it bends the
  // forearm under the upper arm.
  const elbow = new THREE.Group();
  elbow.position.y = -0.48;
  shoulder.add(elbow);

  // Forearm — hangs DOWN from elbow pivot
  const fore = new THREE.Mesh(
    new THREE.CylinderGeometry(0.07, 0.065, 0.40, 12), matSkin
  );
  fore.position.y = -0.20;
  elbow.add(fore);

  // Hand
  const hand = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 14, 12), matSkin
  );
  hand.position.y = -0.46;
  elbow.add(hand);
  // tiny thumb hint
  const thumb = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), matSkin);
  thumb.position.set(side * 0.10, -0.46, 0.08);
  elbow.add(thumb);

  return { root: shoulder, shoulder: shoulder, elbow: elbow };
}

// v25: pickups rebuilt for unambiguous readability.
// Mark: 'I tried right now and couldn't tell if it was obstacle or power up.'
//
// New convention so players never confuse pickups with threats:
//   COLLECTIBLE = a golden spinning COIN (universally readable as 'get me')
//   POWER-UP    = the icon (shield / magnet) WRAPPED in a GOLDEN PULSING ORB.
// Hazards in this game are never gold + glowing — so anything golden = good.

function makeCoin() {
  // Classic spinning gold coin with a subtle gear-coin face for the
  // 'Time Machine' theme.
  const grp = new THREE.Group();
  // Main disc — laid flat with rotation.x = π/2 so it stands UPRIGHT
  // facing the camera; animator spins it around Y.
  const matGold = new THREE.MeshStandardMaterial({
    color: 0xffd23a, metalness: 0.95, roughness: 0.18,
    emissive: 0xa86a10, emissiveIntensity: 0.4
  });
  const matGoldDk = new THREE.MeshStandardMaterial({
    color: 0xa86a10, metalness: 0.9, roughness: 0.3
  });
  const matGoldLt = new THREE.MeshStandardMaterial({
    color: 0xfff0a0, metalness: 0.85, roughness: 0.22
  });
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.07, 32), matGold);
  disc.rotation.x = Math.PI / 2;
  grp.add(disc);
  // Recessed inner face (darker, slightly inset)
  const inset = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.072, 32), matGoldDk);
  inset.rotation.x = Math.PI / 2;
  grp.add(inset);
  // Gear teeth around the rim
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.08), matGold);
    t.position.set(Math.cos(a) * 0.36, Math.sin(a) * 0.36, 0);
    t.rotation.z = a;
    grp.add(t);
  }
  // Engraved SD-cross on the face (visible from both sides via depth)
  const symV = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.22, 0.075), matGoldLt);
  grp.add(symV);
  const symH = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.075), matGoldLt);
  grp.add(symH);
  // Glow halo behind the coin
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(0.46, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xffd23a, transparent: true, opacity: 0.16 })
  );
  grp.add(halo);
  return grp;
}

  // v25: 'crystal' kind kept for save-data compat, factory now returns a gold coin
  crystal: makeCoin, shield: makeShield, magnet: makeMagnet,
  // Mark's MVP-10:
  redx: makeRedXCrate, lowlaser: makeLowLaser, highlaser: makeHighLaser,
  efence: makeElecFence, labcart: makeLabCart, steamvent: makeSteamVent,
  slime: makeSlimePuddle, robotarm: makeRobotArm, spectank: makeSpecimenTankBlock,
  portalcrack: makePortalCrack
};
// clearance metadata: how each hazard is cleared by the player
const HAZARD_META = {
  redx:        { clear: 'lane',  height: 1.2 },
  lowlaser:    { clear: 'jump',  height: 0.7 },
  highlaser:   { clear: 'slide', height: 1.6 },
  efence:      { clear: 'lane',  height: 1.7 },
  labcart:     { clear: 'lane',  height: 1.0 },
  steamvent:   { clear: 'timed', height: 2.0 },   // jump during off-cycle
  slime:       { clear: 'jump',  height: 0.3 },
  robotarm:    { clear: 'slide', height: 1.3 },
  spectank:    { clear: 'lane',  height: 2.2 },
  portalcrack: { clear: 'jump',  height: 0.1 }
};
const HAZARDS_BY_CLEAR = {
  jump:  ['lowlaser','slime','portalcrack'],
  slide: ['highlaser','robotarm'],
  lane:  ['redx','efence','labcart','spectank'],
  timed: ['steamvent']
};
function pickHazardByWeights() {
  // 30% jump / 20% slide / 40% lane / 10% timed
  const r = Math.random();
  let bucket;
  if      (r < 0.30) bucket = 'jump';
  else if (r < 0.50) bucket = 'slide';
  else if (r < 0.90) bucket = 'lane';
  else               bucket = 'timed';
  const opts = HAZARDS_BY_CLEAR[bucket];
  return opts[Math.floor(Math.random() * opts.length)];
}
function spawnObj(kind, lane, z) {
  const m = FACTORIES[kind]();
  m.position.set(lanePosX(lane), 0, z);
  if (kind === 'crystal' || kind === 'shield' || kind === 'magnet') m.position.y = 1.1;
  pickGroup.add(m);
  const meta = HAZARD_META[kind] || null;
  objects.push({
    kind, lane, z, mesh: m, got: false,
    phase: Math.random() * Math.PI * 2,
    clear: meta ? meta.clear : null,
    height: meta ? meta.height : 0,
    // timed-hazard cycle state (steam vent)
    cycleT: Math.random() * 1.4
  });
}
const FAR_Z = -110;
function trySpawn() {
  const r = Math.random();
  const lane = Math.floor(Math.random()*3) - 1;
  if      (r < 0.06) spawnObj('shield', lane, FAR_Z);
  else if (r < 0.10) spawnObj('magnet', lane, FAR_Z);
  else if (r < 0.46) {
    // single hazard
    const pick = pickHazardByWeights();
    spawnObj(pick, lane, FAR_Z);
    // 22% chance to double up in another lane (forces a swap or right input)
    if (Math.random() < 0.22) {
      const opts = [-1,0,1].filter(L => L !== lane);
      const lane2 = opts[Math.floor(Math.random()*opts.length)];
      const pick2 = pickHazardByWeights();
      spawnObj(pick2, lane2, FAR_Z - 1.2);
    }
  } else if (r < 0.62) {
    // crystal string (3-5 in a lane)
    const n = 3 + Math.floor(Math.random()*3);
    for (let k = 0; k < n; k++) spawnObj('crystal', lane, FAR_Z - k * 2.0);
  } else {
    spawnObj('crystal', lane, FAR_Z);
  }
}

// ============ v25: BRANCHING ZONES ===================================
// Mark: 'I'd also like it if at a certain point the level branches left
// or right and then takes us down other directions of the route. This
// game is meant to be an explore-as-many-paths-and-survive type of game.'
//
// Tier 2 implementation: Y-junction archways spawn every ~150 distance.
// The player's LANE when crossing the archway determines which ZONE the
// corridor transitions to. Each zone has its own color tint and prop
// weighting. The visual transition is smooth (material color lerp over
// ~3 sec). The set of zones visited is tracked in localStorage so the
// player can explore the map.
// v25: zone tints SATURATED so the corridor visibly changes color.

function pickBranchZones() {
  // v25: NO MIDDLE OPTION. Mark: 'There shouldn't be a middle option.'
  // Both choices lead to NEW zones (preferring unvisited).
  const others = ZONE_LIST.filter(z => z !== currentZone);
  others.sort((a, b) => {
    const av = zonesVisited.has(a) ? 1 : 0;
    const bv = zonesVisited.has(b) ? 1 : 0;
    return (av - bv) + (Math.random() - 0.5) * 0.3;
  });
  // Pick the 2 most-preferred (unvisited first), shuffle so L/R are random
  const pair = [others[0], others[1] || others[0]];
  if (Math.random() < 0.5) pair.reverse();
  return [pair[0], pair[1]];        // [left, right]
}

// v28: REAL T-INTERSECTION JUNCTION (no doorways).
// Mark: 'there should also not be doorways, get rid of the doorways.'
// The main corridor opens directly into perpendicular hallways. The
// only blocker is a narrow CENTER COLUMN at the back of the chamber
// — center lane SPLATS, side lanes route into the open side-hallway.
// The main corridor walls fade out as this junction approaches (see
// update loop) so the perpendicular hallways are visible from far away.
function makeJunction(zoneChoices) {
  const grp = new THREE.Group();
  const WALL_H = 5.0;
  const CHAMBER_DEPTH = 8;    // how deep the junction chamber is (z)
  const WING_LEN = 24;        // length of each perpendicular hallway

  const matWall = new THREE.MeshStandardMaterial({
    color: 0x3a4d75, metalness: 0.5, roughness: 0.42
  });
  const matStripeR = new THREE.MeshStandardMaterial({
    color: 0xff2020, metalness: 0.1, roughness: 0.45,
    emissive: 0xff1010, emissiveIntensity: 0.6
  });
  const matWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });

  // ----- FULL DEAD-END BACK WALL (Mark v29: 'the wall should completely
  // be dead end, and I only have a choice to turn right or left').
  // Solid wall spanning the entire chamber width, perpendicular to the
  // corridor. NO opening — center lane SLAMS into it. The side lanes
  // are NOT blocked because the wing entries are at the sides, not
  // through the wall.
  const backWall = new THREE.Mesh(
    new THREE.BoxGeometry(CORR_HALF_W * 2, WALL_H, 0.6), matWall
  );
  backWall.position.set(0, WALL_H / 2, -CHAMBER_DEPTH);
  grp.add(backWall);
  // Red+white hazard stripes painted on the dead-end face
  const stripeCount = 5;
  for (let i = 0; i < stripeCount; i++) {
    const stripeMat = (i % 2 === 0) ? matStripeR : matWhite;
    const stripe = new THREE.Mesh(
      new THREE.BoxGeometry(CORR_HALF_W * 1.85, (WALL_H - 1.4) / stripeCount, 0.06),
      stripeMat
    );
    stripe.position.set(0, 0.7 + (i + 0.5) * ((WALL_H - 1.4) / stripeCount),
                        -CHAMBER_DEPTH + 0.31);
    grp.add(stripe);
  }
  // 'DEAD END' bar across the top of the dead-end wall
  const noBar = new THREE.Mesh(
    new THREE.BoxGeometry(CORR_HALF_W * 1.95, 0.40, 0.07),
    new THREE.MeshStandardMaterial({
      color: 0xff2020, emissive: 0xff1010, emissiveIntensity: 1.0
    })
  );
  noBar.position.set(0, WALL_H - 0.32, -CHAMBER_DEPTH + 0.32);
  grp.add(noBar);
  // Header beam above the dead-end wall (gold stripe)
  const matStripeY = new THREE.MeshStandardMaterial({
    color: 0xffd23a, metalness: 0.2, roughness: 0.5,
    emissive: 0xffd23a, emissiveIntensity: 0.55
  });
  const headerBeam = new THREE.Mesh(
    new THREE.BoxGeometry(CORR_HALF_W * 2.1, 0.18, 0.65), matStripeY
  );
  headerBeam.position.set(0, WALL_H + 0.18, -CHAMBER_DEPTH);
  grp.add(headerBeam);

  // ----- PERPENDICULAR HALLWAYS (one per side, OPEN to corridor) ------
  for (let side = -1; side <= 1; side += 2) {
    const zoneKey = (side < 0) ? zoneChoices[0] : zoneChoices[1];
    const tint = ZONES[zoneKey].tint;

    // Wing extends from x=±CORR_HALF_W outward, between z=-CHAMBER_DEPTH and z=0
    const wingNearX   = side * CORR_HALF_W;
    const wingFarX    = side * (CORR_HALF_W + WING_LEN);
    const wingCenterX = side * (CORR_HALF_W + WING_LEN / 2);
    const wingCenterZ = -CHAMBER_DEPTH / 2;

    // Wing FLOOR — zone-tinted so it reads at distance as the colored lane.
    const wingFloor = new THREE.Mesh(
      new THREE.PlaneGeometry(WING_LEN, CHAMBER_DEPTH),
      new THREE.MeshStandardMaterial({
        color: tint, metalness: 0.35, roughness: 0.55,
        emissive: tint, emissiveIntensity: 0.22
      })
    );
    wingFloor.rotation.x = -Math.PI / 2;
    wingFloor.position.set(wingCenterX, 0.012, wingCenterZ);
    grp.add(wingFloor);

    // Wing CEILING
    const wingCeil = new THREE.Mesh(
      new THREE.PlaneGeometry(WING_LEN, CHAMBER_DEPTH),
      new THREE.MeshStandardMaterial({ color: 0x1a2540, metalness: 0.3, roughness: 0.65 })
    );
    wingCeil.rotation.x = Math.PI / 2;
    wingCeil.position.set(wingCenterX, WALL_H - 0.02, wingCenterZ);
    grp.add(wingCeil);

    // Wing FAR-Z wall (the "back" of the wing — what closes off the
    // hallway on the far side from the player's approach).
    const wingBack = new THREE.Mesh(
      new THREE.BoxGeometry(WING_LEN, WALL_H, 0.22), matWall
    );
    wingBack.position.set(wingCenterX, WALL_H / 2, -CHAMBER_DEPTH);
    grp.add(wingBack);

    // Wing NEAR-Z wall (closer to camera — closes off the hallway on
    // the side facing the player so the corridor visually CONTINUES
    // past the junction into the wing).
    const wingFront = new THREE.Mesh(
      new THREE.BoxGeometry(WING_LEN, WALL_H, 0.22), matWall
    );
    wingFront.position.set(wingCenterX, WALL_H / 2, 0);
    grp.add(wingFront);

    // Wing END-CAP (the wall at the far end of the perpendicular hallway).
    const wingEnd = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, WALL_H, CHAMBER_DEPTH), matWall
    );
    wingEnd.position.set(wingFarX, WALL_H / 2, wingCenterZ);
    grp.add(wingEnd);

    // ZONE-COLOR signage panel on the end-cap so the wing reads as
    // 'BIO/CRYO/POWER' from a distance
    const wingEndPanel = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, WALL_H * 0.72, CHAMBER_DEPTH * 0.82),
      new THREE.MeshStandardMaterial({
        color: tint, emissive: tint, emissiveIntensity: 1.6,
        metalness: 0.15, roughness: 0.4
      })
    );
    wingEndPanel.position.set(wingFarX - side * 0.18, WALL_H * 0.55, wingCenterZ);
    grp.add(wingEndPanel);

    // Ambient GLOW inside the wing (zone-tinted point light)
    const wingLight = new THREE.PointLight(tint, 3.4, 26, 2);
    wingLight.position.set(wingCenterX, WALL_H * 0.62, wingCenterZ);
    grp.add(wingLight);

    // ----- TALL ZONE-TINTED BEACON at the wing entry (visible from far
    // down the main corridor — pokes above the corridor walls)
    const BEACON_H = 12.5;
    const beaconX = side * (CORR_HALF_W - 0.12);
    const beaconPole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.16, BEACON_H, 8),
      new THREE.MeshStandardMaterial({ color: 0x1a2540, metalness: 0.7, roughness: 0.35 })
    );
    beaconPole.position.set(beaconX, BEACON_H / 2, -0.4);
    grp.add(beaconPole);
    const beaconBall = new THREE.Mesh(
      new THREE.SphereGeometry(0.6, 16, 12),
      new THREE.MeshStandardMaterial({
        color: tint, emissive: tint, emissiveIntensity: 2.4,
        metalness: 0.1, roughness: 0.4
      })
    );
    beaconBall.position.set(beaconX, BEACON_H + 0.25, -0.4);
    grp.add(beaconBall);
    const beaconHalo = new THREE.PointLight(tint, 3.5, 34, 2);
    beaconHalo.position.set(beaconX, BEACON_H + 0.25, -0.4);
    grp.add(beaconHalo);

    // ZONE-TINTED FLOOR PAINT inside the main-corridor chamber (the
    // 'turn here' arrow on the floor leading into this wing)
    const floorMark = new THREE.Mesh(
      new THREE.PlaneGeometry(1.6, CHAMBER_DEPTH * 0.85),
      new THREE.MeshBasicMaterial({
        color: tint, transparent: true, opacity: 0.6
      })
    );
    floorMark.rotation.x = -Math.PI / 2;
    floorMark.position.set(side * LANE_X, 0.018, -CHAMBER_DEPTH / 2);
    grp.add(floorMark);

    // Big DIRECTIONAL ARROW on the floor at the player's lane,
    // pointing OUTWARD into the wing
    const arrow = new THREE.Mesh(
      new THREE.ConeGeometry(0.55, 0.95, 4), matWhite
    );
    arrow.position.set(side * LANE_X, 0.04, -CHAMBER_DEPTH / 2);
    arrow.rotation.x = -Math.PI / 2;
    arrow.rotation.z = side < 0 ? -Math.PI / 2 : Math.PI / 2;
    grp.add(arrow);
  }

  grp.userData.choices = zoneChoices;
  grp.userData.resolved = false;
  return grp;
}
