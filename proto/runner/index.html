// ============ v29: HEADING-BASED TURN CINEMATIC =======================
// Mark v28: 'my character turned left and kept on going straight. It
// did not walk down the right hallway.'
//
// Architecture: the runner is built around -Z scrolling. Persistent
// world rotation breaks that (props drift sideways in world space, the
// camera no longer 'sees' things approaching). For the prototype, the
// turn is a CINEMATIC: world rotates 0 → ±π/2 over ~0.6s while the
// character leans into the turn, the screen flashes the new zone color
// at the peak, then the world SNAPS BACK to identity and the active
// junction is despawned. The new corridor takes the new zone tint so
// it visibly reads as 'a new hallway' even though physically the player
// continues running -Z.
let playerHeading = 0;   // radians: 0 = facing -Z (initial)

let turning = null;        // null | 'left' | 'right'
let turnT = 0;
let turnFromHeading = 0;
let turnToHeading = 0;
let turnSnapped = false;
const TURN_DURATION = 0.85;

function startTurn(direction, tintHex) {
  turning = direction;
  turnT = TURN_DURATION;
  turnSnapped = false;
  turnFromHeading = playerHeading;
  // v30 SIGN FIX (Mark v29: 'when I turn right the character and camera
  // go left'). The matrix coefficients (m[0]=cos, m[2]=-sin) match a
  // standard Ry(+angle), so applyWorldTransform(-playerHeading) gives
  // Ry(-playerHeading). For RIGHT turn we want Ry(+π/2) so that +X
  // (right wing) maps to -Z (front view); that needs
  // playerHeading = -π/2. Mirror for LEFT.
  turnToHeading = playerHeading + (direction === 'left' ? +Math.PI / 2 : -Math.PI / 2);
  let fl = document.getElementById('turn-flash');
  if (!fl) {
    fl = document.createElement('div');
    fl.id = 'turn-flash';
    fl.style.cssText = 'position:fixed;inset:0;pointer-events:none;' +
      'background:#fff;opacity:0;z-index:25;transition:none;';
    document.body.appendChild(fl);
  }
  fl.style.background = '#' + tintHex.toString(16).padStart(6, '0');
}

function tickTurn(dt) {
  let flashAlpha = 0;
  let bodyLean = 0;
  if (turning) {
    turnT = Math.max(0, turnT - dt);
    const phase = 1 - (turnT / TURN_DURATION);   // 0 → 1

    // v32 phases (smoother): cubic ease-in-out rotation, sine-curve
    //                       flash, snap centered at 0.5.
    //   0.00 → 0.50 : world rotates 0 → target (ease-in-out cubic).
    //                 flash ramps 0 → peak via half-sine (no abrupt edge).
    //   0.50        : SNAP — playerHeading=0, junction despawned,
    //                        textures swapped to new zone.
    //   0.50 → 1.00 : flash fades peak → 0 via half-sine (smooth release).
    const FLASH_PEAK = 0.92;
    if (phase < 0.5) {
      const rPhase = phase / 0.5;             // 0 → 1 over rotation half
      // ease-in-out cubic
      const eased = rPhase < 0.5
        ? 4 * rPhase * rPhase * rPhase
        : 1 - Math.pow(-2 * rPhase + 2, 3) / 2;
      playerHeading = turnFromHeading + (turnToHeading - turnFromHeading) * eased;
      // Half-sine flash ramp: starts at 0 with zero slope, ends at peak
      // with zero slope — no perceived corners on the alpha curve.
      flashAlpha = FLASH_PEAK * Math.sin(rPhase * Math.PI / 2);
    } else {
      playerHeading = 0;
      const fPhase = (phase - 0.5) / 0.5;     // 0 → 1 over flash-fade half
      flashAlpha = FLASH_PEAK * Math.cos(fPhase * Math.PI / 2);
    }

    // SNAP at phase 0.5 (executed once)
    if (phase >= 0.5 && !turnSnapped) {
      turnSnapped = true;
      // Despawn every resolved junction (the one that started this turn)
      for (let i = branches.length - 1; i >= 0; i--) {
        if (branches[i].resolved) {
          worldGrp.remove(branches[i].mesh);
          branches.splice(i, 1);
        }
      }
      // v31: hot-swap corridor textures to the new zone's set. Hidden
      // by the peak flash so player sees 'walked into a new zone.'
      if (typeof applyZoneTextures === 'function') applyZoneTextures(currentZone);
    }

    // Character LEAN — flipped sign vs v28. Because danny.rotation.y = π
    // is applied AFTER rotation.z (XYZ Euler order), a positive
    // rotation.z makes the character APPEAR to lean LEFT from the
    // camera's POV (his right shoulder lifts to camera-LEFT). For
    // right-turn = visual-right-lean, we need negative rotation.z when
    // turnToHeading > turnFromHeading.
    const leanDir = (turnToHeading > turnFromHeading) ? -1 : +1;
    bodyLean = Math.sin(phase * Math.PI) * 0.36 * leanDir;

    if (turnT <= 0) {
      turning = null;
      playerHeading = 0;
      turnFromHeading = 0;
      turnToHeading = 0;
      turnSnapped = false;
    }
  }

  applyWorldTransform(-playerHeading);

  // Apply character lean
  if (typeof danny !== 'undefined') {
    const cur = danny.rotation.z || 0;
    danny.rotation.z = cur + (bodyLean - cur) * Math.min(1, dt * 12);
  }

  const fl = document.getElementById('turn-flash');
  if (fl) fl.style.opacity = flashAlpha.toFixed(3);
}

let runT = 0;
// Mark: "right now he's just shaking." Bug was driving stride animation
// from runT (which advances by dt*speed = ~0.27/frame at speed 16),
// times the 6.5 stride multiplier = 1.74 rad/frame — faster than the
// lerp can chase, so limbs vibrated near zero. Stride now drives off
// a dedicated wall-clock phase that advances at a real-world cadence
// (~1.7 cycles/sec at base speed, ramping with run speed).
let stridePhase = 0;
let shake = 0;

// ============ input ==================================================
function moveLane(d) {
  if (state==='play') {
    const before = lane;
    lane = Math.max(-1, Math.min(1, lane + d));
    if (lane !== before) sfx('select');
  }
}
function doJump() {
  if (state !== 'play') return;
  // Slide cancels into jump if you tap up while sliding
  if (slideT > 0) slideT = 0;
  if (onGround) { jumpV = 7.0; onGround = false; sfx('jump'); }
}
function doSlide() {
  if (state !== 'play') return;
  // mid-air slide drops you to ground for a slide
  if (!onGround) { jumpY = 0; jumpV = 0; onGround = true; }
  slideT = SLIDE_DURATION;
  sfx('slide');
}
window.addEventListener('keydown', e => {
  unlockAudio();
  if (state !== 'play' && (e.key === ' ' || e.key === 'Enter')) { reset(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'a') moveLane(-1);
  else if (e.key === 'ArrowRight' || e.key === 'd') moveLane(1);
  else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') { e.preventDefault(); doJump(); }
  else if (e.key === 'ArrowDown' || e.key === 's') { e.preventDefault(); doSlide(); }
});
let tsx = 0, tsy = 0, tracking = false;
canvas.addEventListener('pointerdown', e => { unlockAudio(); tsx = e.clientX; tsy = e.clientY; tracking = true; });
canvas.addEventListener('pointerup', e => {
  if (!tracking) return; tracking = false;
  if (state !== 'play') { reset(); return; }
  const dx = e.clientX - tsx, dy = e.clientY - tsy;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) { doJump(); return; }
  if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
  else if (dy < 0) doJump();
  else doSlide();                                  // swipe DOWN = slide
});
document.getElementById('overlay').addEventListener('click', () => { if (state !== 'play') reset(); });

// ============ reset / overlay ========================================
function reset() {
  for (const o of objects) pickGroup.remove(o.mesh);
  objects.length = 0;
  state = 'play'; dist = 0; speed = 16.0; crystals = 0; goalDone = false;
  lane = 0; laneF = 0; jumpV = 0; jumpY = 0; onGround = true;
  slideT = 0;
  shield = 0; magnet = 0; spawnAcc = 0; runT = 0; stridePhase = 0; shake = 0;
  // v25: clear active dead-end walls + reset zone + turn + Danny scale
  for (const b of branches) worldGrp.remove(b.mesh);
  branches.length = 0;
  nextBranchAt = 180;
  currentZone = 'MAIN';
  zoneTint = new THREE.Color(0xffffff);
  zoneTargetTint = new THREE.Color(0xffffff);
  refreshZoneHUD();
  // v26: stop any turn in progress and reset persistent heading + world.
  turning = null; turnT = 0;
  playerHeading = 0;
  applyWorldTransform(0);
  const fl = document.getElementById('turn-flash');
  if (fl) fl.style.opacity = '0';
  // Clear splat scale + reset character orientation on Danny
  danny.scale.set(1, 1, 1);
  danny.rotation.z = 0;
  // v28: reset wall fade to fully opaque on a fresh run
  if (typeof wallMatL !== 'undefined') wallMatL.opacity = 1.0;
  if (typeof wallMatR !== 'undefined') wallMatR.opacity = 1.0;
  // v31: reset corridor textures to the MAIN zone
  if (typeof applyZoneTextures === 'function') applyZoneTextures('MAIN');
  AUDIO.lastStepSin = 0;
  fadeMusic(AUDIO.music_vol, 600);                      // restore music after death/win
  document.getElementById('overlay').classList.remove('on');
  for (let i = 0; i < 6; i++) {
    spawnObj('crystal', Math.floor(Math.random()*3) - 1, -25 - i * 8);
  }
}
function score() { return Math.floor(dist * 3) + crystals * 20; }
function showOverlay(title, kind) {
  const ov = document.getElementById('overlay');
  document.getElementById('ov-h1').textContent = title;
  // v25: friendly secondary message for SPLAT (vs. generic 'caught')
  let sub = '';
  if (kind === 'won') sub = 'TIME MACHINE REPAIRED!';
  else if (title === 'SPLAT!') sub = 'OUCH. PICK A DOORWAY NEXT TIME!';
  document.getElementById('ov-h2').textContent = sub;
  document.getElementById('ov-h1').style.color = kind === 'won' ? '#b8a8ff' : '#d33a3a';
  document.getElementById('ov-p1').textContent = '🪙 ' + crystals + ' / ' + CRYSTAL_GOAL;
  document.getElementById('ov-p2').textContent = 'SCORE ' + score() + '   •   ' + Math.floor(dist * 3) + ' m';
  ov.classList.add('on');
}

// ============ update + render ========================================
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  if (state === 'play') {
    runT += dt * speed;
    speed = Math.min(36, 16.0 + dist * 0.012);
    dist += speed * dt;
    if (shield > 0) shield = Math.max(0, shield - dt);
    if (magnet > 0) magnet = Math.max(0, magnet - dt);
    if (shake > 0)  shake  = Math.max(0, shake - dt);

    laneF += (lane - laneF) * Math.min(1, dt * 18);
    if (!onGround) {
      jumpY += jumpV * dt - 0.5 * 18 * dt * dt;
      jumpV -= 18 * dt;
      if (jumpY <= 0) { jumpY = 0; onGround = true; jumpV = 0; }
    }
    // slide timer countdown
    if (slideT > 0) slideT = Math.max(0, slideT - dt);
    // v25: floor scroll FLIPPED + speed-locked to the actual world speed
    // that the side props translate at. Derivation:
    //   PlaneGeometry length CORR_LEN=240, repeat.y=24 → 1 V cycle covers
    //   240/24 = 10 world units. To make floor texture pass at the same
    //   speed as props (which move `speed` world units/sec), offset.y must
    //   change by speed/10 = speed*0.1 per second.
    // Sign FLIPPED from -= to += because rotation.x = -π/2 maps the plane
    // +V axis to world -Z; for content to flow TOWARD camera (+Z world)
    // as the Computer runs forward, offset.y must INCREASE.
    floorTex.offset.y += dt * speed * 0.1;
    // Wall scrolls also speed-locked: U has 4 cycles across 240 length =
    // 60 world units/cycle → rate 1/60 ≈ 0.0167. Direction kept from v10.
    wallTex.offset.x  += dt * speed * 0.0167;
    wallTexR.offset.x -= dt * speed * 0.0167;

    // ceiling lights cycle z position to feel like fixtures passing
    for (let i = 0; i < ceilLights.length; i++) {
      ceilLights[i].intensity = 1.15 + 0.15 * Math.sin(runT * 2.0 + i);
      ceilLights[i].position.z += dt * speed * 1.2;
      if (ceilLights[i].position.z > 12) ceilLights[i].position.z -= 14 * ceilLights.length;
    }

    // side props slide toward camera at world speed, recycle when behind
    for (let i = 0; i < sideProps.length; i++) {
      const sp = sideProps[i];
      sp.mesh.position.z += speed * dt;
      sp.z = sp.mesh.position.z;
      if (sp.z > 10) {
        sp.mesh.position.z -= PROP_COUNT * PROP_SPACING;
        sp.z = sp.mesh.position.z;
        // randomize the specimen tube creature color when recycled (variety)
        const al = sp.mesh.userData && sp.mesh.userData.alien;
        if (al) {
          const palette = [0x7a3aff, 0xff6a4a, 0x1ab3ff, 0xff39c5, 0x39e36e];
          al.material.color.setHex(palette[Math.floor(Math.random() * palette.length)]);
        }
      }
      // animate specimen bubbles
      const al = sp.mesh.userData && sp.mesh.userData.alien;
      if (al) {
        al.position.y = 1.4 + Math.sin(runT * 2 + i) * 0.10;
        al.rotation.y = Math.sin(runT * 1.4 + i) * 0.4;
      }
    }

    spawnAcc += speed * dt;
    if (spawnAcc > 24) { trySpawn(); spawnAcc = 0; }   // v25: 14 → 24 = less stuff less often

    // v25: DEAD-END BRANCH spawn + resolve + cinematic-turn dispatch
    // Spawn a dead-end wall when we pass the next-branch distance.
    if (dist > nextBranchAt) {
      const choices = pickBranchZones();
      const wall = makeJunction(choices);
      wall.position.set(0, 0, FAR_Z);
      worldGrp.add(wall);
      branches.push({ mesh: wall, z: FAR_Z, choices, resolved: false });
      nextBranchAt = dist + BRANCH_INTERVAL;
    }
    // Update the cinematic-turn timers
    tickTurn(dt);
    // Move + recycle + resolve each active junction. Also compute
    // wall fade: as the closest junction approaches, fade the main
    // corridor's side walls to transparent so the perpendicular
    // hallways are clearly visible. After the junction passes, fade
    // the walls back in.
    let wallTargetOpacity = 1.0;
    for (let i = branches.length - 1; i >= 0; i--) {
      const b = branches[i];
      b.mesh.position.z += speed * dt;
      b.z = b.mesh.position.z;
      // v28: junction has CHAMBER_DEPTH=4. Origin is the chamber's
      // FRONT edge. When b.z=0, chamber spans [-4, 0] (ahead of player).
      // When b.z=4, chamber spans [0, 4] — player is INSIDE the chamber.
      // Resolve choice at the chamber middle (b.z = 2).
      if (!b.resolved && b.z > 2) {
        const laneRounded = Math.round(laneF);
        if (laneRounded === 0) {
          // ---- CENTER LANE: SPLAT INTO THE BACK COLUMN ----
          state = 'dead';
          shake = 0.8;
          danny.scale.set(1.75, 0.85, 0.22);
          danny.position.y = BASE_Y + 0.5;
          sfx('hit');
          setTimeout(() => sfx('gameover'), 220);
          fadeMusic(0.10, 500);
          showOverlay('SPLAT!', 'dead');
        } else {
          // ---- LEFT or RIGHT LANE: TURN into new perpendicular hallway ----
          const pick = (laneRounded < 0) ? b.choices[0] : b.choices[1];
          const direction = (laneRounded < 0) ? 'left' : 'right';
          startTurn(direction, ZONES[pick].tint);
          if (pick !== currentZone) {
            currentZone = pick;
            zonesVisited.add(pick);
            localStorage.setItem('sdr_zones', JSON.stringify([...zonesVisited]));
            applyZoneTint();
            refreshZoneHUD();
            showZoneBanner(pick);
            sfx('powerup');
          }
        }
        b.resolved = true;
      }
      // Wall fade: closest junction within ~[-32, 14] world z drives
      // a dip in opacity that peaks around b.z = -8.
      if (b.z > -36 && b.z < 16) {
        const peakZ = -8;
        const dist = Math.abs(b.z - peakZ);
        const fadeAmt = Math.max(0, 1 - dist / 22);
        // v32: softer fade (min ~0.45 instead of 0.12) so the walls
        // don't disappear entirely — eases the visual chaos around
        // the junction.
        const opacityHere = 1.0 - fadeAmt * 0.55;
        if (opacityHere < wallTargetOpacity) wallTargetOpacity = opacityHere;
      }
      // Despawn once well past the camera
      if (b.z > 28) {
        worldGrp.remove(b.mesh);
        branches.splice(i, 1);
      }
    }
    // Lerp wall opacity to the target (smooth fade in/out, ~0.4s)
    const wallO = wallMatL.opacity + (wallTargetOpacity - wallMatL.opacity) * Math.min(1, dt * 4.5);
    wallMatL.opacity = wallO;
    wallMatR.opacity = wallO;
    // v31: textures carry the zone palette directly (applyZoneTextures
    // swaps them at the turn snap). No multiplicative tint on wall +
    // floor materials — they stay at color=white and let the texture do
    // the work. zoneTint kept only for the HUD/banner styling.

    for (let i = 0; i < objects.length; i++) {
      const o = objects[i];
      if (o.got) continue;
      o.z += speed * dt;
      // magnet pulls chrono crystals
      if (magnet > 0 && o.kind === 'crystal' && o.z > -30 && o.z < 5) {
        if (o.lane !== Math.round(laneF)) o.lane = Math.round(laneF);
      }
      o.mesh.position.x += (lanePosX(o.lane) - o.mesh.position.x) * Math.min(1, dt * 14);
      o.mesh.position.z = o.z;
      // per-kind animations
      if (o.kind === 'crystal') {
        // v25: COIN spins around its Y axis at ~1 cycle/sec at base speed
        // — slow enough for the face/edge alternation to read as a coin.
        // Was runT * 1.8 (~4.6 cycles/sec) → way too fast to register.
        o.mesh.rotation.y = runT * 0.40 + o.phase;
        o.mesh.position.y = 1.0 + Math.sin(runT * 0.8 + o.phase) * 0.08;
      } else if (o.kind === 'shield' || o.kind === 'magnet') {
        // v25: power-up orb gently rotates + PULSES so the wrapper reads
        // as 'pickup me' clearly distinct from any hazard.
        o.mesh.rotation.y = runT * 0.25 + o.phase;
        o.mesh.position.y = 1.1 + Math.sin(runT * 0.8 + o.phase) * 0.08;
        const pulse = 1.0 + 0.08 * Math.sin(runT * 1.4 + o.phase);
        o.mesh.scale.set(pulse, pulse, pulse);
      } else if (o.kind === 'robotarm') {
        // swing the arm back and forth horizontally
        const armG = o.mesh.userData.armG;
        // v25: was sin(runT*3)*0.55 → ~7.6 cycles/sec at base speed, wild.
        // Now ~1.0 cycles/sec at base + wider swing arc so it threats the
        // full lane visually but reads as a slow sweep.
        if (armG) armG.rotation.z = Math.sin(runT * 0.45 + o.phase) * 0.75;
      } else if (o.kind === 'efence') {
        // pulse arc opacity
        const arcs = o.mesh.userData.arcs;
        if (arcs) for (const a of arcs) a.material.opacity = 0.5 + 0.5 * Math.abs(Math.sin(runT * 9 + o.phase));
      } else if (o.kind === 'lowlaser' || o.kind === 'highlaser') {
        // subtle beam flicker
        const beam = o.mesh.userData.beam;
        if (beam) beam.material.opacity = 0.85 + 0.15 * Math.sin(runT * 14 + o.phase);
      } else if (o.kind === 'slime') {
        for (const b of o.mesh.children) {
          if (b.userData && b.userData.phase != null) {
            b.position.y = 0.18 + 0.18 * Math.abs(Math.sin(runT*3 + b.userData.phase));
          }
        }
      } else if (o.kind === 'spectank') {
        const al = o.mesh.userData.alien;
        if (al) al.position.y = 1.10 + Math.sin(runT * 2 + o.phase) * 0.10;
      } else if (o.kind === 'labcart') {
        // slight horizontal sway
        o.mesh.rotation.y = Math.sin(runT * 3 + o.phase) * 0.05;
      } else if (o.kind === 'portalcrack') {
        // floating glow particles bob
        for (const c of o.mesh.children) {
          if (c.userData && c.userData.baseY != null) {
            c.position.y = c.userData.baseY + Math.sin(runT * 4 + c.userData.phase) * 0.05;
          }
        }
      } else if (o.kind === 'steamvent') {
        // 1.4s cycle: 0.7s on, 0.7s off. Active when (cycleT % 1.4) < 0.7.
        o.cycleT += dt;
        const on = (o.cycleT % 1.4) < 0.7;
        const sList = o.mesh.userData.steam || [];
        for (const s of sList) s.visible = on;
        o.steamOn = on;
        // pulse steam scale during the on phase
        if (on) {
          const ph = (o.cycleT % 1.4) / 0.7;
          for (const s of sList) s.scale.y = 0.6 + 1.2 * Math.sin(ph * Math.PI);
        }
      }

      // collision window — player is around z=5
      const px = lanePosX(Math.round(laneF));
      if (o.z > 4.0 && o.z < 6.5 && Math.abs(o.mesh.position.x - px) < 1.0) {
        if (o.kind === 'crystal') {
          o.got = true; crystals++; pickGroup.remove(o.mesh);
          sfx('crystal');
          if (crystals >= CRYSTAL_GOAL && !goalDone) {
            goalDone = true; state = 'won';
            if (score() > best) { best = score(); localStorage.setItem('sdr_best', best); }
            if (crystals > bestC)  { bestC = crystals; localStorage.setItem('sdr_bestC', bestC); }
            sfx('goal');
            fadeMusic(0.18, 600);
            showOverlay('YOU DID IT!', 'won');
          }
        } else if (o.kind === 'shield') {
          o.got = true; shield = 6; pickGroup.remove(o.mesh);
          sfx('powerup');
        } else if (o.kind === 'magnet') {
          o.got = true; magnet = 6; pickGroup.remove(o.mesh);
          sfx('powerup');
        } else {
          // HAZARD — check clear method
          let cleared = false;
          if (o.clear === 'jump') {
            cleared = jumpY > 0.6;
          } else if (o.clear === 'slide') {
            cleared = slideT > 0;
          } else if (o.clear === 'lane') {
            cleared = false;        // must be in a different lane (already filtered by x-check)
          } else if (o.clear === 'timed') {
            // steam vent: cleared if steam is currently OFF
            cleared = !o.steamOn;
            // also cleared if you jump over it during the on-phase
            if (!cleared && jumpY > 1.2) cleared = true;
          }
          if (!cleared) {
            if (shield > 0) {
              o.got = true; shield = 0; shake = 0.25; pickGroup.remove(o.mesh);
              sfx('hit');
            } else {
              state = 'dead'; shake = 0.4;
              if (score() > best) { best = score(); localStorage.setItem('sdr_best', best); }
              if (crystals > bestC)  { bestC = crystals; localStorage.setItem('sdr_bestC', bestC); }
              sfx('hit');
              setTimeout(() => sfx('gameover'), 220);
              fadeMusic(0.10, 500);
              showOverlay('CAUGHT!', 'dead');
            }
          }
        }
      }
    }
    for (let i = objects.length - 1; i >= 0; i--) {
      const o = objects[i];
      if (o.got || o.z > 12) {
        if (!o.got) pickGroup.remove(o.mesh);
        objects.splice(i, 1);
      }
    }

    // ---- Danny run animation — every joint driven separately --------
    // Stride cadence: ~1.7 cycles/sec at base, ~2.7 at top speed.
    const sliding = slideT > 0;
    if (onGround && !sliding) {
      stridePhase += dt * (10 + speed * 0.2);
      // Fire footstep sfx on each sin(stridePhase) zero-crossing (twice
      // per cycle = one tap per foot strike).
      const s = Math.sin(stridePhase);
      const sign = s >= 0 ? 1 : -1;
      if (AUDIO.lastStepSin && sign !== AUDIO.lastStepSin) sfx('step');
      AUDIO.lastStepSin = sign;
    } else {
      AUDIO.lastStepSin = 0;       // reset so no spurious step on landing
    }
    const phase  = sliding ? 0 : stridePhase;
    const phaseR = phase + Math.PI;          // right leg/arm 180° out of phase
    const lerp   = Math.min(1, dt * 14);

    // Target poses per joint. Each is a single trig expression of the
    // stride phase, then lerped into the current angle for smoothness.
    function legPose(p) {
      const hipAngle  = Math.sin(p) * 0.65;                 // forward/back swing
      // knee bends most on the BACK swing (heel toward butt) and least
      // on the FORWARD reach (leg extends).
      const back      = Math.max(0, -Math.cos(p));          // 0..1, peaks when leg is back
      const kneeAngle = -(0.2 + back * 0.9);                 // 0.2..1.1 rad bend (negative = bend backward)
      // ankle: dorsiflex on reach, plantarflex on push-off
      const anklAngle = Math.cos(p + 0.6) * 0.25;
      return { hip: hipAngle, knee: kneeAngle, ankl: anklAngle };
    }
    function armPose(p) {
      // arms swing OPPOSITE to legs (right arm forward when left leg forward)
      const shldAngle = -Math.sin(p) * 0.55;
      // elbow stays partly bent always (~0.7 rad), bending more when arm is back
      const back      = Math.max(0, Math.cos(p));
      const elbwAngle = -(0.6 + back * 0.5);
      return { shld: shldAngle, elbw: elbwAngle };
    }
    // Compose targets — slide overrides with a forward-tucked pose.
    let tHipL, tHipR, tKneeL, tKneeR, tAnklL, tAnklR;
    let tShldL, tShldR, tElbwL, tElbwR, tSpine;
    if (sliding) {
      tHipL  = 1.0;  tHipR  = 0.8;
      tKneeL = -0.6; tKneeR = -0.6;
      tAnklL = 0.3;  tAnklR = 0.3;
      tShldL = 0.5;  tShldR = 0.5;
      tElbwL = -1.0; tElbwR = -1.0;
      tSpine = 0;
    } else {
      const lp = legPose(phase),  rp = legPose(phaseR);
      const la = armPose(phaseR), ra = armPose(phase);     // arms inverted vs legs
      tHipL  = lp.hip;  tHipR  = rp.hip;
      tKneeL = lp.knee; tKneeR = rp.knee;
      tAnklL = lp.ankl; tAnklR = rp.ankl;
      tShldL = la.shld; tShldR = ra.shld;
      tElbwL = la.elbw; tElbwR = ra.elbw;
      tSpine = Math.sin(phase) * 0.12;                     // counter-rotate torso to hips
    }

    const ud = danny.userData;
    ud.hipL  += (tHipL  - ud.hipL)  * lerp;
    ud.hipR  += (tHipR  - ud.hipR)  * lerp;
    ud.kneeL += (tKneeL - ud.kneeL) * lerp;
    ud.kneeR += (tKneeR - ud.kneeR) * lerp;
    ud.anklL += (tAnklL - ud.anklL) * lerp;
    ud.anklR += (tAnklR - ud.anklR) * lerp;
    ud.shldL += (tShldL - ud.shldL) * lerp;
    ud.shldR += (tShldR - ud.shldR) * lerp;
    ud.elbwL += (tElbwL - ud.elbwL) * lerp;
    ud.elbwR += (tElbwR - ud.elbwR) * lerp;
    ud.spine += (tSpine - ud.spine) * lerp;

    legL.hip.rotation.x   = ud.hipL;
    legL.knee.rotation.x  = ud.kneeL;
    legL.ankle.rotation.x = ud.anklL;
    legR.hip.rotation.x   = ud.hipR;
    legR.knee.rotation.x  = ud.kneeR;
    legR.ankle.rotation.x = ud.anklR;
    armL.shoulder.rotation.x = ud.shldL;
    armL.elbow.rotation.x    = ud.elbwL;
    armR.shoulder.rotation.x = ud.shldR;
    armR.elbow.rotation.x    = ud.elbwR;
    // spine twist — read by torso (we don't have a spine pivot Object
    // but we can rotate the head's parent group, which is danny itself.
    // Apply as a tiny Y rotation of the torso pieces by re-rotating
    // the head + cap + backpack only. Cheaper: apply to body via
    // existing danny.rotation.z lean below.
    // smooth lane lerp
    danny.position.x += (lanePosX(laneF) - danny.position.x) * Math.min(1, dt * 18);
    // base Y: jump height when in air; while sliding, drop the body lower
    const slideDip = sliding ? -0.4 : 0;
    const targetY = BASE_Y + jumpY + slideDip;
    danny.position.y += (targetY - danny.position.y) * Math.min(1, dt * 18);
    // body lean while running (side twist only — keep X stable to avoid fighting the 180° face flip)
    // While sliding, body tilts forward strongly
    const sinP = Math.sin(phase), cosP = Math.cos(phase);
    const targetZRot = sliding ? 0 : (sinP * 0.05);
    const targetXRot = sliding ? -0.85 : 0;
    danny.rotation.z = targetZRot;
    danny.rotation.x = (danny.rotation.x || 0) + (targetXRot - (danny.rotation.x || 0)) * lerp;
    // head bob — head dips slightly each stride
    head.position.y = 2.35 + Math.abs(cosP) * 0.04;
    // v25: CRT power LEDs blink with the run; antenna ball pulses
    if (head.userData.antBall) {
      const pulse = 0.6 + 0.4 * Math.sin(stridePhase * 2);
      head.userData.antBall.material.emissiveIntensity = 0.8 + pulse * 0.8;
    }
    if (head.userData.powerLED) {
      head.userData.powerLED.material.emissiveIntensity =
        ((stridePhase * 0.5) | 0) % 2 === 0 ? 1.6 : 0.3;
    }
    // v25: coat tail flaps — swings up behind on each stride, with a lag
    // so it trails the body. Lifts higher at speed. Settles flat on slide.
    const tailTarget = sliding ? 0.3 : (0.35 + sinP * 0.30 + (speed - 16) * 0.012);
    ud.tail = (ud.tail || 0) + (tailTarget - (ud.tail || 0)) * Math.min(1, dt * 9);
    coatTail.rotation.x = ud.tail;
    // shadow follows in world-space (stays on the floor)
    shadow.position.x = danny.position.x;
    shadow.position.z = danny.position.z;
    shadow.position.y = 0.02;
    const sScale = Math.max(0.5, 1 - jumpY * 0.3);
    shadow.scale.set(sScale, 1, sScale);
  }

  // live GFX tuning
  if (renderer.toneMappingExposure !== GFX.toneExposure) {
    renderer.toneMappingExposure = GFX.toneExposure;
  }
  if (GFX._lastEnv !== GFX.envIntensity) {
    GFX._lastEnv = GFX.envIntensity;
    scene.traverse(o => {
      if (o.material && 'envMapIntensity' in o.material) o.material.envMapIntensity = GFX.envIntensity;
    });
  }
  updateCamera(dt);
  if (shake > 0) {
    // Add shake on top of the smoothed camera follow position.
    camera.position.x += (Math.random() - 0.5) * shake * 0.6;
    camera.position.y += (Math.random() - 0.5) * shake * 0.4;
  }

  document.getElementById('ui-gears').textContent = crystals;
  document.getElementById('ui-score').textContent = score();
  document.getElementById('ui-dist').textContent = Math.floor(dist * 3);
  document.getElementById('ui-best').textContent  = best;
  document.getElementById('ui-prog').style.width = (Math.min(1, crystals / CRYSTAL_GOAL) * 100) + '%';
  document.getElementById('pwr-shield').classList.toggle('on', shield > 0);
  document.getElementById('pwr-magnet').classList.toggle('on', magnet > 0);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

reset();
tick();
</script>
</body>
</html>
