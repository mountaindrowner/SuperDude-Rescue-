<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>Super Dude Runner — Proof of Concept</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #0a0a1a; overflow: hidden;
    font-family: system-ui, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #0a0a1a;
           max-width: 100vw; max-height: 100vh; }
  #hint { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center;
          color: #6d7398; font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="800"></canvas></div>
<div id="hint">← → swap lane &nbsp;•&nbsp; ↑ / SPACE jump &nbsp;•&nbsp; swipe on touch</div>
<script>
(function () {
  "use strict";
  var cv = document.getElementById('game');
  var g = cv.getContext('2d');
  var W = cv.width, H = cv.height;

  // ---- palette (Super Dude Adventures) -------------------------------
  var C = {
    sky0: '#1a1640', sky1: '#4a3a78',
    road: '#15131f', roadEdge: '#2a2540', lane: '#3b3563',
    gold: '#ffd23a', goldDk: '#a8631a',
    red: '#ff5d4a', redDk: '#7a1f16',
    cyan: '#46f0ff', white: '#f4f4ff',
    coat: '#eef1ff', hair: '#7a4a2a', skin: '#f1c19a', pants: '#26324f'
  };

  // ---- pseudo-3D projection ------------------------------------------
  // z = distance into the screen (0 = at player's feet, big = horizon).
  // Returns {x, y, s} screen position + scale for a lane (-1,0,1) at depth z.
  var HORIZON = H * 0.40;
  var NEAR_Y  = H * 0.86;
  var CAM     = 320;          // camera depth constant (tunes the fov)
  var SPREAD  = W * 0.46;     // full lane spread at the near plane
  function project(lane, z) {
    var p = CAM / (CAM + z);            // 1 near -> 0 far
    return {
      x: W / 2 + lane * SPREAD * p,
      y: HORIZON + (NEAR_Y - HORIZON) * p,
      s: p
    };
  }

  // ---- game state -----------------------------------------------------
  var S;
  function reset() {
    S = {
      state: 'play',                 // play | dead
      t: 0,
      dist: 0,
      cores: 0,
      speed: 7.0,                    // world units per frame
      lane: 0,                       // current logical lane
      laneF: 0,                      // smoothed visual lane
      jump: 0,                       // jump height (px)
      jumpV: 0,
      onGround: true,
      shield: 0,                     // frames of shield remaining
      objs: [],                      // {kind, lane, z, got}
      spawnZ: 0,                     // accumulator for spacing
      stars: [],
      runT: 0,
      shake: 0,
      best: S ? S.best : 0
    };
    for (var i = 0; i < 70; i++)
      S.stars.push({ x: Math.random() * W, y: Math.random() * HORIZON, s: Math.random() < 0.3 ? 2 : 1 });
  }

  var FAR = 2600;                    // spawn distance
  function spawn() {
    // choose a row of obstacles/cores at the far plane
    var r = Math.random();
    var lane = (Math.floor(Math.random() * 3) - 1);
    if (r < 0.34) {
      // obstacle barrier
      S.objs.push({ kind: 'obst', lane: lane, z: FAR, jumpable: Math.random() < 0.5 });
    } else if (r < 0.42) {
      // power core string (3 cores in a lane)
      for (var k = 0; k < 3; k++)
        S.objs.push({ kind: 'core', lane: lane, z: FAR + k * 90 });
    } else if (r < 0.46) {
      // shield power-up (rare) — the "B-button becomes a power" idea, runner-style
      S.objs.push({ kind: 'pow', lane: lane, z: FAR });
    } else {
      // single core
      S.objs.push({ kind: 'core', lane: lane, z: FAR });
    }
  }

  // ---- input ----------------------------------------------------------
  function moveLane(d) {
    if (S.state !== 'play') return;
    S.lane = Math.max(-1, Math.min(1, S.lane + d));
  }
  function doJump() {
    if (S.state !== 'play') return;
    if (S.onGround) { S.jumpV = 15.5; S.onGround = false; }
  }
  window.addEventListener('keydown', function (e) {
    if (S.state === 'dead' && (e.key === ' ' || e.key === 'Enter')) { reset(); return; }
    if (e.key === 'ArrowLeft' || e.key === 'a') moveLane(-1);
    else if (e.key === 'ArrowRight' || e.key === 'd') moveLane(1);
    else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') { e.preventDefault(); doJump(); }
  });
  // touch swipe
  var tsx = 0, tsy = 0, tracking = false;
  cv.addEventListener('pointerdown', function (e) { tsx = e.clientX; tsy = e.clientY; tracking = true; });
  cv.addEventListener('pointerup', function (e) {
    if (!tracking) return; tracking = false;
    if (S.state === 'dead') { reset(); return; }
    var dx = e.clientX - tsx, dy = e.clientY - tsy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) { doJump(); return; }   // tap = jump
    if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
    else if (dy < 0) doJump();
  });

  // ---- update ---------------------------------------------------------
  function update() {
    if (S.state !== 'play') return;
    S.t++; S.runT += S.speed * 0.04;
    S.speed = Math.min(20, 7.0 + S.dist * 0.00018);   // ramp
    S.dist += S.speed;
    if (S.shield > 0) S.shield--;
    if (S.shake > 0) S.shake--;

    // smooth lane + jump
    S.laneF += (S.lane - S.laneF) * 0.30;
    if (!S.onGround) {
      S.jump += S.jumpV; S.jumpV -= 1.15;
      if (S.jump <= 0) { S.jump = 0; S.onGround = true; S.jumpV = 0; }
    }

    // spawn pacing
    S.spawnZ -= S.speed;
    if (S.spawnZ <= 0) { spawn(); S.spawnZ = 360 + Math.random() * 240; }

    // advance objects toward player
    for (var i = 0; i < S.objs.length; i++) {
      var o = S.objs[i];
      o.z -= S.speed;
      if (o.got) continue;
      // collision window near z=0
      if (o.z < 40 && o.z > -40 && Math.round(S.laneF) === o.lane) {
        if (o.kind === 'core') {
          o.got = true; S.cores++;
        } else if (o.kind === 'pow') {
          o.got = true; S.shield = 60 * 7;   // 7s shield
        } else if (o.kind === 'obst') {
          var cleared = o.jumpable && S.jump > 42;
          if (!cleared) {
            if (S.shield > 0) { o.got = true; S.shield = 0; S.shake = 16; }
            else { S.state = 'dead'; S.shake = 24; S.best = Math.max(S.best, score()); }
          }
        }
      }
    }
    // cull passed objects
    var w = 0;
    for (var j = 0; j < S.objs.length; j++) if (S.objs[j].z > -120) S.objs[w++] = S.objs[j];
    S.objs.length = w;
  }

  function score() { return Math.floor(S.dist / 10) + S.cores * 15; }

  // ---- render ---------------------------------------------------------
  function drawSky() {
    var grd = g.createLinearGradient(0, 0, 0, HORIZON);
    grd.addColorStop(0, C.sky0); grd.addColorStop(1, C.sky1);
    g.fillStyle = grd; g.fillRect(0, 0, W, HORIZON);
    for (var i = 0; i < S.stars.length; i++) {
      var st = S.stars[i];
      g.fillStyle = i % 7 === 0 ? C.gold : 'rgba(255,255,255,0.8)';
      g.fillRect(st.x | 0, st.y | 0, st.s, st.s);
    }
    // distant glow / sun
    var sg = g.createRadialGradient(W * 0.72, HORIZON * 0.5, 4, W * 0.72, HORIZON * 0.5, 90);
    sg.addColorStop(0, 'rgba(255,210,58,0.55)'); sg.addColorStop(1, 'rgba(255,210,58,0)');
    g.fillStyle = sg; g.fillRect(0, 0, W, HORIZON);
  }

  function drawRoad() {
    // road body — a trapezoid from horizon to near
    var L0 = project(-1.5, 0), R0 = project(1.5, 0);
    var Lh = project(-1.5, 4000), Rh = project(1.5, 4000);
    g.fillStyle = C.road;
    g.beginPath();
    g.moveTo(Lh.x, Lh.y); g.lineTo(Rh.x, Rh.y);
    g.lineTo(R0.x, R0.y); g.lineTo(L0.x, L0.y); g.closePath(); g.fill();

    // edges
    g.strokeStyle = C.roadEdge; g.lineWidth = 3;
    g.beginPath(); g.moveTo(Lh.x, Lh.y); g.lineTo(L0.x, L0.y);
    g.moveTo(Rh.x, Rh.y); g.lineTo(R0.x, R0.y); g.stroke();

    // lane dividers between lanes (-0.5, 0.5)
    [-0.5, 0.5].forEach(function (ln) {
      var a = project(ln, 4000), b = project(ln, 0);
      g.strokeStyle = 'rgba(70,240,255,0.20)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    });

    // moving stripes for speed sensation
    var phase = (S.dist * 0.5) % 200;
    for (var z = 0; z < 4000; z += 200) {
      var zz = z - phase;
      if (zz < 0) continue;
      var p1 = project(0, zz), p2 = project(0, zz + 60);
      var wTop = (project(1.5, zz + 60).x - project(-1.5, zz + 60).x);
      var wBot = (project(1.5, zz).x - project(-1.5, zz).x);
      g.fillStyle = 'rgba(255,255,255,0.05)';
      g.beginPath();
      g.moveTo(p2.x - wTop / 2, p2.y); g.lineTo(p2.x + wTop / 2, p2.y);
      g.lineTo(p1.x + wBot / 2, p1.y); g.lineTo(p1.x - wBot / 2, p1.y);
      g.closePath(); g.fill();
    }
  }

  function drawCore(o) {
    var pr = project(o.lane, Math.max(0, o.z));
    var s = pr.s, r = 16 * s;
    var bob = Math.sin((S.t + o.z) * 0.12) * 4 * s;
    var cx = pr.x, cy = pr.y - 28 * s + bob;
    g.save();
    g.translate(cx, cy);
    // glow
    var gg = g.createRadialGradient(0, 0, 1, 0, 0, r * 1.8);
    gg.addColorStop(0, 'rgba(70,240,255,0.5)'); gg.addColorStop(1, 'rgba(70,240,255,0)');
    g.fillStyle = gg; g.fillRect(-r * 2, -r * 2, r * 4, r * 4);
    // diamond
    g.fillStyle = C.cyan;
    g.beginPath(); g.moveTo(0, -r); g.lineTo(r * 0.7, 0); g.lineTo(0, r); g.lineTo(-r * 0.7, 0); g.closePath(); g.fill();
    g.fillStyle = '#bff7ff';
    g.beginPath(); g.moveTo(0, -r); g.lineTo(r * 0.35, -r * 0.2); g.lineTo(0, 0); g.lineTo(-r * 0.35, -r * 0.2); g.closePath(); g.fill();
    g.restore();
  }

  function drawPow(o) {
    var pr = project(o.lane, Math.max(0, o.z));
    var s = pr.s, r = 20 * s;
    var cx = pr.x, cy = pr.y - 30 * s + Math.sin(S.t * 0.2) * 4 * s;
    var pulse = 0.6 + 0.4 * Math.sin(S.t * 0.3);
    g.save(); g.translate(cx, cy);
    var gg = g.createRadialGradient(0, 0, 1, 0, 0, r * 2);
    gg.addColorStop(0, 'rgba(255,210,58,' + (0.6 * pulse) + ')'); gg.addColorStop(1, 'rgba(255,210,58,0)');
    g.fillStyle = gg; g.fillRect(-r * 2.2, -r * 2.2, r * 4.4, r * 4.4);
    // star
    g.fillStyle = C.gold; g.strokeStyle = C.goldDk; g.lineWidth = 2 * s;
    g.beginPath();
    for (var i = 0; i < 10; i++) {
      var ang = -Math.PI / 2 + i * Math.PI / 5;
      var rad = (i % 2 === 0) ? r : r * 0.45;
      var fx = Math.cos(ang) * rad, fy = Math.sin(ang) * rad;
      if (i === 0) g.moveTo(fx, fy); else g.lineTo(fx, fy);
    }
    g.closePath(); g.fill(); g.stroke();
    g.restore();
  }

  function drawObst(o) {
    var pr = project(o.lane, Math.max(0, o.z));
    var s = pr.s;
    var w = 64 * s, h = 50 * s;
    var x = pr.x - w / 2, y = pr.y - h;
    if (o.jumpable) {
      // low hurdle — clearly jumpable
      g.fillStyle = C.redDk; g.fillRect(x, pr.y - 22 * s, w, 22 * s);
      g.fillStyle = C.red; g.fillRect(x, pr.y - 22 * s, w, 8 * s);
      // hazard stripes
      g.fillStyle = C.gold;
      for (var i = 0; i < 5; i++) g.fillRect(x + i * (w / 5), pr.y - 18 * s, (w / 5) * 0.5, 6 * s);
      // up-arrow hint
      g.fillStyle = 'rgba(255,255,255,0.85)';
      g.beginPath();
      g.moveTo(pr.x, pr.y - 40 * s); g.lineTo(pr.x + 8 * s, pr.y - 30 * s);
      g.lineTo(pr.x - 8 * s, pr.y - 30 * s); g.closePath(); g.fill();
    } else {
      // tall barrier — must change lane
      g.fillStyle = C.redDk; g.fillRect(x, y, w, h);
      g.fillStyle = C.red; g.fillRect(x, y, w, 10 * s);
      g.strokeStyle = C.gold; g.lineWidth = 3 * s; g.strokeRect(x, y, w, h);
      g.fillStyle = C.gold;
      for (var j = 0; j < 4; j++) g.fillRect(x + 6 * s, y + (12 + j * 11) * s, w - 12 * s, 4 * s);
    }
  }

  function drawDanny() {
    var pr = project(S.laneF, 0);
    var s = pr.s * 1.0;
    var cx = pr.x, baseY = pr.y - S.jump;
    var run = Math.sin(S.runT) ;
    var legA = run * 8 * s, legB = -run * 8 * s;
    g.save();
    // shadow
    g.fillStyle = 'rgba(0,0,0,0.35)';
    var shW = 40 * s * (1 - S.jump / 260);
    g.beginPath(); g.ellipse(cx, pr.y + 2, shW, 8 * s, 0, 0, 7); g.fill();

    // shield aura
    if (S.shield > 0) {
      var sp = 0.5 + 0.5 * Math.sin(S.t * 0.3);
      g.strokeStyle = 'rgba(70,240,255,' + (0.5 + 0.4 * sp) + ')'; g.lineWidth = 3 * s;
      g.beginPath(); g.ellipse(cx, baseY - 28 * s, 34 * s, 44 * s, 0, 0, 7); g.stroke();
    }

    var U = function (n) { return n * s; };
    // legs
    g.fillStyle = C.pants;
    g.fillRect(cx - U(12), baseY - U(20) + legA * 0.0, U(8), U(20) + (S.onGround ? legA : 0));
    g.fillRect(cx + U(4),  baseY - U(20),            U(8), U(20) + (S.onGround ? legB : 0));
    // shoes
    g.fillStyle = C.white;
    g.fillRect(cx - U(13), baseY - U(2) + (S.onGround ? legA : 0), U(11), U(5));
    g.fillRect(cx + U(3),  baseY - U(2) + (S.onGround ? legB : 0), U(11), U(5));
    // lab coat body
    g.fillStyle = C.coat;
    g.fillRect(cx - U(15), baseY - U(54), U(30), U(36));
    g.fillStyle = '#d6dcf5';
    g.fillRect(cx - U(2), baseY - U(54), U(4), U(36));   // coat seam
    // arms (swing)
    g.fillStyle = C.coat;
    g.fillRect(cx - U(19), baseY - U(52) + (S.onGround ? -legA : -10 * s), U(6), U(22));
    g.fillRect(cx + U(13), baseY - U(52) + (S.onGround ? -legB : -10 * s), U(6), U(22));
    // head
    g.fillStyle = C.skin;
    g.fillRect(cx - U(10), baseY - U(74), U(20), U(20));
    // hair
    g.fillStyle = C.hair;
    g.fillRect(cx - U(11), baseY - U(78), U(22), U(8));
    g.fillRect(cx - U(11), baseY - U(74), U(4), U(8));
    g.fillRect(cx + U(7),  baseY - U(74), U(4), U(8));
    // glasses
    g.fillStyle = '#1a1a2a';
    g.fillRect(cx - U(8), baseY - U(66), U(6), U(5));
    g.fillRect(cx + U(2), baseY - U(66), U(6), U(5));
    g.fillRect(cx - U(2), baseY - U(64), U(4), U(2));
    g.restore();
  }

  function drawHUD() {
    // top bar
    g.fillStyle = 'rgba(10,10,26,0.55)'; g.fillRect(0, 0, W, 54);
    g.fillStyle = C.gold; g.font = 'bold 22px system-ui'; g.textBaseline = 'middle';
    g.textAlign = 'left';
    g.fillText('SCORE ' + score(), 14, 20);
    g.fillStyle = C.cyan; g.font = 'bold 18px system-ui';
    g.fillText('CORES ' + S.cores, 14, 42);
    g.textAlign = 'right';
    g.fillStyle = C.white; g.font = 'bold 16px system-ui';
    g.fillText('BEST ' + S.best, W - 14, 20);
    g.fillStyle = '#9aa0c4';
    g.fillText((S.dist / 10 | 0) + ' m', W - 14, 42);
    // shield indicator (the "active power" idea)
    if (S.shield > 0) {
      var bw = 120, bx = W / 2 - bw / 2, by = 64;
      g.fillStyle = 'rgba(70,240,255,0.2)'; g.fillRect(bx, by, bw, 8);
      g.fillStyle = C.cyan; g.fillRect(bx, by, bw * (S.shield / (60 * 7)), 8);
      g.fillStyle = C.cyan; g.font = 'bold 12px system-ui'; g.textAlign = 'center'; g.textBaseline = 'top';
      g.fillText('ENERGY SHIELD', W / 2, by + 12);
    }
  }

  function drawDead() {
    g.fillStyle = 'rgba(10,10,26,0.74)'; g.fillRect(0, 0, W, H);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = C.red; g.font = 'bold 44px system-ui';
    g.fillText('CAUGHT!', W / 2, H * 0.36);
    g.fillStyle = C.gold; g.font = 'bold 30px system-ui';
    g.fillText('SCORE ' + score(), W / 2, H * 0.46);
    g.fillStyle = C.cyan; g.font = 'bold 20px system-ui';
    g.fillText(S.cores + ' CORES • ' + (S.dist / 10 | 0) + ' m', W / 2, H * 0.52);
    g.fillStyle = C.white; g.font = 'bold 22px system-ui';
    var blink = (S.t % 60 < 40);
    if (blink) g.fillText('TAP / SPACE TO RUN AGAIN', W / 2, H * 0.64);
  }

  // ---- main loop ------------------------------------------------------
  function frame() {
    update();
    if (S.state === 'dead') S.t++;
    // camera shake
    var sx = 0, sy = 0;
    if (S.shake > 0) { sx = (Math.random() - 0.5) * S.shake; sy = (Math.random() - 0.5) * S.shake; }
    g.setTransform(1, 0, 0, 1, sx, sy);
    g.clearRect(-20, -20, W + 40, H + 40);
    drawSky();
    drawRoad();
    // draw objects far-to-near so near overlaps far
    var sorted = S.objs.slice().sort(function (a, b) { return b.z - a.z; });
    for (var i = 0; i < sorted.length; i++) {
      var o = sorted[i];
      if (o.got) continue;
      if (o.kind === 'core') drawCore(o);
      else if (o.kind === 'pow') drawPow(o);
      else drawObst(o);
    }
    drawDanny();
    g.setTransform(1, 0, 0, 1, 0, 0);
    drawHUD();
    if (S.state === 'dead') drawDead();
    requestAnimationFrame(frame);
  }

  reset();
  frame();
})();
</script>
</body>
</html>
