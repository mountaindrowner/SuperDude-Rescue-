<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#e8ecf3">
<title>Super Dude Runner — 3D Lab Escape</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #d0d5e0; overflow: hidden;
    font-family: system-ui, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#game { background: #e8ecf3; width: 100vw; height: 100vh; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none;
        font-family: system-ui, "Segoe UI", sans-serif; }
  #topbar { position: absolute; top: 8px; left: 8px; right: 8px;
            background: rgba(255,255,255,0.78); border-radius: 10px; padding: 8px 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .row + .row { margin-top: 4px; }
  .lbl { color: #2a3d5f; font-weight: 700; font-size: 16px; }
  .lbl.big { font-size: 20px; color: #2a3d5f; }
  .lbl.dim { color: #5a6378; font-weight: 600; font-size: 13px; }
  .lbl.cyan { color: #0a86a3; }
  .bar { height: 4px; background: rgba(232,165,22,0.25); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: #e8a516; transition: width .12s linear; }
  #powers { position: absolute; left: 14px; top: 88px; display: flex; gap: 8px; pointer-events: none; }
  .pwr { padding: 4px 10px; border-radius: 8px; color: #fff; font-weight: 700; font-size: 12px;
         box-shadow: 0 2px 6px rgba(0,0,0,0.18); display: none; }
  .pwr.on { display: inline-block; }
  .pwr.shield { background: #0fb8d0; }
  .pwr.magnet { background: #d33a3a; }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
             flex-direction: column; background: rgba(20,28,46,0.74); color: #fff; pointer-events: auto; cursor: pointer; }
  #overlay.on { display: flex; }
  #overlay h1 { margin: 0; font-size: 42px; letter-spacing: 1px; color: #ffd23a; }
  #overlay h2 { margin: 6px 0 12px; font-size: 28px; color: #e8a516; }
  #overlay p  { margin: 4px 0; }
  #overlay .blink { margin-top: 24px; font-size: 18px; opacity: .9; }
  #hint { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center;
          color: #4a5070; font-size: 12px; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="ui">
  <div id="topbar">
    <div class="row">
      <span class="lbl big">GEARS <span id="ui-gears">0</span> / <span id="ui-goal">50</span></span>
      <span class="lbl">BEST <span id="ui-best">0</span></span>
    </div>
    <div class="row">
      <span class="lbl cyan">SCORE <span id="ui-score">0</span></span>
      <span class="lbl dim"><span id="ui-dist">0</span> m</span>
    </div>
    <div class="bar"><div id="ui-prog" style="width:0%"></div></div>
  </div>
  <div id="powers">
    <span class="pwr shield" id="pwr-shield">SHIELD</span>
    <span class="pwr magnet" id="pwr-magnet">MAGNET</span>
  </div>
  <div id="overlay">
    <h1 id="ov-h1">CAUGHT!</h1>
    <h2 id="ov-h2"></h2>
    <p id="ov-p1"></p>
    <p id="ov-p2"></p>
    <div class="blink" id="ov-cta">TAP TO RUN AGAIN</div>
  </div>
</div>
<div id="hint">← → swap lane &nbsp;•&nbsp; ↑ / SPACE jump &nbsp;•&nbsp; swipe on touch</div>

<script type="module">
import * as THREE from 'three';

// ------------ renderer + scene -------------------------------------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef2f7);
scene.fog = new THREE.Fog(0xeef2f7, 22, 95);

const camera = new THREE.PerspectiveCamera(64, 1, 0.1, 200);
camera.position.set(0, 3.4, 8.6);
camera.lookAt(0, 1.6, -8);
window.addEventListener('resize', resize); resize();

// ------------ lighting --------------------------------------------
scene.add(new THREE.AmbientLight(0xffffff, 0.72));
const sun = new THREE.DirectionalLight(0xffffff, 0.55);
sun.position.set(2, 9, 3);
scene.add(sun);
// row of ceiling pointlights
const ceilLights = [];
for (let i = 0; i < 6; i++) {
  const pl = new THREE.PointLight(0xfff2b8, 0.7, 18, 2);
  pl.position.set(0, 4.5, -i * 18);
  scene.add(pl); ceilLights.push(pl);
}

// ------------ procedural textures ---------------------------------
function makeWallTexture() {
  const W = 2048, H = 512;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  // base panel gradient
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#c6cfdf');
  bg.addColorStop(0.30, '#ffffff');
  bg.addColorStop(0.85, '#f4f6fa');
  bg.addColorStop(1, '#dde3ee');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  // wall ceiling trim (dark stripe)
  g.fillStyle = '#2a3d5f'; g.fillRect(0, 0, W, 12);
  g.fillStyle = '#1b9fb3'; g.fillRect(0, 12, W, 3);
  // baseboard
  g.fillStyle = '#1a2540'; g.fillRect(0, H - 16, W, 16);
  g.fillStyle = '#3a4d75'; g.fillRect(0, H - 18, W, 2);
  // floor caution stripes (yellow/black)
  for (let x = 0; x < W; x += 18) {
    g.fillStyle = (x / 18) % 2 < 1 ? '#ffd23a' : '#1a2540';
    g.fillRect(x, H - 7, 18, 4);
  }

  // panel seams
  for (let x = 0; x < W; x += 256) {
    g.fillStyle = '#b9c4d4'; g.fillRect(x, 16, 2, H - 32);
  }
  // horizontal panel seams
  g.fillStyle = '#b9c4d4'; g.fillRect(0, 120, W, 1);
  g.fillStyle = '#dde3ee'; g.fillRect(0, 121, W, 1);
  g.fillStyle = '#b9c4d4'; g.fillRect(0, 360, W, 1);

  // helpers to draw features in panel slots (each panel = 256 wide)
  function door(px, tint) {
    const x = px + 28, y = 36, w = 200, h = 380;
    // frame
    g.fillStyle = '#1a2540'; g.fillRect(x - 4, y - 4, w + 8, h + 8);
    g.fillStyle = '#3a4d75'; g.fillRect(x, y, w, h);
    // door face
    g.fillStyle = '#eef2f8'; g.fillRect(x + 8, y + 8, w - 16, h - 16);
    // upper window with tinted glow
    g.fillStyle = tint;
    g.fillRect(x + 22, y + 28, w - 44, 70);
    // glass shine
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.fillRect(x + 30, y + 32, w - 60, 16);
    // glow stripe under window (lit room beyond)
    const gd = g.createLinearGradient(0, y + 98, 0, y + 170);
    gd.addColorStop(0, tint + 'cc'); gd.addColorStop(1, '#00000000');
    g.fillStyle = gd; g.fillRect(x + 22, y + 98, w - 44, 72);
    // door label plate
    g.fillStyle = '#1a2540'; g.fillRect(x + 30, y + 188, w - 60, 22);
    g.fillStyle = '#ffd23a'; g.font = 'bold 14px system-ui'; g.textAlign = 'center';
    g.fillText('LAB ' + Math.floor(Math.random()*9 + 1), x + w / 2, y + 204);
    // handle
    g.fillStyle = '#aab4c4'; g.fillRect(x + w - 26, y + 260, 12, 5);
    // hinges
    g.fillStyle = '#aab4c4';
    g.fillRect(x + 6, y + 40, 6, 8);
    g.fillRect(x + 6, y + h - 50, 6, 8);
  }
  function monitor(px) {
    const x = px + 30, y = 60, w = 196, h = 130;
    g.fillStyle = '#dde3ee'; g.fillRect(x - 4, y - 4, w + 8, h + 12);
    g.fillStyle = '#0a1a2a'; g.fillRect(x, y, w, h);
    // waveform
    g.fillStyle = '#1ab3ff';
    for (let bi = 0; bi < 14; bi++) {
      const bh = h * (0.22 + 0.7 * Math.abs(Math.sin(bi * 1.7 + px * 0.01)));
      const bxx = x + 6 + bi * ((w - 12) / 14);
      g.fillRect(bxx, y + h - bh - 8, (w - 12) / 14 - 2, bh);
    }
    g.fillStyle = '#46f0ff'; g.fillRect(x + 6, y + h - 6, w - 12, 3);
    // bezel labels
    g.fillStyle = '#5a6378'; g.font = 'bold 9px system-ui'; g.textAlign = 'left';
    g.fillText('PWR', x + 6, y + h + 14);
    g.fillText('REC', x + 50, y + h + 14);
    g.fillStyle = '#d33a3a'; g.fillRect(x + 90, y + h + 5, 8, 8);
    g.fillStyle = '#10b981'; g.fillRect(x + 110, y + h + 5, 8, 8);
    // pipes below
    const py = y + h + 26;
    ['#d33a3a','#1ab3ff','#10b981','#e8a516'].forEach((col, i) => {
      g.fillStyle = '#3a4d75'; g.fillRect(x, py + i*18, w, 12);
      g.fillStyle = col; g.fillRect(x + 4, py + i*18 + 2, w - 8, 4);
    });
  }
  function tubes(px) {
    const x = px + 24, y = 50, w = 208, h = 380;
    // shelf back
    g.fillStyle = '#dde3ee'; g.fillRect(x, y, w, h);
    g.fillStyle = '#b9c4d4'; g.fillRect(x, y, w, 6);
    g.fillStyle = '#b9c4d4'; g.fillRect(x, y + h - 6, w, 6);
    // three shelves of test tubes / beakers
    for (let row = 0; row < 3; row++) {
      const sy = y + 30 + row * 110;
      // shelf
      g.fillStyle = '#3a4d75'; g.fillRect(x + 6, sy + 78, w - 12, 4);
      // tubes
      const colors = ['#39c5ff','#10b981','#d33a3a','#ffd23a','#a866ff','#79e336'];
      for (let ti = 0; ti < 5; ti++) {
        const tx = x + 18 + ti * 38;
        const col = colors[(row * 5 + ti) % colors.length];
        // tube body (glass)
        g.fillStyle = '#cfe6ef';
        g.fillRect(tx, sy + 10, 16, 72);
        // liquid fill
        g.fillStyle = col;
        g.fillRect(tx + 1, sy + 30 + (ti%3)*6, 14, 48 - (ti%3)*6);
        // tube highlight
        g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(tx + 2, sy + 12, 3, 65);
        // cork
        g.fillStyle = '#5a3320'; g.fillRect(tx, sy + 6, 16, 6);
        // bubbles in liquid
        g.fillStyle = 'rgba(255,255,255,0.7)';
        g.beginPath(); g.arc(tx + 8, sy + 60, 2, 0, 7); g.fill();
        g.beginPath(); g.arc(tx + 10, sy + 45, 1.5, 0, 7); g.fill();
      }
    }
  }
  function pipes(px) {
    const x = px, y = 30, w = 256, h = 420;
    // backing
    g.fillStyle = '#e2e7ef'; g.fillRect(x, y, w, h);
    // 4 vertical pipes with valves
    const cols = ['#d33a3a','#1ab3ff','#10b981','#e8a516'];
    for (let pi = 0; pi < 4; pi++) {
      const px2 = x + 28 + pi * 56;
      // pipe body
      g.fillStyle = '#3a4d75'; g.fillRect(px2, y, 18, h);
      // colored stripe
      g.fillStyle = cols[pi]; g.fillRect(px2 + 5, y, 8, h);
      // joints
      g.fillStyle = '#1a2540';
      g.fillRect(px2 - 4, y + 60, 26, 8);
      g.fillRect(px2 - 4, y + 220, 26, 8);
      g.fillRect(px2 - 4, y + 360, 26, 8);
      // valve wheel
      g.fillStyle = '#aab4c4';
      g.beginPath(); g.arc(px2 + 9, y + 140, 14, 0, 7); g.fill();
      g.fillStyle = '#5a6378';
      g.beginPath(); g.arc(px2 + 9, y + 140, 4, 0, 7); g.fill();
      for (let sp = 0; sp < 6; sp++) {
        const a = sp * Math.PI / 3;
        g.fillStyle = '#5a6378';
        g.fillRect(px2 + 9 + Math.cos(a)*9 - 1, y + 140 + Math.sin(a)*9 - 1, 2, 4);
      }
    }
    // sign
    g.fillStyle = '#d33a3a'; g.fillRect(x + 80, y + 380, 96, 22);
    g.fillStyle = '#fff'; g.font = 'bold 12px system-ui'; g.textAlign = 'center';
    g.fillText('PRESSURE', x + 128, y + 396);
  }
  function vent(px) {
    const x = px + 30, y = 80, w = 196, h = 220;
    g.fillStyle = '#1a2540'; g.fillRect(x, y, w, h);
    g.strokeStyle = '#aab4c4'; g.lineWidth = 2;
    for (let vi = 0; vi < 11; vi++) {
      const vy = y + 8 + vi * ((h - 16) / 11);
      g.beginPath(); g.moveTo(x + 8, vy); g.lineTo(x + w - 8, vy); g.stroke();
    }
    g.fillStyle = '#aab4c4';
    g.fillRect(x - 4, y - 4, w + 8, 4);
    g.fillRect(x - 4, y + h, w + 8, 4);
    g.fillRect(x - 4, y - 4, 4, h + 8);
    g.fillRect(x + w, y - 4, 4, h + 8);
    // label below
    g.fillStyle = '#3a4d75'; g.fillRect(x, y + h + 18, w, 24);
    g.fillStyle = '#ffd23a'; g.font = 'bold 13px system-ui'; g.textAlign = 'center';
    g.fillText('AIR FLOW ⟶', x + w / 2, y + h + 34);
  }
  function locker(px) {
    const x = px + 24, y = 40, w = 208, h = 400;
    // tall cabinet, 3 doors
    g.fillStyle = '#3a4d75'; g.fillRect(x, y, w, h);
    for (let li = 0; li < 3; li++) {
      const lx = x + 6 + li * ((w - 12) / 3);
      const lw = (w - 12) / 3 - 4;
      g.fillStyle = '#f4f6fa'; g.fillRect(lx, y + 6, lw, h - 12);
      g.strokeStyle = '#aab4c4'; g.lineWidth = 1; g.strokeRect(lx, y + 6, lw, h - 12);
      g.fillStyle = '#1a2540'; g.fillRect(lx + lw - 12, y + h/2, 6, 6);
      // label band
      g.fillStyle = ['#1b9fb3','#10b981','#d33a3a'][li];
      g.fillRect(lx + 6, y + 16, lw - 12, 16);
      g.fillStyle = '#fff'; g.font = 'bold 11px system-ui'; g.textAlign = 'center';
      g.fillText(['BIO','CHEM','RAD'][li], lx + lw/2, y + 28);
    }
  }
  function bigsign(px, color, label) {
    const x = px + 12, y = 28, w = 232, h = 60;
    g.fillStyle = '#1a2540'; g.fillRect(x, y, w, h);
    g.fillStyle = color; g.fillRect(x + 4, y + 4, w - 8, h - 8);
    g.fillStyle = '#fff'; g.font = 'bold 28px system-ui'; g.textAlign = 'center';
    g.fillText(label, x + w / 2, y + h - 18);
    // led dots
    g.fillStyle = '#ffd23a';
    g.fillRect(x + 8, y + 8, 4, 4); g.fillRect(x + w - 12, y + 8, 4, 4);
    g.fillRect(x + 8, y + h - 12, 4, 4); g.fillRect(x + w - 12, y + h - 12, 4, 4);
  }

  // place a varied sequence of features
  const features = [
    p => door(p, '#3b82f6'),
    p => monitor(p),
    p => door(p, '#10b981'),
    p => tubes(p),
    p => pipes(p),
    p => door(p, '#06b6d4'),
    p => vent(p),
    p => locker(p),
  ];
  for (let i = 0, x = 0; x < W; i++, x += 256) {
    features[i % features.length](x);
  }
  // overlay big signs in random spots
  bigsign(20, '#1b9fb3', 'BIO LAB');
  bigsign(540, '#d33a3a', 'CAUTION');
  bigsign(1080, '#10b981', 'CHEM');
  bigsign(1600, '#f59e0b', 'SECTOR 7');

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.repeat.set(4, 1);
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipMapLinearFilter;
  tex.anisotropy = 4;
  return tex;
}

function makeFloorTexture() {
  const W = 1024, H = 1024;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  // base
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#e2e7ef'); bg.addColorStop(1, '#f4f6fa');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // tile grid
  g.strokeStyle = '#b9c4d4'; g.lineWidth = 2;
  for (let x = 0; x <= W; x += 256) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y <= H; y += 256) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  // inset squares
  g.strokeStyle = '#d6dcec'; g.lineWidth = 1;
  for (let x = 16; x <= W - 16; x += 256)
    for (let y = 16; y <= H - 16; y += 256) g.strokeRect(x, y, 224, 224);
  // cyan glowing lane edge marks (along center of texture, at lane line positions)
  // (the road area is 3 lanes wide; we'll add a center stripe and a checker)
  g.fillStyle = '#0fb8d0';
  for (let y = 0; y < H; y += 40) {
    g.globalAlpha = 0.5;
    g.fillRect(W/2 - 1, y, 2, 22);
    g.globalAlpha = 1;
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 24);
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipMapLinearFilter;
  tex.anisotropy = 4;
  return tex;
}

function makeCeilTexture() {
  const W = 512, H = 1024;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f6fa'; g.fillRect(0, 0, W, H);
  // pipes running along length
  ['#d33a3a','#1ab3ff','#10b981'].forEach((col, i) => {
    g.fillStyle = '#3a4d75';
    g.fillRect(60 + i * 60, 0, 18, H);
    g.fillStyle = col; g.fillRect(64 + i * 60, 0, 10, H);
  });
  // joint rings every interval
  for (let y = 0; y < H; y += 128) {
    g.fillStyle = '#1a2540';
    g.fillRect(60, y, 198, 8);
  }
  // light fixtures
  for (let y = 64; y < H; y += 256) {
    g.fillStyle = '#dde3ee'; g.fillRect(W/2 - 80, y - 18, 160, 36);
    g.fillStyle = '#fff8d8'; g.fillRect(W/2 - 70, y - 12, 140, 24);
    g.fillStyle = '#fff'; g.fillRect(W/2 - 60, y - 8, 120, 6);
  }
  // ventilation grates
  for (let y = 192; y < H; y += 256) {
    g.fillStyle = '#1a2540'; g.fillRect(W - 110, y - 30, 80, 60);
    g.strokeStyle = '#aab4c4'; g.lineWidth = 1.5;
    for (let li = 0; li < 6; li++) {
      g.beginPath();
      g.moveTo(W - 104, y - 24 + li * 10);
      g.lineTo(W - 36, y - 24 + li * 10);
      g.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 18);
  return tex;
}

// ------------ corridor geometry -----------------------------------
const LANE_X = 1.8;          // each lane is 1.8 units off center
const CORR_HALF_W = 3.6;
const CORR_H = 5;
const CORR_LEN = 220;
const CORR_CENTER_Z = -CORR_LEN / 2 + 6;

const wallTex = makeWallTexture();
const floorTex = makeFloorTexture();
const ceilTex = makeCeilTexture();

// floor
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(CORR_HALF_W * 2, CORR_LEN),
  new THREE.MeshLambertMaterial({ map: floorTex })
);
floor.rotation.x = -Math.PI / 2;
floor.position.set(0, 0, CORR_CENTER_Z);
scene.add(floor);
// ceiling
const ceil = new THREE.Mesh(
  new THREE.PlaneGeometry(CORR_HALF_W * 2, CORR_LEN),
  new THREE.MeshLambertMaterial({ map: ceilTex })
);
ceil.rotation.x = Math.PI / 2;
ceil.position.set(0, CORR_H, CORR_CENTER_Z);
scene.add(ceil);
// walls
const wallGeo = new THREE.PlaneGeometry(CORR_LEN, CORR_H);
const wallMatL = new THREE.MeshLambertMaterial({ map: wallTex });
const wallMatR = new THREE.MeshLambertMaterial({ map: wallTex.clone() });
wallMatR.map.needsUpdate = true;
const wallL = new THREE.Mesh(wallGeo, wallMatL);
wallL.rotation.y = Math.PI / 2;
wallL.position.set(-CORR_HALF_W, CORR_H/2, CORR_CENTER_Z);
scene.add(wallL);
const wallR = new THREE.Mesh(wallGeo, wallMatR);
wallR.rotation.y = -Math.PI / 2;
wallR.position.set(CORR_HALF_W, CORR_H/2, CORR_CENTER_Z);
scene.add(wallR);

// glowing test-tube cylinders sticking out from the wall periodically
const tubeMat = new THREE.MeshBasicMaterial({ color: 0x39c5ff, transparent: true, opacity: 0.85 });
const tubeMats = [0x39c5ff,0x10b981,0xd33a3a,0xffd23a,0xa866ff,0x79e336]
                 .map(c => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0.85 }));
const wallTubes = [];
for (let i = 0; i < 14; i++) {
  const side = (i % 2 === 0 ? -1 : 1);
  const z = -8 - (i * 12) - Math.random() * 4;
  for (let t = 0; t < 3; t++) {
    const m = new THREE.Mesh(
      new THREE.CylinderGeometry(0.10, 0.10, 0.7, 12),
      tubeMats[(i*3+t) % tubeMats.length]
    );
    m.position.set(side * (CORR_HALF_W - 0.18), 1.2 + t * 0.4, z + (t - 1) * 0.3);
    scene.add(m); wallTubes.push(m);
    // tube cap
    const cap = new THREE.Mesh(

};

function spawnObj(kind, lane, z, jumpable) {
  const m = FACTORIES[kind]();
  m.position.set(lanePosX(lane), 0, z);
  if (kind === 'gear' || kind === 'shield' || kind === 'magnet') m.position.y = 1.1;
  if (kind === 'alien') m.position.y = 0.6;
  if (kind === 'drone') m.position.y = 1.8;
  pickGroup.add(m);
  objects.push({ kind, lane, z, mesh: m, jumpable: !!jumpable, got: false, phase: Math.random()*Math.PI*2 });
}

const HAZARD_KINDS = ['alien','tox','fire','elec','crystal','drone','energy'];
const FAR_Z = -110;
function trySpawn() {
  const r = Math.random();
  const lane = Math.floor(Math.random()*3) - 1;
  if      (r < 0.06) spawnObj('shield', lane, FAR_Z);
  else if (r < 0.10) spawnObj('magnet', lane, FAR_Z);
  else if (r < 0.46) {
    const pick = HAZARD_KINDS[Math.floor(Math.random()*HAZARD_KINDS.length)];
    spawnObj(pick, lane, FAR_Z, pick==='tox' || pick==='energy');
    if (Math.random() < 0.22) {
      const opts = [-1,0,1].filter(L => L !== lane);
      const lane2 = opts[Math.floor(Math.random()*opts.length)];
      const pick2 = HAZARD_KINDS[Math.floor(Math.random()*HAZARD_KINDS.length)];
      spawnObj(pick2, lane2, FAR_Z - 1.2, pick2==='tox' || pick2==='energy');
    }
  } else if (r < 0.62) {
    const n = 3 + Math.floor(Math.random()*3);
    for (let k = 0; k < n; k++) spawnObj('gear', lane, FAR_Z - k * 2.0);
  } else {
    spawnObj('gear', lane, FAR_Z);
  }
}

// ------------ game state ------------------------------------------
const GEAR_GOAL = 50;
let state = 'play';
let dist = 0, speed = 16.0, gears = 0, goalDone = false;
let best = parseInt(localStorage.getItem('sdr_best') || '0', 10) || 0;
let bestG = parseInt(localStorage.getItem('sdr_bestG') || '0', 10) || 0;
let lane = 0, laneF = 0;
let jumpV = 0, jumpY = 0, onGround = true;
let shield = 0, magnet = 0;
let spawnAcc = 0;
let runT = 0;
let shake = 0;

// ------------ input -----------------------------------------------
function moveLane(d) { if (state==='play') lane = Math.max(-1, Math.min(1, lane + d)); }
function doJump() { if (state==='play' && onGround) { jumpV = 7.0; onGround = false; } }
window.addEventListener('keydown', e => {
  if (state !== 'play' && (e.key === ' ' || e.key === 'Enter')) { reset(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'a') moveLane(-1);
  else if (e.key === 'ArrowRight' || e.key === 'd') moveLane(1);
  else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') { e.preventDefault(); doJump(); }
});
let tsx = 0, tsy = 0, tracking = false;
canvas.addEventListener('pointerdown', e => { tsx = e.clientX; tsy = e.clientY; tracking = true; });
canvas.addEventListener('pointerup', e => {
  if (!tracking) return; tracking = false;
  if (state !== 'play') { reset(); return; }
  const dx = e.clientX - tsx, dy = e.clientY - tsy;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) { doJump(); return; }
  if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
  else if (dy < 0) doJump();
});
document.getElementById('overlay').addEventListener('click', () => { if (state !== 'play') reset(); });

// ------------ reset / win / lose ----------------------------------
function reset() {
  // clear pickup pool
  for (const o of objects) pickGroup.remove(o.mesh);
  objects.length = 0;
  state = 'play'; dist = 0; speed = 16.0; gears = 0; goalDone = false;
  lane = 0; laneF = 0; jumpV = 0; jumpY = 0; onGround = true;
  shield = 0; magnet = 0; spawnAcc = 0; runT = 0; shake = 0;
  document.getElementById('overlay').classList.remove('on');
  // seed a few starting spawns
  for (let i = 0; i < 6; i++) {
    spawnObj('gear', Math.floor(Math.random()*3) - 1, -25 - i * 8);
  }
}

function score() { return Math.floor(dist * 3) + gears * 20; }

function showOverlay(title, kind) {
  const ov = document.getElementById('overlay');
  document.getElementById('ov-h1').textContent = title;
  document.getElementById('ov-h2').textContent = kind === 'won' ? 'TIME MACHINE REPAIRED!' : '';
  document.getElementById('ov-h1').style.color = kind === 'won' ? '#e8a516' : '#d33a3a';
  document.getElementById('ov-p1').textContent = 'GEARS ' + gears + ' / ' + GEAR_GOAL;
  document.getElementById('ov-p2').textContent = 'SCORE ' + score() + '   •   ' + Math.floor(dist * 3) + ' m';
  ov.classList.add('on');
}

// ------------ update + render -------------------------------------
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  if (state === 'play') {
    runT += dt * speed;
    speed = Math.min(36, 16.0 + dist * 0.012);
    dist += speed * dt;
    if (shield > 0) shield = Math.max(0, shield - dt);
    if (magnet > 0) magnet = Math.max(0, magnet - dt);
    if (shake > 0)  shake  = Math.max(0, shake - dt);

    // lane lerp
    laneF += (lane - laneF) * Math.min(1, dt * 18);
    // jump
    if (!onGround) {
      jumpY += jumpV * dt - 0.5 * 18 * dt * dt;
      jumpV -= 18 * dt;
      if (jumpY <= 0) { jumpY = 0; onGround = true; jumpV = 0; }
    }
    // texture scroll for floor + ceiling + walls (illusion of motion)
    floorTex.offset.y -= dt * speed * 0.020;
    ceilTex.offset.y  -= dt * speed * 0.020;
    wallTex.offset.x  -= dt * speed * 0.0085;
    wallMatR.map.offset.x -= dt * speed * 0.0085;
    // light intensity wave (subtle flicker)
    for (let i = 0; i < ceilLights.length; i++) {
      ceilLights[i].intensity = 0.65 + 0.1 * Math.sin(runT * 2.0 + i);
      ceilLights[i].position.z = ((ceilLights[i].position.z + dt * speed * 1.0) % 18) - 18*5;
    }

    // wall tubes pulse glow (no actual displacement; subtle)
    for (let i = 0; i < wallTubes.length; i++) {
      const t = wallTubes[i];
      if (t.material && t.material.color) {
        // pulse opacity slightly
        t.material.opacity = 0.7 + 0.2 * Math.sin(runT * 3.0 + i * 0.7);
      }
    }

    // spawn objects on a distance-based pace
    spawnAcc += speed * dt;
    if (spawnAcc > 14) { trySpawn(); spawnAcc = 0; }

    // move objects toward camera
    for (let i = 0; i < objects.length; i++) {
      const o = objects[i];
      if (o.got) continue;
      o.z += speed * dt;
      // magnet: pull gears into player lane
      if (magnet > 0 && o.kind === 'gear' && o.z > -30 && o.z < 5) {
        if (o.lane !== Math.round(laneF)) o.lane = Math.round(laneF);
      }
      o.mesh.position.x += (lanePosX(o.lane) - o.mesh.position.x) * Math.min(1, dt * 14);
      o.mesh.position.z = o.z;
      // per-kind animation
      if (o.kind === 'gear') {
        o.mesh.rotation.z = runT * 1.5 + o.phase;
        o.mesh.position.y = 1.0 + Math.sin(runT * 2 + o.phase) * 0.08;
      } else if (o.kind === 'shield' || o.kind === 'magnet') {
        o.mesh.rotation.y = runT * 1.2;
        o.mesh.position.y = 1.1 + Math.sin(runT*2 + o.phase) * 0.08;
      } else if (o.kind === 'alien') {
        o.mesh.position.y = 0.6 + Math.abs(Math.sin(runT*3 + o.phase)) * 0.18;
        o.mesh.rotation.y = Math.sin(runT*2 + o.phase) * 0.15;
      } else if (o.kind === 'drone') {
        o.mesh.position.y = 1.8 + Math.sin(runT*2 + o.phase) * 0.15;
        const r1 = o.mesh.userData['rot-1'], r2 = o.mesh.userData['rot1'];
        if (r1) r1.rotation.y += dt * 60;
        if (r2) r2.rotation.y -= dt * 60;
      } else if (o.kind === 'fire') {
        const fchild = o.mesh.children[1];
        if (fchild) fchild.scale.y = 1 + Math.sin(runT * 6 + o.phase) * 0.15;
      } else if (o.kind === 'elec') {
        const arc = o.mesh.userData.arc;
        if (arc) arc.material.opacity = 0.4 + 0.5 * Math.abs(Math.sin(runT * 8 + o.phase));
      } else if (o.kind === 'tox') {
        for (const b of o.mesh.children) {
          if (b.userData && b.userData.phase != null) {
            b.position.y = 0.15 + 0.18 * Math.abs(Math.sin(runT*3 + b.userData.phase));
          }
        }
      }

      // collision window (player at z≈6, so object z ≈ 5.0 → 7.0)
      const px = lanePosX(Math.round(laneF));
      if (o.z > 4.5 && o.z < 7.5 && Math.abs(o.mesh.position.x - px) < 1.0) {
        if (o.kind === 'gear') {
          o.got = true; gears++;
          pickGroup.remove(o.mesh);
          if (gears >= GEAR_GOAL && !goalDone) {
            goalDone = true; state = 'won';
            if (score() > best) { best = score(); localStorage.setItem('sdr_best', best); }
            if (gears > bestG)  { bestG = gears; localStorage.setItem('sdr_bestG', bestG); }
            showOverlay('YOU DID IT!', 'won');
          }
        } else if (o.kind === 'shield') {
          o.got = true; shield = 6; pickGroup.remove(o.mesh);
        } else if (o.kind === 'magnet') {
          o.got = true; magnet = 6; pickGroup.remove(o.mesh);
        } else {
          const cleared = o.jumpable && jumpY > 0.6;
          if (!cleared) {
            if (shield > 0) { o.got = true; shield = 0; shake = 0.25; pickGroup.remove(o.mesh); }
            else {
              state = 'dead'; shake = 0.4;
              if (score() > best) { best = score(); localStorage.setItem('sdr_best', best); }
              if (gears > bestG)  { bestG = gears; localStorage.setItem('sdr_bestG', bestG); }
              showOverlay('CAUGHT!', 'dead');
            }
          }
        }
      }
    }
    // cull
    for (let i = objects.length - 1; i >= 0; i--) {
      const o = objects[i];
      if (o.got || o.z > 12) {
        if (!o.got) pickGroup.remove(o.mesh);
        objects.splice(i, 1);
      }
    }

    // animate Danny
    const stride = onGround ? Math.sin(runT * 9) : 0;
    legL.rotation.x = stride * 0.6;
    legR.rotation.x = -stride * 0.6;
    armL.rotation.x = -stride * 0.5;
    armR.rotation.x = stride * 0.5;
    danny.position.x += (lanePosX(laneF) - danny.position.x) * Math.min(1, dt * 18);
    danny.position.y = jumpY;
    // small body twist
    danny.rotation.z = -stride * 0.04;
  }

  // camera shake
  if (shake > 0) {
    camera.position.x = (Math.random() - 0.5) * shake * 0.6;
    camera.position.y = 3.4 + (Math.random() - 0.5) * shake * 0.4;
  } else {
    camera.position.x += (0 - camera.position.x) * 0.15;
    camera.position.y += (3.4 - camera.position.y) * 0.15;
  }

  // UI updates
  document.getElementById('ui-gears').textContent = gears;
  document.getElementById('ui-score').textContent = score();
  document.getElementById('ui-dist').textContent = Math.floor(dist * 3);
  document.getElementById('ui-best').textContent  = best;
  document.getElementById('ui-prog').style.width = (Math.min(1, gears / GEAR_GOAL) * 100) + '%';
  document.getElementById('pwr-shield').classList.toggle('on', shield > 0);
  document.getElementById('pwr-magnet').classList.toggle('on', magnet > 0);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

reset();
tick();
</script>
</body>
</html>
