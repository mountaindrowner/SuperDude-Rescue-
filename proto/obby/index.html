<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9fd8ff">
<title>Super Dude OBBY v4.6 — face fixes (smile, nose, clear eyes)</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; height: 100%; background: #bfe8ff; overflow: hidden;
    font-family: system-ui, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#game { background: #bfe8ff; width: 100vw; height: 100vh; display: block; }

  /* v4: Checkpoint toast — slides down from the top centre on each checkpoint
     touch, fades after 1.5s. */
  #toast { position: fixed; top: 84px; left: 0; right: 0; text-align: center;
           pointer-events: none; z-index: 14;
           transform: translateY(-12px); opacity: 0; transition: opacity .25s, transform .25s; }
  #toast.on { transform: translateY(0); opacity: 1; }
  #toast .pill { display: inline-block; padding: 8px 16px; border-radius: 999px;
           background: rgba(0,255,200,0.18); color: #00ffc8; font-weight: 800; letter-spacing: 2px;
           border: 1.5px solid rgba(0,255,200,0.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
           font-size: 15px; text-shadow: 0 0 8px rgba(0,255,200,0.4); }

  /* v4.5: Character Review HUD — C toggles. Shows when state==='review'.
     Top-center panel with pose name + 1-5 hotkeys + exit hint. */
  #review { position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            padding: 10px 18px;
            background: rgba(20,24,38,0.78); color: #e8ecf3;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 13px; line-height: 1.5; letter-spacing: 1px;
            border-radius: 10px; border: 1.5px solid rgba(70,240,255,0.55);
            box-shadow: 0 0 16px rgba(70,240,255,0.30);
            pointer-events: none; z-index: 15; display: none; min-width: 320px;
            text-align: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #review.on { display: block; }
  #review b { color: #46f0ff; font-weight: 700; }
  #review .pose { color: #ffd23a; font-weight: 800; letter-spacing: 2px; }

  /* v4: Debug HUD — F3 toggles. Top-right, mono, half-opacity. */
  #debug { position: fixed; top: 80px; right: 12px; padding: 8px 10px;
           background: rgba(10,12,20,0.65); color: #b8e0ff; font-family: ui-monospace, "SF Mono", Menlo, monospace;
           font-size: 11px; line-height: 1.45; border-radius: 6px; border: 1px solid rgba(255,255,255,0.15);
           pointer-events: none; z-index: 15; display: none; min-width: 152px; }
  #debug.on { display: block; }
  #debug b { color: #ffd23a; font-weight: 700; }

  /* HUD overlay shell — patterned after runner v34. */
  #ui { position: fixed; inset: 0; pointer-events: none;
        font-family: system-ui, "Segoe UI", sans-serif; }
  #topbar { position: absolute; top: 8px; left: 8px; right: 8px;
            background: rgba(20,24,38,0.74); border-radius: 10px; padding: 8px 12px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .row { display: flex; justify-content: space-between; align-items: center; color: #e8ecf3; }
  .row + .row { margin-top: 4px; }
  .lbl { font-weight: 700; font-size: 16px; }
  .lbl.big { font-size: 22px; color: #ffd23a; text-shadow: 0 0 10px rgba(255,210,58,0.45); }
  .lbl.dim { color: #9aa0c4; font-weight: 600; font-size: 13px; }
  .lbl.cyan { color: #46f0ff; }
  .bar { height: 4px; background: rgba(255,210,58,0.20); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: linear-gradient(to right, #46f0ff, #ffd23a); transition: width .2s linear;
               box-shadow: 0 0 10px rgba(255,210,58,0.5); }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
             flex-direction: column; background: rgba(10,12,20,0.86); color: #fff; pointer-events: auto; cursor: pointer; }
  #overlay.on { display: flex; }
  #overlay h1 { margin: 0; font-size: 48px; letter-spacing: 2px; color: #ffd23a;
                text-shadow: 0 0 16px rgba(255,210,58,0.5); }
  #overlay h2 { margin: 6px 0 12px; font-size: 28px; color: #e8a516; }
  #overlay p  { margin: 4px 0; color: #cfd6e4; }
  #overlay .blink { margin-top: 24px; font-size: 18px; opacity: .9; }
  #hint { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center;
          color: #15192a; font-size: 12px; pointer-events: none; opacity: 0.85; }

  /* ---------- mobile touch controls (only shown on touch-capable) ----------
     Layout per Mark v3 request: gameplay = top 80% of screen, controls = bottom
     ~20% strip. Stick on the left side of the strip, JUMP button on the right.
     The look-drag area spans the entire top 80% so the player can orbit anywhere
     above the strip. */
  body:not([data-touch]) #touchUI { display: none; }
  #touchUI { position: fixed; inset: 0; pointer-events: none; z-index: 12; }
  /* Top 80% — anywhere you drag here = orbit the camera */
  #lookZone { position: absolute; left: 0; right: 0; top: 0; height: 80vh; pointer-events: auto; }
  /* Bottom 20% strip — translucent dark band for control affordance */
  #ctrlBar { position: absolute; left: 0; right: 0; bottom: 0; height: 20vh; min-height: 140px;
             pointer-events: none;
             background: linear-gradient(180deg, rgba(20,24,38,0.0), rgba(20,24,38,0.45) 60%, rgba(20,24,38,0.60));
             border-top: 1px solid rgba(255,255,255,0.10); }
  #stickZone { position: absolute; left: 0; right: 50%; bottom: 0; height: 20vh; min-height: 140px;
               pointer-events: auto; }
  #stickBase, #stickKnob { position: absolute; border-radius: 50%;
               background: rgba(20,24,38,0.30); border: 2px solid rgba(255,255,255,0.55);
               box-shadow: 0 2px 12px rgba(0,0,0,0.30);
               transition: opacity .12s; opacity: 0.55; pointer-events: none; }
  #stickBase { width: 110px; height: 110px; }
  #stickKnob { width: 56px; height: 56px; background: rgba(255,255,255,0.92); border: 2px solid rgba(20,24,38,0.65); }
  #stickZone.live #stickBase, #stickZone.live #stickKnob { opacity: 1.0; }
  #jumpBtn { position: absolute; right: 24px; bottom: 22px; width: 96px; height: 96px;
             border-radius: 50%; background: rgba(70,240,255,0.78); border: 3px solid #fff;
             color: #15192a; font-weight: 900; font-size: 18px; letter-spacing: 2px;
             box-shadow: 0 4px 14px rgba(0,0,0,0.35); pointer-events: auto;
             display: flex; align-items: center; justify-content: center; user-select: none;
             touch-action: none; -webkit-touch-callout: none; z-index: 13; }
  #jumpBtn:active, #jumpBtn.live { background: #ffd23a; transform: scale(0.94); }
</style>

<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="ui">
  <div id="topbar">
    <div class="row">
      <span class="lbl big">STAGE <span id="ui-stage">1</span><span style="color:#9aa0c4"> / </span><span id="ui-total" style="color:#9aa0c4">1</span></span>
      <span class="lbl"><span style="color:#9aa0c4">CHECKPOINT</span> <span id="ui-cp" class="cyan">0</span></span>
    </div>

<div id="touchUI">
  <div id="lookZone"></div>

<script type="module">
import * as THREE from 'three';

// ============================================================
// 0. PROJECT CONSTANTS + STATE OBJECTS
// ============================================================
// Per proto/obby/CLAUDE.md §4 — explicit state objects rather than
// scattered globals. Names match the manual so future passes can
// rely on this shape.

const THEMES = {
  // Stage 1's default theme. Future passes can per-stage override.
  lab: {
    sky:        0xbfe8ff,
    fogNear:    28,
    fogFar:     95,
    safe:       0x4fa3ff,    // bright blue main path
    trim:       0x1f5f91,    // darker blue trim under safe blocks
    hazard:     0xff3b1f,    // lava red
    hazardRim:  0x771000,    // darker rim around lava
    checkpoint: 0x00ffc8,    // cyan/green glow
    finish:     0xffd447,    // gold
    jumpPad:    0x46f0ff,    // electric cyan
    moving:     0xffce6b,    // warm yellow with arrow stripes
    disappear:  0xb89aff,    // purple/translucent
  },
};
const THEME = THEMES.lab;

const GRAPHICS = {
  quality:           'high',
  shadows:           true,
  outlines:          false,    // defer per §18.7
  post:              false,    // defer per §18.13
  pixelRatioCap:     1.75,
  decorativeDensity: 1.0,
};

// Movement-feel tuning per §9.1 (full Pass B values).
const TUNING = {
  // Pass B-lite (v4)
  coyoteTime:        0.10,
  jumpBufferTime:    0.12,
  jumpCutMultiplier: 0.45,
  landingSquashTime: 0.10,
  // Pass B-full (v4.2) — smoothness layer per §6.5
  acceleration:      45,     // m/s² — ground accel toward wishDir × WALK_SPEED
  airAcceleration:   22,     // m/s² — ~50% of ground per §6.5
  friction:          32,     // m/s² — ground decel when no input
  maxFallSpeed:      26,     // m/s — clamp |vel.y| so long falls don't tunnel
  joystickDeadzone:  0.12,   // normalized — iPhone touchstick noise floor
};

// Game-wide state. Aliased into runtime vars so the existing code
// keeps working; we just have a single object to read.
const GAME = {
  state: 'play', stage: 0, checkpoints: 0, deaths: 0, elapsed: 0,
};

// ============================================================
// 1. RENDERER / SCENE / CAMERA / LIGHTING
// ============================================================
// Renderer baseline per CLAUDE.md §18.2.
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, GRAPHICS.pixelRatioCap));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = GRAPHICS.shadows;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
// Atmosphere per §18.4 — fog colour MATCHES background so distant
// platforms fade into the sky rather than popping against a hard edge.
scene.background = new THREE.Color(THEME.sky);
scene.fog = new THREE.Fog(THEME.sky, THEME.fogNear, THEME.fogFar);

// PMREM env — a small canvas gradient so PBR materials read correctly.
const envCanvas = document.createElement('canvas');
envCanvas.width = 32; envCanvas.height = 32;
{
  const g = envCanvas.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 32);
  grad.addColorStop(0, '#fff5d8');
  grad.addColorStop(0.5, '#bfe8ff');
  grad.addColorStop(1, '#6bcf6b');
  g.fillStyle = grad; g.fillRect(0, 0, 32, 32);
}
const envTex = new THREE.CanvasTexture(envCanvas);
envTex.mapping = THREE.EquirectangularReflectionMapping;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(envTex).texture;

// Lighting stack per §18.3 — hemisphere fill + ONE directional sun.
// Hemisphere gives sky/ground tinted ambient (much better than flat
// AmbientLight); sun provides shape + shadows. No second fill light.
const hemi = new THREE.HemisphereLight(0xbfe8ff, 0x6b5a45, 1.15);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.25);
sun.position.set(-6, 12, 8);
sun.target.position.set(0, 0, 0);
scene.add(sun);
scene.add(sun.target);
sun.castShadow = GRAPHICS.shadows;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 40;
sun.shadow.camera.left = -18;
sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18;
sun.shadow.camera.bottom = -18;
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.02;

// ============================================================
// 2. SHARED GEOMETRY + MATERIAL CACHE
// ============================================================
// Per CLAUDE.md §4.2, §18.5 — semantic named materials instead of
// inline new MeshStandardMaterial calls.
function toyMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: opts.roughness ?? 0.72,
    metalness: opts.metalness ?? 0.0,
    flatShading: opts.flatShading ?? false,
    emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 0.0,
    transparent: opts.transparent ?? false,
    opacity: opts.opacity ?? 1.0,
  });
}

// Cached geometries for repeated decorations / character parts.
const GEO = {
  sphereLow: new THREE.SphereGeometry(1, 12, 8),
  sphereMed: new THREE.SphereGeometry(1, 16, 12),
  sphereTiny: new THREE.SphereGeometry(0.18, 10, 8),
  cyl:        new THREE.CylinderGeometry(1, 1, 1, 12),
  ringThin:   new THREE.TorusGeometry(1.0, 0.06, 8, 28),
};

// Semantic materials — character + hazards + checkpoint + finish.
const MAT = {
  // Character
  charSkin:    toyMat(0xf0c8a0, { roughness: 0.7,  metalness: 0.05 }),
  charCoat:    toyMat(0xf8fafc, { roughness: 0.55, metalness: 0.15 }),
  charShirt:   toyMat(0xc8d0dc, { roughness: 0.45, metalness: 0.45 }),
  charPants:   toyMat(0x3a4a6a, { roughness: 0.55, metalness: 0.20 }),
  charShoe:    toyMat(0x1a2030, { roughness: 0.50, metalness: 0.35 }),
  charCap:     toyMat(0xd33a3a, { roughness: 0.45, metalness: 0.20 }),
  charHair:    toyMat(0x3a2418),
  charEyeW:    toyMat(0xffffff),
  charEyeD:    toyMat(0x1a2030),
  charStripe:  toyMat(0xffffff),
  charPatch:   toyMat(0xffd23a, { emissive: 0xffd23a, emissiveIntensity: 0.22 }),
  // v4.4 base-Danny additions — glasses + scientist details + shoe trim.
  charGlassRim:  toyMat(0x1a2030, { roughness: 0.35, metalness: 0.55 }),
  charGlassLens: toyMat(0x88ccff, { roughness: 0.20, metalness: 0.05,
                                     transparent: true, opacity: 0.35 }),
  charLapel:     toyMat(0xdfe6f0, { roughness: 0.55, metalness: 0.10 }),  // slightly cool slab
  charPocket:    toyMat(0xeaeef4, { roughness: 0.65, metalness: 0.05 }),  // slightly darker than coat
  charPen:       toyMat(0xffd23a, { emissive: 0xffd23a, emissiveIntensity: 0.55,
                                     roughness: 0.3, metalness: 0.6 }),
  charBelt:      toyMat(0x3a2418, { roughness: 0.7,  metalness: 0.25 }),  // brown leather
  charSideTrim:  toyMat(0x46f0ff, { emissive: 0x46f0ff, emissiveIntensity: 0.30,
                                     roughness: 0.4, metalness: 0.3 }),  // cyan sneaker accent
  // Hazards (per §10.2)
  lava:        toyMat(THEME.hazard,     { emissive: 0xff2200, emissiveIntensity: 0.55, roughness: 0.55 }),
  lavaTop:     toyMat(0xffb070,         { emissive: 0xff7a20, emissiveIntensity: 1.0,  roughness: 0.35 }),
  warningA:    toyMat(0x1a2030,         { roughness: 0.85 }),
  warningB:    toyMat(0xffd23a,         { emissive: 0xffd23a, emissiveIntensity: 0.30 }),
  // Checkpoint + finish
  checkpoint:  toyMat(THEME.checkpoint, { emissive: THEME.checkpoint, emissiveIntensity: 0.45 }),
  cpRingLit:   toyMat(THEME.checkpoint, { emissive: THEME.checkpoint, emissiveIntensity: 0.85,
                                          transparent: true, opacity: 0.65 }),
  pole:        toyMat(0x445566,         { roughness: 0.4, metalness: 0.6 }),
  finishGold:  toyMat(THEME.finish,     { emissive: THEME.finish, emissiveIntensity: 0.85,
                                          roughness: 0.30, metalness: 0.40 }),
  finishStar:  toyMat(0xfff5b0,         { emissive: THEME.finish, emissiveIntensity: 1.4 }),
  // Decoration
  cloud:       toyMat(0xffffff,         { roughness: 0.95 }),
  ground:      toyMat(0x8fc8e8,         { roughness: 0.95 }),
  signFront:   toyMat(0xfff8e0,         { roughness: 0.85 }),
  signPole:    toyMat(0x7a5a3a,         { roughness: 0.8 }),
};

// ============ CAMERA =================================================
// Orbit-follow: azim/elev/radius captured from input; target = player +
// head-height offset; lerp toward the desired position each frame.
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 240);
let azim = 0.0;          // radians, around +Y
let elev = 0.65;         // v3: raised from 0.35 → 0.65 (~37°, just under 45°
                         //     per Mark "maybe a little lower than 45°").
let radius = 7.8;        // v3: slight push-back for the steeper view
let autoFollowCooldown = 0; // seconds; after user drags, pause auto-orient
                            // so manual input sticks. v4.3: 1.5 → 2.5.
const camPos       = new THREE.Vector3();
const camTgt       = new THREE.Vector3();
const camWish      = new THREE.Vector3();
const camSmoothVel = new THREE.Vector3();   // v4.3 — low-pass-filtered player
                                            // velocity, drives orientation +
                                            // look-ahead so they don't jitter
                                            // on direction changes.
function updateCamera(dt) {
  // v4.3 — "loosely follow the path AND the player" (Mark feedback).
  // Three changes vs v4.2:
  //
  //  1. Orientation target is the SMOOTHED velocity direction, not
  //     player.yaw. Yaw flips instantly when input changes — that's
  //     what made turns feel "too sharp." Velocity has natural
  //     momentum from v4.2's acceleration model; running it through
  //     a low-pass filter (camSmoothVel) gives an even gentler signal
  //     so the camera lazily drifts behind the path of motion instead
  //     of whipping behind Danny's facing.
  //
  //  2. Orientation chase rate dramatically lowered (dt*2.4 → dt*0.6).
  //     A 90° turn now takes ~1.5 s for the camera to fully follow;
  //     before, it took ~0.4 s.
  //
  //  3. Speed floor for auto-orient bumped 0.6 → 1.5 m/s. Tiny
  //     shimmies / brief course corrections no longer trigger the
  //     orientation chase at all.
  //
  // Also: position lerp dt*6 → dt*4 (looser position follow); look-ahead
  // 1.5 → 1.0 (keeps Danny more centered); drag cooldown 1.5 → 2.5 s.
  if (autoFollowCooldown > 0) autoFollowCooldown = Math.max(0, autoFollowCooldown - dt);

  // Smooth the player velocity (low-pass, ~0.33 s time constant). Drives
  // both the orientation chase AND the look-ahead.
  const velLerp = Math.min(1, dt * 3.0);
  camSmoothVel.x += (player.vel.x - camSmoothVel.x) * velLerp;
  camSmoothVel.z += (player.vel.z - camSmoothVel.z) * velLerp;
  const smoothSpeed = Math.hypot(camSmoothVel.x, camSmoothVel.z);

  // Loose orientation chase — only above 1.5 m/s sustained motion, and
  // only when the user isn't actively dragging.
  if (state === 'play' && smoothSpeed > 1.5 && !lookActive && autoFollowCooldown === 0) {
    const motionYaw = Math.atan2(camSmoothVel.x, camSmoothVel.z);
    let desired = motionYaw + Math.PI;        // camera sits BEHIND direction of motion
    let diff = desired - azim;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    azim += diff * Math.min(1, dt * 0.6);     // 4× slower than v4.2
  }
  // v4.5 review mode: slow turntable orbit so we can inspect Danny from
  // all sides. ~18 sec per full rotation. User can still drag to override.
  if (state === 'review' && !lookActive && autoFollowCooldown === 0) {
    azim += dt * 0.35;
  }

  // Look target: head height of the player + small forward look-ahead
  // based on smoothed velocity. The look-ahead is shorter than v4.2
  // (1.0 vs 1.5) so the player stays more centered and the camera
  // lurches less when direction changes. In review mode we target the
  // torso center instead of the head so glasses + coat + belt all sit
  // in the middle of the frame.
  let tx = player.pos.x;
  const ty = state === 'review' ? player.pos.y + 0.3 : player.pos.y + 1.0;
  let tz = player.pos.z;
  if (state === 'play' && smoothSpeed > 0.5) {
    const AHEAD = 1.0;
    tx += (camSmoothVel.x / smoothSpeed) * AHEAD;
    tz += (camSmoothVel.z / smoothSpeed) * AHEAD;
  }

  const cx = tx + Math.cos(elev) * Math.sin(azim) * radius;
  const cy = ty + Math.sin(elev) * radius;
  const cz = tz + Math.cos(elev) * Math.cos(azim) * radius;
  camWish.set(cx, cy, cz);
  const k = Math.min(1, dt * 4);              // softer position follow
  camPos.lerp(camWish, k);
  camTgt.lerp({ x: tx, y: ty, z: tz }, k);
  camera.position.copy(camPos);
  camera.lookAt(camTgt);
}

// ============================================================
// 6. CHARACTER FACTORY + RIG + COSMETIC SLOTS
// ============================================================
// v4 (Pass A + Pass C-lite): rig uses named slot groups per §6.2 so
// future passes can swap a hat / hair / glasses without touching the
// rig itself. Slots are added empty unless a default cosmetic is
// equipped here. Hip + shoulder + head pivots preserved from v3 for
// the run animation.
const danny  = new THREE.Group();          // root, yaw-rotated to face wishDir
const rigParts = {};                       // named handles for animation + slots
function buildDanny() {
  function mesh(geom, mat) {
    const m = new THREE.Mesh(geom, mat);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }

  // ============================================================
  // v4.4 — BASE SUPER DUDE DANNY DESIGN
  // ============================================================
  // Per CLAUDE.md §6.1 ("blocky and toy-like, big readable face,
  // distinct cap / hair / glasses, chunky shoes, scientist identity")
  // and §18.8 ("big shapes first, asymmetry via cap patch, hair tuft,
  // coat lapels, chest pocket"). This is the CANONICAL Danny that all
  // future cosmetics build on top of via the slot system.
  //
  // Changes vs v4 (which had the slot scaffolding but used the v3
  // prototype proportions):
  //  • Head 0.30 → 0.34 (more iconic toy proportions)
  //  • Cap dome 0.31 → 0.35, brim 0.48 → 0.52 (re-fit to bigger head)
  //  • Eyes 0.055 / 0.028 → 0.065 / 0.035 (readable at gameplay cam dist)
  //  • Mouth 0.16 → 0.18 wide
  //  • + Eyebrows (NEW — expression layer)
  //  • + Default round glasses equipped in glassesSlot (NEW — was empty)
  //  • + Coat lapels (NEW — asymmetry per §18.8)
  //  • + Chest pocket + gold pen tip (NEW — scientist identity)
  //  • + Brown tool belt at hip line (NEW — adventurer detail)
  //  • Arms 0.10 → 0.11 radius, hands 0.13 → 0.15 (chunkier)
  //  • Legs 0.16 → 0.18 radius (chunkier)
  //  • Shoes 0.30/0.16/0.50 → 0.36/0.18/0.56 (chunky toy sneakers)
  //  • + Cyan side trim on each shoe (NEW — signature accent color)
  //  • + Dark crisscross laces on shoes (NEW — sneaker detail)
  //
  // The cosmetic slots (hatSlot / hairSlot / glassesSlot / shirtSlot /
  // backSlot / effectSlot) all remain usable for later customization.

  // ---- LEGS as hip-pivot groups (chunkier per §6.1) ----------------
  const LEG_LEN = 0.85;
  for (const side of [-1, +1]) {
    const hip = new THREE.Group();
    hip.position.set(side * 0.18, LEG_LEN, 0);
    danny.add(hip);
    // v4.5 Roblox-ify — was CylinderGeometry; box reads as blocky toy
    const leg = mesh(new THREE.BoxGeometry(0.26, LEG_LEN, 0.26), MAT.charPants);
    leg.position.y = -LEG_LEN / 2;
    hip.add(leg);
    // CHUNKY SNEAKER — 20% wider, 12% taller, 12% deeper than v4.
    const shoe = mesh(new THREE.BoxGeometry(0.36, 0.18, 0.56), MAT.charShoe);
    shoe.position.set(0, -LEG_LEN + 0.09, 0.05);
    hip.add(shoe);
    // White Velcro-style stripe wrapping the shoe (midsole accent)
    const stripe = mesh(new THREE.BoxGeometry(0.37, 0.04, 0.56), MAT.charStripe);
    stripe.position.set(0, -LEG_LEN + 0.10, 0.05);
    hip.add(stripe);
    // v4.4 — cyan side accent on the OUTER face of each shoe (signature
    // Super Dude color). Outer side is in the direction of `side` in
    // hip-local coords (left hip outer = -X, right hip outer = +X).
    const sideTrim = mesh(new THREE.BoxGeometry(0.025, 0.06, 0.42), MAT.charSideTrim);
    sideTrim.position.set(side * 0.19, -LEG_LEN + 0.10, 0.05);
    hip.add(sideTrim);
    // v4.4 — sneaker laces (dark crisscross on top of shoe)
    for (let i = 0; i < 3; i++) {
      const lace = mesh(new THREE.BoxGeometry(0.20, 0.018, 0.025), MAT.charEyeD);
      lace.position.set(0, -LEG_LEN + 0.18, 0.05 + (i - 1) * 0.10);
      hip.add(lace);
    }
    rigParts[side < 0 ? 'hipL' : 'hipR'] = hip;
  }

  // ---- TORSO group (shirt + coat) + scientist details + slots ------
  const TORSO_Y = 1.18;
  const torsoGrp = new THREE.Group();
  danny.add(torsoGrp);
  rigParts.body = torsoGrp;

  // v4.5 Roblox-ify — was CapsuleGeometry; box reads as blocky toy.
  // Bounding matches the old capsule (0.64 × 1.10 × 0.64) but trimmed
  // to 0.92 tall + 0.44 deep so it feels Roblox-flat at the back.
  const torso = mesh(new THREE.BoxGeometry(0.64, 0.92, 0.44), MAT.charShirt);
  torso.position.y = TORSO_Y;
  torsoGrp.add(torso);
  const coatFront = mesh(new THREE.BoxGeometry(0.62, 0.78, 0.06), MAT.charCoat);
  coatFront.position.set(0, TORSO_Y - 0.04, 0.30);
  torsoGrp.add(coatFront);
  const hem = mesh(new THREE.BoxGeometry(0.72, 0.30, 0.50), MAT.charCoat);
  hem.position.set(0, 0.86, 0);
  torsoGrp.add(hem);

  // v4.4 — COAT LAPELS — two small slabs flaring outward from the
  // collar (top corners of the coat front). Reads as a lab-coat collar
  // per §18.8 asymmetry guidance.
  for (const side of [-1, +1]) {
    const lapel = mesh(new THREE.BoxGeometry(0.14, 0.22, 0.04), MAT.charLapel);
    lapel.position.set(side * 0.20, TORSO_Y + 0.28, 0.33);
    lapel.rotation.z = side * 0.30;     // V shape — outer edges flare up
    torsoGrp.add(lapel);
  }

  // v4.4 — CHEST POCKET on viewer-left of the coat (Danny's right) +
  // gold PEN TIP sticking out the top. Scientist identity per §6.1.
  const pocket = mesh(new THREE.BoxGeometry(0.14, 0.12, 0.03), MAT.charPocket);
  pocket.position.set(-0.16, TORSO_Y + 0.04, 0.34);
  torsoGrp.add(pocket);
  const penBody = mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.14, 8), MAT.charPen);
  penBody.position.set(-0.16, TORSO_Y + 0.16, 0.35);
  torsoGrp.add(penBody);
  const penClip = mesh(new THREE.BoxGeometry(0.02, 0.06, 0.005), MAT.charPen);
  penClip.position.set(-0.155, TORSO_Y + 0.14, 0.36);
  torsoGrp.add(penClip);

  // v4.4 — TOOL BELT — thin brown band wrapping the bottom of the torso
  // just above the hem. Adventurer detail.
  const belt = mesh(new THREE.BoxGeometry(0.74, 0.07, 0.52), MAT.charBelt);
  belt.position.set(0, 1.02, 0);
  torsoGrp.add(belt);
  // little gold buckle on the belt front
  const buckle = mesh(new THREE.BoxGeometry(0.10, 0.06, 0.02), MAT.charPatch);
  buckle.position.set(0, 1.02, 0.27);
  torsoGrp.add(buckle);

  // shirtSlot / backSlot / effectSlot — empty by default; cosmetics
  // factory can populate later.
  rigParts.shirtSlot = new THREE.Group(); torsoGrp.add(rigParts.shirtSlot);
  rigParts.backSlot  = new THREE.Group(); rigParts.backSlot.position.set(0, TORSO_Y, -0.30); torsoGrp.add(rigParts.backSlot);
  rigParts.effectSlot = new THREE.Group(); rigParts.effectSlot.position.set(0, TORSO_Y, 0); torsoGrp.add(rigParts.effectSlot);

  // ---- ARMS as shoulder-pivot groups (chunkier) --------------------
  const ARM_LEN = 0.78;
  for (const side of [-1, +1]) {
    const sh = new THREE.Group();
    sh.position.set(side * 0.44, 1.59, 0);
    danny.add(sh);
    // v4.5 Roblox-ify — was CylinderGeometry; box reads as blocky toy
    const arm = mesh(new THREE.BoxGeometry(0.22, ARM_LEN, 0.22), MAT.charCoat);
    arm.position.y = -ARM_LEN / 2;
    sh.add(arm);
    const hand = mesh(new THREE.SphereGeometry(0.15, 14, 10), MAT.charSkin);
    hand.position.y = -ARM_LEN + 0.04;
    sh.add(hand);
    rigParts[side < 0 ? 'shoulderL' : 'shoulderR'] = sh;
  }

  // ---- HEAD group + slots ------------------------------------------
  // v4.4 — head bumped 0.30 → 0.34 for an iconic toy proportion (per
  // §6.1 "big head, readable face"). Cap dome / brim re-fit; eyes,
  // mouth, glasses positions re-tuned for the bigger head sphere.
  const headY = 1.92;
  const headGrp = new THREE.Group();
  headGrp.position.y = headY;
  danny.add(headGrp);
  rigParts.headGrp = headGrp;

  rigParts.head = mesh(new THREE.SphereGeometry(0.34, 18, 14), MAT.charSkin);
  headGrp.add(rigParts.head);

  // EYES — bigger whites + bigger dark pupils so they read from
  // gameplay camera distance (anti-pattern §18.8: tiny features).
  function eye(side, dx, dy, dz, r, mat) {
    const e = mesh(new THREE.SphereGeometry(r, 10, 8), mat);
    e.position.set(side * dx, dy, dz);
    headGrp.add(e); return e;
  }
  eye(-1, 0.11, 0.04, 0.27, 0.065, MAT.charEyeW);
  eye( 1, 0.11, 0.04, 0.27, 0.065, MAT.charEyeW);
  eye(-1, 0.11, 0.03, 0.31, 0.035, MAT.charEyeD);
  eye( 1, 0.11, 0.03, 0.31, 0.035, MAT.charEyeD);

  // v4.6 — EYEBROWS lifted (y 0.14 → 0.18) so they peek ABOVE the glass
  // rims instead of being tucked behind them. Slightly shorter so they
  // don't span the entire eye width.
  for (const side of [-1, +1]) {
    const brow = mesh(new THREE.BoxGeometry(0.10, 0.025, 0.035), MAT.charHair);
    brow.position.set(side * 0.11, 0.18, 0.30);
    brow.rotation.z = side * -0.18;     // outer ends raised
    headGrp.add(brow);
  }

  // v4.6 — NOSE — small skin-colored block in the empty cheek zone
  // between the glasses and the smile. Anchors the face structurally
  // so it doesn't read as flat.
  const nose = mesh(new THREE.BoxGeometry(0.06, 0.07, 0.05), MAT.charSkin);
  nose.position.set(0, -0.05, 0.34);
  headGrp.add(nose);

  // v4.6 — SMILE (was a flat horizontal slab that read as a mustache).
  // Three small dark segments forming a slight upward-curving smirk,
  // positioned LOWER on the face so it's not in mustache territory.
  const SMILE_Y = -0.17, SMILE_Z = 0.31;
  const smileC = mesh(new THREE.BoxGeometry(0.08, 0.022, 0.04), MAT.charEyeD);
  smileC.position.set(0, SMILE_Y, SMILE_Z);
  headGrp.add(smileC);
  for (const side of [-1, +1]) {
    const wing = mesh(new THREE.BoxGeometry(0.045, 0.022, 0.04), MAT.charEyeD);
    wing.position.set(side * 0.055, SMILE_Y + 0.012, SMILE_Z);
    wing.rotation.z = side * -0.45;     // outer ends raised = smile
    headGrp.add(wing);
  }

  // glassesSlot — DEFAULT EQUIPPED in v4.4 (was empty). Round black
  // rims with a faint cyan lens hint, joined by a slim bridge across
  // the nose. Slot still re-addressable for swap.
  rigParts.glassesSlot = new THREE.Group();
  rigParts.glassesSlot.position.set(0, 0.04, 0.32);
  headGrp.add(rigParts.glassesSlot);
  {
    // v4.6 — RIMS ONLY (the cyan lens cylinder was occluding the eyes;
    // dropping it lets the white eyes + pupils read cleanly through
    // the open frames). Rims also slightly smaller (0.08 → 0.07) so
    // they don't dominate the face.
    for (const side of [-1, +1]) {
      const rim = mesh(new THREE.TorusGeometry(0.07, 0.016, 8, 18), MAT.charGlassRim);
      rim.position.set(side * 0.10, 0, 0);
      rim.rotation.y = Math.PI / 2;       // face forward (torus default lies in XY)
      rigParts.glassesSlot.add(rim);
    }
    // Bridge across nose
    const bridge = mesh(new THREE.BoxGeometry(0.07, 0.016, 0.018), MAT.charGlassRim);
    bridge.position.set(0, 0.01, 0);
    rigParts.glassesSlot.add(bridge);
    // Small temple stubs (where arms would hinge — purely visual)
    for (const side of [-1, +1]) {
      const temple = mesh(new THREE.BoxGeometry(0.04, 0.016, 0.018), MAT.charGlassRim);
      temple.position.set(side * 0.16, 0, -0.02);
      rigParts.glassesSlot.add(temple);
    }
  }

  // hairSlot — default brown tuft peeking from under the cap. Position
  // adjusted slightly for the bigger head.
  rigParts.hairSlot = new THREE.Group();
  headGrp.add(rigParts.hairSlot);
  {
    const hair = mesh(new THREE.SphereGeometry(0.13, 10, 8), MAT.charHair);
    hair.position.set(0, 0.18, -0.22);
    rigParts.hairSlot.add(hair);
  }

  // hatSlot — default backwards red cap with gold SD patch. Cap dome
  // and brim resized to fit the bigger head.
  rigParts.hatSlot = new THREE.Group();
  headGrp.add(rigParts.hatSlot);
  {
    const dome = mesh(new THREE.SphereGeometry(0.35, 18, 14, 0, Math.PI*2, 0, Math.PI*0.55), MAT.charCap);
    dome.position.set(0, 0.18, 0);
    rigParts.hatSlot.add(dome);
    const brim = mesh(new THREE.BoxGeometry(0.52, 0.04, 0.24), MAT.charCap);
    brim.position.set(0, 0.12, -0.32);
    brim.rotation.x = 0.10;
    rigParts.hatSlot.add(brim);
    // gold SD patch — referenced by rigParts so the cap can pulse on
    // checkpoint / finish in future passes (Pass C - emotion layer).
    const patch = mesh(new THREE.BoxGeometry(0.20, 0.11, 0.02), MAT.charPatch);
    patch.position.set(0, 0.18, 0.32);
    rigParts.hatSlot.add(patch);
    rigParts.capPatch = patch;
  }

  // ---- Drop shadow (scene-pinned, stays on platform top in flight) -
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.55, 24),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32 })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.02;
  shadow.renderOrder = -1;
  danny.userData.shadow = shadow;
  scene.add(shadow);
}
buildDanny();
scene.add(danny);

// ============ RUN / IDLE ANIMATION ===================================
// Stride phase accumulates while moving; lerps everything back to a
// neutral pose when stopped (or while respawning).
let stridePhase = 0;

// ============================================================
// CHARACTER REVIEW MODE — press C in game to enter
// ============================================================
// Lets us inspect Danny from all angles + flip through poses to
// iterate the design without leaving the game. Camera auto-orbits
// at ~18 sec/rotation; 1-5 set the pose; ESC or C exits.
let reviewPose = 1;          // 1 idle / 2 run / 3 jump / 4 fall / 5 land
const REVIEW_POSE_NAMES = { 1: '1 IDLE', 2: '2 RUN', 3: '3 JUMP', 4: '4 FALL', 5: '5 LAND' };
function enterReview() {
  if (state === 'review') return;
  state = 'review';
  reviewPose = 1;
  document.getElementById('review').classList.add('on');
  document.getElementById('rev-pose').textContent = REVIEW_POSE_NAMES[reviewPose];
}
function exitReview() {
  if (state !== 'review') return;
  state = 'play';
  document.getElementById('review').classList.remove('on');
  danny.rotation.x = 0;
  danny.rotation.z = 0;
  danny.scale.set(1, 1, 1);
}
function setReviewPose(n) {
  reviewPose = n;
  document.getElementById('rev-pose').textContent = REVIEW_POSE_NAMES[n] || ('? ' + n);
}
// Drives Danny's rig while in review mode. Smoothly lerps every
// joint toward the target pose so toggling 1→2→3 reads cleanly.
function tickRigReview(dt) {
  const k = Math.min(1, dt * 8);
  let tHipL = 0, tHipR = 0, tShoL = 0, tShoR = 0;
  let tSholZ = 0, tShoRZ = 0;
  let tBodyTiltX = 0, tHeadTiltX = 0;
  let tScaleY = 1, tScaleXZ = 1;
  switch (reviewPose) {
    case 1: /* idle — all zero (defaults above) */ break;
    case 2: {
      // Run cycle — increment stridePhase and pose limbs from the sine
      stridePhase += dt * 6;
      const swing    = Math.sin(stridePhase) * 0.65;
      const armSwing = Math.sin(stridePhase) * 0.55;
      tHipL =  swing;  tHipR = -swing;
      tShoL = -armSwing; tShoR = armSwing;
      break;
    }
    case 3: {
      // Jump — knees tucked back, arms up
      tHipL = -0.55; tHipR = -0.55;
      tShoL =  1.30; tShoR =  1.30;
      tBodyTiltX = -0.08;
      break;
    }
    case 4: {
      // Fall — arms out to sides, slight backward lean
      tHipL =  0.30; tHipR = -0.30;
      tShoL = -0.40; tShoR = -0.40;
      tSholZ = -0.65; tShoRZ = 0.65;
      tBodyTiltX = -0.18;
      break;
    }
    case 5: {
      // Land — squash + slight forward lean
      tScaleY = 0.78; tScaleXZ = 1.18;
      tBodyTiltX = 0.10;
      tHeadTiltX = 0.10;
      break;
    }
  }
  rigParts.hipL.rotation.x += (tHipL - rigParts.hipL.rotation.x) * k;
  rigParts.hipR.rotation.x += (tHipR - rigParts.hipR.rotation.x) * k;
  rigParts.shoulderL.rotation.x += (tShoL - rigParts.shoulderL.rotation.x) * k;
  rigParts.shoulderR.rotation.x += (tShoR - rigParts.shoulderR.rotation.x) * k;
  rigParts.shoulderL.rotation.z += (tSholZ - rigParts.shoulderL.rotation.z) * k;
  rigParts.shoulderR.rotation.z += (tShoRZ - rigParts.shoulderR.rotation.z) * k;
  rigParts.headGrp.rotation.x += (tHeadTiltX - rigParts.headGrp.rotation.x) * k;
  danny.rotation.x += (tBodyTiltX - danny.rotation.x) * k;
  danny.scale.y += (tScaleY - danny.scale.y) * k;
  const sx = (tScaleXZ - danny.scale.x) * k;
  danny.scale.x += sx; danny.scale.z += sx;
}

function tickRig(dt, isMoving) {
  const speed = Math.hypot(player.vel.x, player.vel.z);
  if (isMoving) {
    // Cadence ramps with movement speed so the run reads fast at high
    // speed and natural at base speed.
    stridePhase += dt * (3.5 + speed * 0.55);
  }
  const swing = isMoving ? Math.sin(stridePhase) * 0.65 : 0;
  const armSwing = isMoving ? Math.sin(stridePhase) * 0.55 : 0;
  const k = Math.min(1, dt * 14);
  // Hips swing opposite to each other.
  rigParts.hipL.rotation.x += ( swing - rigParts.hipL.rotation.x) * k;
  rigParts.hipR.rotation.x += (-swing - rigParts.hipR.rotation.x) * k;
  // Arms swing opposite to hips, ~85% amplitude.
  rigParts.shoulderL.rotation.x += (-armSwing - rigParts.shoulderL.rotation.x) * k;
  rigParts.shoulderR.rotation.x += ( armSwing - rigParts.shoulderR.rotation.x) * k;
  // Head bob — small up/down on every footfall (twice per stride cycle).
  const bobTarget = isMoving ? Math.abs(Math.sin(stridePhase * 2)) * 0.05 : 0;
  rigParts.headGrp.position.y += (1.92 + bobTarget - rigParts.headGrp.position.y) * k;
}

// 8. PLAYER STATE + PHYSICS CONSTANTS
// ============================================================
const GRAV = 18, JUMP_V0 = 7.0, WALK_SPEED = 8.0;
const player = {
  pos: new THREE.Vector3(0, 2, 0),
  vel: new THREE.Vector3(0, 0, 0),
  yaw: 0,
  onGround: false,
  radius: 0.4,
  halfH: 0.70,
  // v4 Pass B-lite: movement-feel state per §6.5 + §9.1
  coyoteTimer:    0,       // s — counts up off-ground; jump valid while < TUNING.coyoteTime
  jumpBuffer:     0,       // s — counts down after jump press; fires on landing if > 0
  jumpHeld:       false,   // currently holding the jump button (for variable jump cut)
  prevOnGround:   false,   // last frame's onGround — for landing-squash trigger
  onPlatform:     null,    // platforms[] entry the player is currently standing on
};
let lastCheckpointPos = player.pos.clone();
let state = 'play';      // 'play' | 'respawning' | 'won'
let dieT = 0;
const dieStartPos = new THREE.Vector3();
let runT = 0;
let timeSec = 0;
let landSquashT = 0;     // counts down while the landing squash plays

// ============================================================
// 5. PROCEDURAL MESH FACTORIES
// ============================================================
// approach — step `cur` toward `target` by at most `step`. Used by the
// acceleration model in stepPlay (§6.5 "slight acceleration/deceleration,
// not instant full-speed snap").
function approach(cur, target, step) {
  const d = target - cur;
  return Math.abs(d) <= step ? target : cur + Math.sign(d) * step;
}

// Helper: darken a hex color toward black by `amt` (0..1).
function darkenHex(hex, amt = 0.55) {
  const c = new THREE.Color(hex);
  c.r *= amt; c.g *= amt; c.b *= amt;
  return c.getHex();
}
function lightenHex(hex, amt = 0.15) {
  const c = new THREE.Color(hex);
  c.r = Math.min(1, c.r + amt);
  c.g = Math.min(1, c.g + amt);
  c.b = Math.min(1, c.b + amt);
  return c.getHex();
}

// makeToyPlatform — composes a base block + slightly-inset brighter top
// slab so platforms don't look like flat cubes (per §18.8). Returns
// `{ group, baseMesh }`; the caller uses baseMesh for the collision
// AABB and adds `group` to the scene.
function makeToyPlatform({ pos, size, color, trimColor, emissive, emissiveIntensity }) {
  const grp = new THREE.Group();
  grp.position.set(pos[0], pos[1], pos[2]);
  const trim = trimColor ?? darkenHex(color, 0.60);
  // base block (carries the AABB)
  const baseMat = new THREE.MeshStandardMaterial({
    color: trim, roughness: 0.80, metalness: 0.0,
    emissive: emissive ?? 0x000000,
    emissiveIntensity: emissiveIntensity ?? 0.0,
  });
  const base = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), baseMat);
  base.castShadow = false; base.receiveShadow = true;
  grp.add(base);
  // bright top inset slab — only on platforms big enough to read it
  if (size[0] >= 1.8 && size[2] >= 1.8 && size[1] >= 0.5) {
    const topThick = Math.max(0.10, Math.min(0.20, size[1] * 0.28));
    const topMat = new THREE.MeshStandardMaterial({
      color, roughness: 0.62, metalness: 0.0,
      emissive: emissive ?? 0x000000,
      emissiveIntensity: emissiveIntensity ?? 0.0,
    });
    const top = new THREE.Mesh(
      new THREE.BoxGeometry(size[0] * 0.92, topThick, size[2] * 0.92),
      topMat
    );
    top.position.y = size[1] / 2 - topThick / 2 + 0.005;
    top.receiveShadow = true;
    grp.add(top);
  }
  return { group: grp, baseMesh: base };
}

// makeCloudPuff — small Group of 3-5 overlapping spheres for a low-cost
// background cloud. Uses cached cloud material.
function makeCloudPuff() {
  const g = new THREE.Group();
  const n = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const r = 1.0 + Math.random() * 1.2;
    const s = new THREE.Mesh(GEO.sphereLow, MAT.cloud);
    s.scale.set(r, r * 0.65, r);
    s.position.set((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 2);
    g.add(s);
  }
  return g;
}

// makeStageSign — paints the stage name onto a small canvas texture
// and stacks it on a wooden-toned post. Cached by stage id so we don't
// rebuild the canvas every reset.
const _signCache = new Map();
function makeStageSign(stageId, name) {
  let tex = _signCache.get(stageId);
  if (!tex) {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 96;
    const g = c.getContext('2d');
    g.fillStyle = '#fff8e0'; g.fillRect(0, 0, 256, 96);
    g.fillStyle = '#7a5a3a'; g.fillRect(0, 0, 256, 4); g.fillRect(0, 92, 256, 4);
    g.fillStyle = '#1a2030';
    g.font = 'bold 22px system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const idStr = String(stageId).padStart(2, '0');
    g.fillText(idStr + '   ' + name, 128, 48);
    tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    _signCache.set(stageId, tex);
  }
  const grp = new THREE.Group();
  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.07, 1.4, 8),
    MAT.signPole
  );
  post.position.y = 0.7;
  post.castShadow = true; post.receiveShadow = true;
  grp.add(post);
  const board = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.55, 0.06),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85 })
  );
  board.position.y = 1.55;
  board.castShadow = true;
  grp.add(board);
  return grp;
}

// makeWarningPost — small black/yellow post for the corners of a lava
// volume per §10.2. Alternating chevron-style.
function makeWarningPost(altYellow) {
  const grp = new THREE.Group();
  const lower = new THREE.Mesh(
    new THREE.BoxGeometry(0.18, 0.30, 0.18),
    altYellow ? MAT.warningB : MAT.warningA
  );
  lower.position.y = 0.15;
  lower.castShadow = false; lower.receiveShadow = true;
  grp.add(lower);
  const upper = new THREE.Mesh(
    new THREE.BoxGeometry(0.18, 0.30, 0.18),
    altYellow ? MAT.warningA : MAT.warningB
  );
  upper.position.y = 0.45;
  upper.castShadow = false; upper.receiveShadow = true;
  grp.add(upper);
  return grp;
}

// platforms[] = collidable scenery. Each entry:
//   { mesh, box: Box3 (live), kind, data, collidable: true|false }
const platforms = [];
// hazards[] = death triggers (lava). Each entry: { mesh, box, kind, data }
const hazards = [];
// triggers[] = checkpoint + finish pads. Each: { mesh, kind, stageId, pos, radius }
const triggers = [];
let currentStage = 0;       // most recent checkpoint stage id (0 = haven't hit one yet)
let checkpointCount = 0;
let stageStarted = 1;       // the stage we're currently IN (cosmetic only)

// decorations[] = non-collidable scenery (clouds, signs, warning posts,
// ground plate, etc.). Kept separate from `platforms[]` so collision /
// trigger code never accidentally interacts with them.
const decorations = [];

function scaffoldMap() {
  for (const stage of MAP.stages) {
    let firstSolid = null;       // remember the first solid platform of the
                                 // stage so we can place the stage sign on it.
    if (stage.platforms) for (const p of stage.platforms) {
      const kind = p.kind || 'solid';
      const color = p.color || '#6bcf6b';
      let entryMesh, baseMesh, group = null;

      if (kind === 'solid') {
        // v4 §18.8: toy-block treatment — base + bright top inset.
        const r = makeToyPlatform({
          pos: p.pos, size: p.size, color,
        });
        scene.add(r.group);
        group = r.group; baseMesh = r.baseMesh;
        // The collidable mesh for AABB queries is the base block; we
        // store the GROUP as the visible "mesh" so future toggles
        // (visibility, scale-pulse) affect the whole thing.
        entryMesh = r.group;
        baseMesh.castShadow = false; baseMesh.receiveShadow = true;
      } else {
        // Non-solid kinds (jumpPad / disappearing / moving) stay as a
        // single Mesh because they need per-frame visibility / position
        // / emissive updates that the multi-mesh toy variant complicates.
        const mat = new THREE.MeshStandardMaterial({
          color, roughness: 0.60, metalness: 0.10,
          emissive: kind === 'jumpPad' ? color :
                    kind === 'moving'  ? darkenHex(color, 0.85) :
                    0x000000,
          emissiveIntensity: kind === 'jumpPad' ? 0.40 : 0.0,
          transparent: kind === 'disappearing',
          opacity:     kind === 'disappearing' ? 1.0 : 1.0,
        });
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(p.size[0], p.size[1], p.size[2]),
          mat
        );
        m.position.set(p.pos[0], p.pos[1], p.pos[2]);
        m.castShadow = (kind === 'moving' || kind === 'jumpPad');  // §18.3 — selective
        m.receiveShadow = true;
        scene.add(m);
        entryMesh = m; baseMesh = m;
      }

      const box = new THREE.Box3().setFromObject(baseMesh);
      // v4.1 hotfix: solid platforms wrap baseMesh in a Group whose
      // world matrix hasn't propagated yet — setFromObject above with
      // `updateParents=false` leaves baseMesh.matrixWorld stale (parent
      // group's matrixWorld is still the identity until the first
      // renderer.render()), so the AABB collapses at world origin and
      // Danny falls through every solid platform. Override the box
      // directly from p.pos + p.size for the SOLID branch — bulletproof
      // and matches the actual rendered position exactly. Non-solid
      // kinds keep using setFromObject; their meshes are added directly
      // to scene with their position set, so the parent matrix is fresh.
      if (kind === 'solid') {
        const hx = p.size[0] / 2, hy = p.size[1] / 2, hz = p.size[2] / 2;
        box.min.set(p.pos[0] - hx, p.pos[1] - hy, p.pos[2] - hz);
        box.max.set(p.pos[0] + hx, p.pos[1] + hy, p.pos[2] + hz);
      }
      const entry = {
        mesh: entryMesh, baseMesh, box,
        kind,
        data: Object.assign({ stageId: stage.id }, p),
        collidable: true,
      };
      if (kind === 'disappearing') entry.data.cycleT = p.phase || 0;
      if (kind === 'moving') {
        // v4 §9.2: store prev position for moving-platform carry.
        entry.prevPos = new THREE.Vector3().copy(entryMesh.position);
        entry.deltaPos = new THREE.Vector3();
      }
      platforms.push(entry);

      // First solid platform = stage entrance — anchor the stage sign here.
      if (firstSolid === null && kind === 'solid') firstSolid = p;
    }

    if (stage.hazards) for (const h of stage.hazards) {
      // Main lava slab (uses shared MAT.lava so all lava bobs in sync).
      const lavaMat = MAT.lava.clone();
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(h.size[0], h.size[1], h.size[2]),
        lavaMat
      );
      m.position.set(h.pos[0], h.pos[1], h.pos[2]);
      m.receiveShadow = true;
      scene.add(m);
      // Brighter top slab that bobs (animated in tickObstacles).
      const topInset = new THREE.Mesh(
        new THREE.BoxGeometry(h.size[0] * 0.95, 0.04, h.size[2] * 0.95),
        MAT.lavaTop.clone()
      );
      topInset.position.set(h.pos[0], h.pos[1] + h.size[1] / 2 + 0.02, h.pos[2]);
      scene.add(topInset);
      // Warning posts at the four CORNERS of the hazard (per §10.2).
      const cx = h.pos[0], cz = h.pos[2];
      const halfW = h.size[0] / 2, halfD = h.size[2] / 2;
      const corners = [
        [cx - halfW, cz - halfD, false],
        [cx + halfW, cz - halfD, true],
        [cx - halfW, cz + halfD, true],
        [cx + halfW, cz + halfD, false],
      ];
      for (const [px, pz, altY] of corners) {
        const post = makeWarningPost(altY);
        // Place the post AT the floor under the hazard's top edge.
        post.position.set(px, h.pos[1] + h.size[1] / 2 + 0.01, pz);
        scene.add(post);
        decorations.push(post);
      }
      const box = new THREE.Box3().setFromObject(m);
      hazards.push({ mesh: m, top: topInset, box, kind: h.kind, data: h });
    }

    if (stage.checkpoint) buildCheckpointPad(stage.checkpoint, stage.id, false);
    if (stage.finish)     buildFinishPad(stage.finish, stage.id);

    // Stage sign on the FIRST solid platform of each stage. We anchor it
    // back-right of the platform center so it doesn't block the path.
    if (firstSolid) {
      const sign = makeStageSign(stage.id, stage.name);
      sign.position.set(
        firstSolid.pos[0] + Math.min(2.5, firstSolid.size[0] / 2 - 0.5),
        firstSolid.pos[1] + firstSolid.size[1] / 2,    // top of platform
        firstSolid.pos[2] + Math.min(2.5, firstSolid.size[2] / 2 - 0.5)
      );
      sign.rotation.y = Math.PI;  // face -Z, toward the player approach
      scene.add(sign);
      decorations.push(sign);
    }
  }
  document.getElementById('ui-total').textContent = MAP.stages.length;
}

function buildCheckpointPad(cp, stageId, lit) {
  // v4: checkpoint = pad disc + glow ring + pole + flag-on-pivot.
  // The flag has its own pivot so it can wave (per §18.15).
  const grp = new THREE.Group();
  grp.position.set(cp.pos[0], cp.pos[1] - 0.02, cp.pos[2]);
  const padCol = cp.color || THEME.checkpoint;
  // pad disc on the floor — octagonal to read as "toy" instead of perfect circle
  const pad = new THREE.Mesh(
    new THREE.CylinderGeometry(1.05, 1.15, 0.10, 8),
    new THREE.MeshStandardMaterial({
      color: padCol, emissive: padCol, emissiveIntensity: 0.45,
      transparent: true, opacity: 0.92
    })
  );
  grp.add(pad);
  // Glow ring — sits flat just above the pad. Pulses scale in tickObstacles.
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(1.25, 0.08, 8, 28),
    new THREE.MeshStandardMaterial({
      color: padCol, emissive: padCol, emissiveIntensity: 0.65,
      transparent: true, opacity: 0.60
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.08;
  grp.add(ring);
  // pole
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.07, 0.09, 1.6, 8),
    MAT.pole
  );
  pole.position.y = 0.80;
  pole.castShadow = true;
  grp.add(pole);
  // Flag pivot — rotation.y on this group makes the flag wave; the flag
  // itself is offset +X so it swings outward from the pole.
  const flagPivot = new THREE.Group();
  flagPivot.position.set(0, 1.35, 0);
  grp.add(flagPivot);
  const flag = new THREE.Mesh(
    new THREE.BoxGeometry(0.55, 0.36, 0.04),
    new THREE.MeshStandardMaterial({
      color: padCol, emissive: padCol, emissiveIntensity: 0.5
    })
  );
  flag.position.set(0.32, 0, 0);
  flag.castShadow = true;
  flagPivot.add(flag);
  scene.add(grp);
  triggers.push({
    mesh: grp, kind: 'checkpoint', stageId,
    pos: new THREE.Vector3(cp.pos[0], cp.pos[1], cp.pos[2]),
    radius: 1.7, pad, ring, pole, flag, flagPivot,
    pulseT: 0, lit,
  });
}

function buildFinishPad(f, stageId) {
  // v4: finish = gold disc + arch pillars + orbital ring of small spheres
  // + spinning octahedron star (per §18.8, §18.12).
  const grp = new THREE.Group();
  grp.position.set(f.pos[0], f.pos[1] - 0.05, f.pos[2]);
  // gold pad
  const pad = new THREE.Mesh(
    new THREE.CylinderGeometry(1.5, 1.6, 0.16, 16),
    MAT.finishGold
  );
  pad.receiveShadow = true;
  grp.add(pad);
  // Two arch pillars flanking the pad (toy-block columns with bright caps).
  for (const sideX of [-1.7, 1.7]) {
    const pillar = new THREE.Mesh(
      new THREE.BoxGeometry(0.30, 3.0, 0.30),
      MAT.finishGold
    );
    pillar.position.set(sideX, 1.5, 0);
    pillar.castShadow = true; pillar.receiveShadow = true;
    grp.add(pillar);
    // cap on top — slightly wider for a finished look
    const cap = new THREE.Mesh(
      new THREE.BoxGeometry(0.50, 0.22, 0.50),
      MAT.finishStar
    );
    cap.position.set(sideX, 3.10, 0);
    cap.castShadow = true;
    grp.add(cap);
  }
  // Orbital ring — InstancedMesh of 6 small spheres rotating around the star
  // (per §18.12 — instancing for repeated decorations).
  const ORBITS = 6;
  const orbitMesh = new THREE.InstancedMesh(GEO.sphereTiny, MAT.finishStar, ORBITS);
  orbitMesh.castShadow = false;
  grp.add(orbitMesh);
  // a glowing octahedron floats over the pad
  const star = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.50, 0),
    MAT.finishStar
  );
  star.position.y = 1.5;
  star.castShadow = true;
  grp.add(star);
  scene.add(grp);
  triggers.push({
    mesh: grp, kind: 'finish', stageId,
    pos: new THREE.Vector3(f.pos[0], f.pos[1], f.pos[2]),
    radius: 2.0, star, orbitMesh, orbitCount: ORBITS,
  });
}

// --------------- per-frame obstacle behaviour ------------------
const _orbDummy = new THREE.Object3D();   // re-used matrix scratch
function tickObstacles(dt) {
  for (const pl of platforms) {
    if (pl.kind === 'disappearing') {
      const d = pl.data;
      const tHold = d.tHold ?? 1.4, tFade = d.tFade ?? 0.3, tCool = d.tCool ?? 1.0;
      const total = tHold + tFade + tCool;
      d.cycleT = (d.cycleT + dt) % total;
      if (d.cycleT < tHold) {
        pl.mesh.visible = true;
        pl.mesh.material.emissive.setHex(0x000000);
        pl.mesh.material.emissiveIntensity = 0;
        pl.collidable = true;
      } else if (d.cycleT < tHold + tFade) {
        // about-to-vanish flash
        pl.mesh.visible = true;
        pl.mesh.material.emissive.setHex(0xff5530);
        pl.mesh.material.emissiveIntensity = 0.3 + 0.5 * Math.sin(d.cycleT * 30);
        pl.collidable = true;
      } else {
        pl.mesh.visible = false;
        pl.collidable = false;
      }
    } else if (pl.kind === 'moving') {
      const d = pl.data;
      const period = d.period || 3.0;
      // smooth sine 0..1
      const k = 0.5 - 0.5 * Math.cos((runT % period) / period * Math.PI * 2);
      // v4 §9.2: cache prev position so the player can be CARRIED.
      pl.prevPos.copy(pl.mesh.position);
      pl.mesh.position.x = d.from[0] + (d.to[0] - d.from[0]) * k;
      pl.mesh.position.y = d.from[1] + (d.to[1] - d.from[1]) * k;
      pl.mesh.position.z = d.from[2] + (d.to[2] - d.from[2]) * k;
      pl.deltaPos.subVectors(pl.mesh.position, pl.prevPos);
      pl.box.setFromObject(pl.mesh);
    } else if (pl.kind === 'jumpPad') {
      pl.mesh.material.emissiveIntensity = 0.30 + 0.25 * Math.sin(runT * 5);
    }
  }
  // Hazards — lava body emissive wobble + brighter top inset bob.
  for (const h of hazards) {
    if (h.kind === 'lava') {
      h.mesh.material.emissiveIntensity = 0.55 + 0.25 * Math.sin(runT * 3);
      if (h.top) {
        h.top.material.emissiveIntensity = 0.80 + 0.40 * Math.sin(runT * 4);
        h.top.position.y = (h.data.pos[1] + h.data.size[1] / 2 + 0.02)
                         + Math.sin(runT * 2.4 + h.data.pos[0] * 0.1) * 0.05;
      }
    }
  }
  // Triggers — finish star + orbital ring; checkpoint pulse + glow ring + flag wave.
  for (const t of triggers) {
    if (t.kind === 'finish' && t.star) {
      t.star.rotation.y += dt * 2.0;
      t.star.rotation.x = Math.sin(runT * 1.2) * 0.20;
      t.star.position.y = 1.5 + Math.sin(runT * 2.4) * 0.18;
      // Orbital ring: re-place each instance around the star.
      if (t.orbitMesh) {
        const R = 1.1, omega = runT * 1.2;
        for (let i = 0; i < t.orbitCount; i++) {
          const a = omega + (i / t.orbitCount) * Math.PI * 2;
          _orbDummy.position.set(Math.cos(a) * R, 1.5 + Math.sin(a * 1.5) * 0.18, Math.sin(a) * R);
          _orbDummy.updateMatrix();
          t.orbitMesh.setMatrixAt(i, _orbDummy.matrix);
        }
        t.orbitMesh.instanceMatrix.needsUpdate = true;
      }
    }
    if (t.kind === 'checkpoint') {
      // pulse on activation
      if (t.pulseT > 0) {
        t.pulseT = Math.max(0, t.pulseT - dt);
        const k = t.pulseT / 0.6;
        const scale = 1.0 + k * 0.6;
        t.pad.scale.set(scale, 1, scale);
      } else {
        t.pad.scale.set(1, 1, 1);
      }
      // Glow ring — gentle sin-pulse on scale + opacity. Lit pads pulse stronger.
      const ringK = t.lit ? 0.18 : 0.08;
      const ringS = 1.0 + Math.sin(runT * 2 + t.stageId) * ringK;
      t.ring.scale.set(ringS, ringS, 1);
      t.ring.material.opacity = (t.lit ? 0.75 : 0.45) + Math.sin(runT * 2.3 + t.stageId) * 0.12;
      // Flag wave — sin oscillation on the pivot's Y rotation (about the pole)
      // + slight tilt for a more alive feel.
      t.flagPivot.rotation.y = Math.sin(runT * 3 + t.stageId * 0.7) * 0.10;
      if (t.lit) {
        t.flag.position.y = Math.sin(runT * 2 + t.stageId) * 0.05;
      }
    }
  }
}

// ============================================================
//   Set dressing — clouds + distant ground plate (per §18.11)
// ============================================================
function buildSetDressing() {
  // 1. HUGE faint ground plate FAR below so void reads as "haze" not
  //    "renderer void." Uses MeshBasicMaterial so it doesn't catch the
  //    sun and look weirdly lit.
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(600, 800),
    new THREE.MeshBasicMaterial({ color: lightenHex(THEME.sky, -0.08), fog: true })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(0, -20, -200);     // centered roughly under the obby
  scene.add(ground);
  decorations.push(ground);

  // 2. Cloud puffs scattered around / above the play volume. The whole
  //    obby runs from z≈+5 → z≈-460. Place ~14 clouds along that range,
  //    on either side and above.
  const CLOUD_COUNT = Math.round(14 * GRAPHICS.decorativeDensity);
  for (let i = 0; i < CLOUD_COUNT; i++) {
    const c = makeCloudPuff();
    const z = 8 - Math.random() * 480;
    const x = (Math.random() - 0.5) * 50;
    const y = 18 + Math.random() * 12;
    c.position.set(x, y, z);
    c.rotation.y = Math.random() * Math.PI;
    scene.add(c);
    decorations.push(c);
  }
}

// ============ AUDIO ==================================================
// Lifted/adapted from runner. Web Audio synthesis only — no MP3s for
// Phase 2. Lazy init on first user gesture (iOS Safari).
const AUDIO = { ctx: null, master: null, sfxGain: null, initialized: false, unlocked: false,
                master_vol: 0.7, sfx_vol: 0.65 };
function initAudio() {
  if (AUDIO.initialized) return;
  try {
    AUDIO.ctx = new (window.AudioContext || window.webkitAudioContext)();
    AUDIO.master = AUDIO.ctx.createGain(); AUDIO.master.gain.value = AUDIO.master_vol;
    AUDIO.master.connect(AUDIO.ctx.destination);
    AUDIO.sfxGain = AUDIO.ctx.createGain(); AUDIO.sfxGain.gain.value = AUDIO.sfx_vol;
    AUDIO.sfxGain.connect(AUDIO.master);
    AUDIO.initialized = true;
  } catch (e) { console.warn('audio init failed', e); }
}
function unlockAudio() {
  if (AUDIO.unlocked) return;
  initAudio();
  if (!AUDIO.ctx) return;
  if (AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume().catch(()=>{});
  // warm the iOS AVAudioSession with a 1-frame silent buffer
  try {
    const buf = AUDIO.ctx.createBuffer(1, 1, 22050);
    const src = AUDIO.ctx.createBufferSource();
    src.buffer = buf; src.connect(AUDIO.master); src.start(0);
  } catch (_) {}
  AUDIO.unlocked = true;
}
function tone(freq, dur, type = 'sine', vol = 0.5, attack = 0.005, decay = 0.06) {
  if (!AUDIO.unlocked) return;
  const ctx = AUDIO.ctx, t0 = ctx.currentTime;
  const osc = ctx.createOscillator(); osc.type = type; osc.frequency.value = freq;
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(g); g.connect(AUDIO.sfxGain);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.3, hp = 800) {
  if (!AUDIO.unlocked) return;
  const ctx = AUDIO.ctx, sr = ctx.sampleRate;
  const buf = ctx.createBuffer(1, Math.floor(sr * dur), sr);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain(); g.gain.value = vol;
  const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  src.connect(f); f.connect(g); g.connect(AUDIO.sfxGain);
  src.start(0);
}
function sfx(name) {
  switch (name) {
    case 'jump':     tone(540, 0.10, 'square', 0.30); tone(720, 0.10, 'sine', 0.18, 0.02); break;
    case 'land':     noise(0.08, 0.18, 400); tone(180, 0.06, 'sine', 0.18); break;
    case 'checkpoint': tone(720, 0.10, 'triangle', 0.35); setTimeout(() => tone(1080, 0.16, 'triangle', 0.32), 90); break;
    case 'respawn': tone(720, 0.08, 'sine', 0.30); setTimeout(() => tone(540, 0.08, 'sine', 0.28), 80);
                     setTimeout(() => tone(360, 0.18, 'sine', 0.30), 160); break;
    case 'hit':      noise(0.18, 0.35, 200); tone(120, 0.12, 'sawtooth', 0.40); break;
    case 'gameover': tone(220, 0.30, 'sawtooth', 0.30); setTimeout(() => tone(110, 0.40, 'sawtooth', 0.35), 220); break;
    case 'win':      tone(540, 0.10, 'triangle', 0.35); setTimeout(() => tone(720, 0.10, 'triangle', 0.35), 110);
                     setTimeout(() => tone(900, 0.10, 'triangle', 0.35), 220);
                     setTimeout(() => tone(1200, 0.30, 'triangle', 0.35), 330); break;
  }
}

const input = { w: false, a: false, s: false, d: false };
let pointerDown = false, lookActive = false, lookId = -1, lookLX = 0, lookLY = 0;

// v4 Pass B-lite: jump uses coyote + jump-buffer + variable height per §9.1.
function doJump() {
  if (state !== 'play') return;
  player.jumpHeld = true;
  if (player.onGround || player.coyoteTimer < TUNING.coyoteTime) {
    player.vel.y = JUMP_V0;
    player.onGround = false;
    player.coyoteTimer = TUNING.coyoteTime + 1;   // disable until next landing
    player.jumpBuffer = 0;
    sfx('jump');
  } else {
    // Pressed too early — buffer so it fires automatically on landing.
    player.jumpBuffer = TUNING.jumpBufferTime;
  }
}
function releaseJump() {
  player.jumpHeld = false;
  // Variable height — release-early cuts the upward velocity.
  if (state === 'play' && player.vel.y > 0) player.vel.y *= TUNING.jumpCutMultiplier;
}

window.addEventListener('keydown', e => {
  unlockAudio();
  // v4.5: review mode toggle / pose hotkeys must run BEFORE the state
  // guard below (so they work even when state !== 'play').
  if (e.key === 'c' || e.key === 'C') {
    if (state === 'review') exitReview(); else enterReview();
    return;
  }
  if (state === 'review') {
    if (e.key === 'Escape') { exitReview(); return; }
    if (/^[1-5]$/.test(e.key)) { setReviewPose(parseInt(e.key, 10)); return; }
    return;     // swallow everything else while reviewing
  }
  if (state !== 'play') return;
  if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp')    input.w = true;
  else if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft')  input.a = true;
  else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown')  input.s = true;
  else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') input.d = true;
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); doJump(); }
});
window.addEventListener('keyup', e => {
  if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp')    input.w = false;
  else if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft')  input.a = false;
  else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown')  input.s = false;
  else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') input.d = false;
  else if (e.key === ' '  || e.key === 'Enter') releaseJump();
  else if (e.key === 'F3' || e.key === 'f3') {

});

// Detect touch and turn on the touch UI. Stick: left half. Look: right half.
// Jump: bottom-right button.
let stickX = 0, stickY = 0;        // normalized [-1, +1]
let stickActive = false, stickId = -1, stickCX = 0, stickCY = 0;

const stickZone = document.getElementById('stickZone');
const stickBase = document.getElementById('stickBase');
const stickKnob = document.getElementById('stickKnob');
const lookZone  = document.getElementById('lookZone');
const jumpBtn   = document.getElementById('jumpBtn');

function placeStickAt(clientX, clientY) {
  // Anchor the base where the finger touched down, and put the knob centered.
  const rect = stickZone.getBoundingClientRect();
  stickCX = clientX - rect.left;
  stickCY = clientY - rect.top;
  stickBase.style.left = (stickCX - 55) + 'px';
  stickBase.style.top  = (stickCY - 55) + 'px';
  stickKnob.style.left = (stickCX - 28) + 'px';
  stickKnob.style.top  = (stickCY - 28) + 'px';
}
function updateStickAt(clientX, clientY) {
  const rect = stickZone.getBoundingClientRect();
  const x = clientX - rect.left - stickCX;
  const y = clientY - rect.top  - stickCY;
  const maxR = 55;
  const r = Math.min(maxR, Math.sqrt(x*x + y*y));
  const ang = Math.atan2(y, x);
  const kx = Math.cos(ang) * r, ky = Math.sin(ang) * r;
  stickKnob.style.left = (stickCX + kx - 28) + 'px';
  stickKnob.style.top  = (stickCY + ky - 28) + 'px';
  stickX = kx / maxR;
  stickY = ky / maxR;
}
function resetStick() {
  stickActive = false; stickId = -1; stickX = 0; stickY = 0;
  stickZone.classList.remove('live');
  // hide knob/base by leaving in place at low opacity
}

stickZone.addEventListener('pointerdown', e => {

  e.preventDefault();
  document.body.dataset.touch = '1';

  stickActive = true; stickId = e.pointerId;

});
stickZone.addEventListener('pointermove', e => {

});
stickZone.addEventListener('pointerup', e => {

});
