<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9fd8ff">
<title>Super Dude OBBY v2 — Phase 2 Scaffold</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; height: 100%; background: #9fd8ff; overflow: hidden;
    font-family: system-ui, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#game { background: #9fd8ff; width: 100vw; height: 100vh; display: block; }

  /* HUD overlay shell — patterned after runner v34. */
  #ui { position: fixed; inset: 0; pointer-events: none;
        font-family: system-ui, "Segoe UI", sans-serif; }
  #topbar { position: absolute; top: 8px; left: 8px; right: 8px;
            background: rgba(20,24,38,0.74); border-radius: 10px; padding: 8px 12px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .row { display: flex; justify-content: space-between; align-items: center; color: #e8ecf3; }
  .row + .row { margin-top: 4px; }
  .lbl { font-weight: 700; font-size: 16px; }
  .lbl.big { font-size: 22px; color: #ffd23a; text-shadow: 0 0 10px rgba(255,210,58,0.45); }
  .lbl.dim { color: #9aa0c4; font-weight: 600; font-size: 13px; }
  .lbl.cyan { color: #46f0ff; }
  .bar { height: 4px; background: rgba(255,210,58,0.20); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: linear-gradient(to right, #46f0ff, #ffd23a); transition: width .2s linear;
               box-shadow: 0 0 10px rgba(255,210,58,0.5); }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
             flex-direction: column; background: rgba(10,12,20,0.86); color: #fff; pointer-events: auto; cursor: pointer; }
  #overlay.on { display: flex; }
  #overlay h1 { margin: 0; font-size: 48px; letter-spacing: 2px; color: #ffd23a;
                text-shadow: 0 0 16px rgba(255,210,58,0.5); }
  #overlay h2 { margin: 6px 0 12px; font-size: 28px; color: #e8a516; }
  #overlay p  { margin: 4px 0; color: #cfd6e4; }
  #overlay .blink { margin-top: 24px; font-size: 18px; opacity: .9; }
  #hint { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center;
          color: #15192a; font-size: 12px; pointer-events: none; opacity: 0.85; }

  /* ---------- mobile touch controls (only shown on touch-capable) ---------- */
  body:not([data-touch]) #touchUI { display: none; }
  #touchUI { position: fixed; inset: 0; pointer-events: none; z-index: 12; }
  #stickZone { position: absolute; left: 0; bottom: 0; width: 50vw; height: 55vh;
               pointer-events: auto; }
  #stickBase, #stickKnob { position: absolute; border-radius: 50%;
               background: rgba(20,24,38,0.30); border: 2px solid rgba(255,255,255,0.45);
               box-shadow: 0 2px 12px rgba(0,0,0,0.3);
               transition: opacity .15s; opacity: 0.45; }
  #stickBase { width: 110px; height: 110px; }
  #stickKnob { width: 56px; height: 56px; background: rgba(255,255,255,0.85); border: 2px solid rgba(20,24,38,0.6); }
  #stickZone.live #stickBase, #stickZone.live #stickKnob { opacity: 1.0; }
  #jumpBtn { position: absolute; right: 22px; bottom: 28px; width: 92px; height: 92px;
             border-radius: 50%; background: rgba(70,240,255,0.78); border: 3px solid #fff;
             color: #15192a; font-weight: 900; font-size: 18px; letter-spacing: 2px;
             box-shadow: 0 4px 14px rgba(0,0,0,0.35); pointer-events: auto;
             display: flex; align-items: center; justify-content: center; user-select: none;
             touch-action: none; -webkit-touch-callout: none; }
  #jumpBtn:active, #jumpBtn.live { background: #ffd23a; transform: scale(0.94); }
  #lookZone { position: absolute; right: 0; top: 0; width: 50vw; bottom: 0; pointer-events: auto; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="ui">
  <div id="topbar">
    <div class="row">
      <span class="lbl big">STAGE <span id="ui-stage">1</span><span style="color:#9aa0c4"> / </span><span id="ui-total" style="color:#9aa0c4">1</span></span>
      <span class="lbl"><span style="color:#9aa0c4">CHECKPOINT</span> <span id="ui-cp" class="cyan">0</span></span>
    </div>
    <div class="row">
      <span class="lbl dim">TIME <span id="ui-time">0:00</span></span>
      <span class="lbl dim">v2 &nbsp;•&nbsp; <span id="vsize">—</span></span>
    </div>
    <div class="bar"><div id="ui-prog" style="width:0%"></div></div>
  </div>
  <div id="overlay">
    <h1 id="ov-h1">YOU MADE IT!</h1>
    <h2 id="ov-h2"></h2>
    <p id="ov-p1"></p>
    <p id="ov-p2"></p>
    <div class="blink" id="ov-cta">TAP TO PLAY AGAIN</div>
  </div>
  <div id="hint">drag right side = look · left side = move · JUMP = jump</div>
</div>

<div id="touchUI">
  <div id="stickZone">
    <div id="stickBase"></div>
    <div id="stickKnob"></div>
  </div>
  <div id="lookZone"></div>
  <button id="jumpBtn" type="button">JUMP</button>
</div>

<script type="module">
import * as THREE from 'three';

// ============ RENDERER / SCENE / LIGHTING ============================
// Lifted from proto/runner/index.html boot block. Trimmed for OBBY:
// bright sky background, warm sun, no specimen-tube point lights.
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd8ff);
scene.fog = new THREE.Fog(0x9fd8ff, 35, 160);

// PMREM env — a small canvas gradient so PBR materials read correctly.
const envCanvas = document.createElement('canvas');
envCanvas.width = 32; envCanvas.height = 32;
{
  const g = envCanvas.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 32);
  grad.addColorStop(0, '#fff5d8');
  grad.addColorStop(0.5, '#9fd8ff');
  grad.addColorStop(1, '#6bcf6b');
  g.fillStyle = grad; g.fillRect(0, 0, 32, 32);
}
const envTex = new THREE.CanvasTexture(envCanvas);
envTex.mapping = THREE.EquirectangularReflectionMapping;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(envTex).texture;

// Lights — warm sun + cool fill (OBBY palette).
const ambient = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff4d8, 1.55);
sun.position.set(8, 16, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
sun.shadow.camera.top = 25; sun.shadow.camera.bottom = -25;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0008;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fd8ff, 0.45);
fill.position.set(-6, 8, -4);
scene.add(fill);

// ============ CAMERA =================================================
// Orbit-follow: azim/elev/radius captured from input; target = player +
// head-height offset; lerp toward the desired position each frame.
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 240);
let azim = 0.0;          // radians, around +Y
let elev = 0.35;         // radians, above horizon
let radius = 7.0;        // distance from target
const camPos  = new THREE.Vector3();
const camTgt  = new THREE.Vector3();
const camWish = new THREE.Vector3();
function updateCamera(dt) {
  // Desired look target: head height of the player.
  const tx = player.pos.x;
  const ty = player.pos.y + 1.0;
  const tz = player.pos.z;
  // Desired camera position from spherical coords.
  const cx = tx + Math.cos(elev) * Math.sin(azim) * radius;
  const cy = ty + Math.sin(elev) * radius;
  const cz = tz + Math.cos(elev) * Math.cos(azim) * radius;
  camWish.set(cx, cy, cz);
  const k = Math.min(1, dt * 9);
  camPos.lerp(camWish, k);
  camTgt.lerp({ x: tx, y: ty, z: tz }, k);
  camera.position.copy(camPos);
  camera.lookAt(camTgt);
}

// ============ DANNY RIG ==============================================
// Hand-built from primitives. Wrapped in a yaw group so we can rotate
// the whole figure to face wishDir.
const danny = new THREE.Group();    // visual root, rotated to face wishDir
function buildDanny() {
  const skin     = new THREE.MeshStandardMaterial({ color: 0xf0c8a0, metalness: 0.05, roughness: 0.7 });
  const coat     = new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.15, roughness: 0.55 });
  const shirt    = new THREE.MeshStandardMaterial({ color: 0xc8d0dc, metalness: 0.45, roughness: 0.45 });
  const pants    = new THREE.MeshStandardMaterial({ color: 0x3a4a6a, metalness: 0.20, roughness: 0.55 });
  const sneaker  = new THREE.MeshStandardMaterial({ color: 0x1a2030, metalness: 0.35, roughness: 0.50 });
  const cap      = new THREE.MeshStandardMaterial({ color: 0xd33a3a, metalness: 0.20, roughness: 0.45 });
  const eyeWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const eyeDark  = new THREE.MeshStandardMaterial({ color: 0x1a2030 });

  // helper to add a mesh
  function add(geom, mat, x, y, z, rx=0, ry=0, rz=0) {
    const m = new THREE.Mesh(geom, mat);
    m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
    m.castShadow = true; m.receiveShadow = true;
    danny.add(m); return m;
  }

  // LEGS (cylinders + sneaker boxes)
  add(new THREE.CylinderGeometry(0.16, 0.16, 0.85, 12), pants,   -0.18, 0.42, 0);
  add(new THREE.CylinderGeometry(0.16, 0.16, 0.85, 12), pants,    0.18, 0.42, 0);
  add(new THREE.BoxGeometry(0.30, 0.16, 0.50), sneaker,           -0.18, 0.08, 0.05);
  add(new THREE.BoxGeometry(0.30, 0.16, 0.50), sneaker,            0.18, 0.08, 0.05);
  // sneaker stripes
  const stripeMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  add(new THREE.BoxGeometry(0.31, 0.04, 0.50), stripeMat, -0.18, 0.10, 0.05);
  add(new THREE.BoxGeometry(0.31, 0.04, 0.50), stripeMat,  0.18, 0.10, 0.05);

  // TORSO — silver undershirt + white lab coat slab over front
  add(new THREE.BoxGeometry(0.62, 0.85, 0.42), shirt, 0, 1.18, 0);
  add(new THREE.BoxGeometry(0.66, 0.85, 0.05), coat,  0, 1.18, 0.22);
  // lab-coat hem
  add(new THREE.BoxGeometry(0.74, 0.32, 0.46), coat,  0, 0.84, 0);

  // ARMS — cylinder + small hand sphere
  const armGeom = new THREE.CylinderGeometry(0.10, 0.10, 0.78, 10);
  add(armGeom, coat, -0.44, 1.20, 0);
  add(armGeom, coat,  0.44, 1.20, 0);
  const handGeom = new THREE.SphereGeometry(0.13, 14, 10);
  add(handGeom, skin, -0.44, 0.75, 0);
  add(handGeom, skin,  0.44, 0.75, 0);

  // HEAD — sphere with skin tone
  const headY = 1.92;
  add(new THREE.SphereGeometry(0.28, 18, 14), skin, 0, headY, 0);
  // eyes
  add(new THREE.SphereGeometry(0.055, 10, 8), eyeWhite, -0.10, headY + 0.04, 0.22);
  add(new THREE.SphereGeometry(0.055, 10, 8), eyeWhite,  0.10, headY + 0.04, 0.22);
  add(new THREE.SphereGeometry(0.028, 8, 6),  eyeDark,  -0.10, headY + 0.03, 0.26);
  add(new THREE.SphereGeometry(0.028, 8, 6),  eyeDark,   0.10, headY + 0.03, 0.26);
  // mouth (small dark box for a smirk)
  add(new THREE.BoxGeometry(0.16, 0.03, 0.04), eyeDark, 0, headY - 0.10, 0.25);
  // hair tuft (small dark sphere on the back-top, peeking out from under the cap)
  const hairMat = new THREE.MeshStandardMaterial({ color: 0x3a2418 });
  add(new THREE.SphereGeometry(0.12, 10, 8), hairMat, 0, headY + 0.18, -0.18);

  // CAP — worn BACKWARDS (brim behind). Dome = squashed sphere; brim = thin box behind.
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.31, 18, 14, 0, Math.PI*2, 0, Math.PI*0.55), cap);
  dome.position.set(0, headY + 0.18, 0);
  dome.castShadow = true; danny.add(dome);
  const brim = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.04, 0.22), cap);
  brim.position.set(0, headY + 0.12, -0.28);
  brim.rotation.x = 0.10;
  brim.castShadow = true; danny.add(brim);
  // gold SD patch on the front of the cap
  const patchMat = new THREE.MeshStandardMaterial({ color: 0xffd23a, emissive: 0xffd23a, emissiveIntensity: 0.18 });
  const patch = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.10, 0.02), patchMat);
  patch.position.set(0, headY + 0.18, 0.30);
  danny.add(patch);

  // Drop shadow under feet
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.55, 24),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32 })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.02;
  shadow.renderOrder = -1;
  danny.userData.shadow = shadow;
  scene.add(shadow);
}
buildDanny();
scene.add(danny);

// ============ PLAYER STATE + PHYSICS CONSTANTS =======================
const GRAV = 18, JUMP_V0 = 7.0, WALK_SPEED = 8.0;
const player = {
  pos: new THREE.Vector3(0, 2, 0),
  vel: new THREE.Vector3(0, 0, 0),
  yaw: 0,
  onGround: false,
  radius: 0.4,
  halfH: 0.70,           // capsule axis half-length (exclusive of radius caps)
};
let lastCheckpointPos = player.pos.clone();
let state = 'play';      // 'play' | 'respawning' | 'won'
let dieT = 0;
const dieStartPos = new THREE.Vector3();
let runT = 0;
let timeSec = 0;

// ============ PLATFORMS (Phase 2 = single test platform) =============
// platforms[] is the source of truth for collision. Each entry:
// { mesh, box: THREE.Box3, kind: 'solid' | ... , data: {...} }
const platforms = [];
function addBoxPlatform(cx, cy, cz, sx, sy, sz, color, kind = 'solid') {
  const geom = new THREE.BoxGeometry(sx, sy, sz);
  const mat = new THREE.MeshStandardMaterial({ color, metalness: 0.10, roughness: 0.65 });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(cx, cy, cz);
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  scene.add(mesh);
  const box = new THREE.Box3().setFromObject(mesh);
  platforms.push({ mesh, box, kind, data: {} });
  return mesh;
}

// Phase 2 test platform — 8×1×8 green slab, top face at y=0.
addBoxPlatform(0, -0.5, 0, 8, 1, 8, 0x6bcf6b, 'solid');
// "START" decal — small yellow box near the +Z edge to indicate the spawn.
{
  const decal = new THREE.Mesh(
    new THREE.BoxGeometry(2.0, 0.06, 0.5),
    new THREE.MeshStandardMaterial({ color: 0xffd23a, emissive: 0xffd23a, emissiveIntensity: 0.20 })
  );
  decal.position.set(0, 0.03, 2.5);
  decal.receiveShadow = true;
  scene.add(decal);
}

// ============ AUDIO ==================================================
// Lifted/adapted from runner. Web Audio synthesis only — no MP3s for
// Phase 2. Lazy init on first user gesture (iOS Safari).
const AUDIO = { ctx: null, master: null, sfxGain: null, initialized: false, unlocked: false,
                master_vol: 0.7, sfx_vol: 0.65 };
function initAudio() {
  if (AUDIO.initialized) return;
  try {
    AUDIO.ctx = new (window.AudioContext || window.webkitAudioContext)();
    AUDIO.master = AUDIO.ctx.createGain(); AUDIO.master.gain.value = AUDIO.master_vol;
    AUDIO.master.connect(AUDIO.ctx.destination);
    AUDIO.sfxGain = AUDIO.ctx.createGain(); AUDIO.sfxGain.gain.value = AUDIO.sfx_vol;
    AUDIO.sfxGain.connect(AUDIO.master);
    AUDIO.initialized = true;
  } catch (e) { console.warn('audio init failed', e); }
}
function unlockAudio() {
  if (AUDIO.unlocked) return;
  initAudio();
  if (!AUDIO.ctx) return;
  if (AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume().catch(()=>{});
  // warm the iOS AVAudioSession with a 1-frame silent buffer
  try {
    const buf = AUDIO.ctx.createBuffer(1, 1, 22050);
    const src = AUDIO.ctx.createBufferSource();
    src.buffer = buf; src.connect(AUDIO.master); src.start(0);
  } catch (_) {}
  AUDIO.unlocked = true;
}
function tone(freq, dur, type = 'sine', vol = 0.5, attack = 0.005, decay = 0.06) {
  if (!AUDIO.unlocked) return;
  const ctx = AUDIO.ctx, t0 = ctx.currentTime;
  const osc = ctx.createOscillator(); osc.type = type; osc.frequency.value = freq;
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(g); g.connect(AUDIO.sfxGain);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.3, hp = 800) {
  if (!AUDIO.unlocked) return;
  const ctx = AUDIO.ctx, sr = ctx.sampleRate;
  const buf = ctx.createBuffer(1, Math.floor(sr * dur), sr);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain(); g.gain.value = vol;
  const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  src.connect(f); f.connect(g); g.connect(AUDIO.sfxGain);
  src.start(0);
}
function sfx(name) {
  switch (name) {
    case 'jump':     tone(540, 0.10, 'square', 0.30); tone(720, 0.10, 'sine', 0.18, 0.02); break;
    case 'land':     noise(0.08, 0.18, 400); tone(180, 0.06, 'sine', 0.18); break;
    case 'checkpoint': tone(720, 0.10, 'triangle', 0.35); setTimeout(() => tone(1080, 0.16, 'triangle', 0.32), 90); break;
    case 'respawn': tone(720, 0.08, 'sine', 0.30); setTimeout(() => tone(540, 0.08, 'sine', 0.28), 80);
                     setTimeout(() => tone(360, 0.18, 'sine', 0.30), 160); break;
    case 'hit':      noise(0.18, 0.35, 200); tone(120, 0.12, 'sawtooth', 0.40); break;
    case 'gameover': tone(220, 0.30, 'sawtooth', 0.30); setTimeout(() => tone(110, 0.40, 'sawtooth', 0.35), 220); break;
    case 'win':      tone(540, 0.10, 'triangle', 0.35); setTimeout(() => tone(720, 0.10, 'triangle', 0.35), 110);
                     setTimeout(() => tone(900, 0.10, 'triangle', 0.35), 220);
                     setTimeout(() => tone(1200, 0.30, 'triangle', 0.35), 330); break;
  }
}

// ============ INPUT — keyboard + mouse ===============================
const input = { w: false, a: false, s: false, d: false };
let pointerDown = false, lookActive = false, lookId = -1, lookLX = 0, lookLY = 0;

function doJump() {
  if (state !== 'play') return;
  if (player.onGround) {
    player.vel.y = JUMP_V0;
    player.onGround = false;
    sfx('jump');
  }
}

window.addEventListener('keydown', e => {
  unlockAudio();
  if (state !== 'play') return;
  if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp')    input.w = true;
  else if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft')  input.a = true;
  else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown')  input.s = true;
  else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') input.d = true;
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); doJump(); }
});
window.addEventListener('keyup', e => {
  if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp')    input.w = false;
  else if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft')  input.a = false;
  else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown')  input.s = false;
  else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') input.d = false;
});

// Mouse drag on the canvas → camera orbit. Wheel → zoom.
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') return;     // touch is handled separately
  pointerDown = true; lookActive = true; lookLX = e.clientX; lookLY = e.clientY;
  unlockAudio();
});
window.addEventListener('pointermove', e => {
  if (!pointerDown || e.pointerType === 'touch') return;
  const dx = e.clientX - lookLX, dy = e.clientY - lookLY;
  azim -= dx * 0.006;
  elev = Math.max(-0.6, Math.min(1.30, elev - dy * 0.006));
  lookLX = e.clientX; lookLY = e.clientY;
});
window.addEventListener('pointerup', e => {
  if (e.pointerType === 'touch') return;
  pointerDown = false; lookActive = false;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  radius = Math.max(3.5, Math.min(16, radius + e.deltaY * 0.005));
}, { passive: false });

// On overlay tap (won state): restart.
document.getElementById('overlay').addEventListener('click', () => {
  if (state === 'won') reset();
});

// ============ INPUT — mobile touch controls ==========================
// Detect touch and turn on the touch UI. Stick: left half. Look: right half.
// Jump: bottom-right button.
let stickX = 0, stickY = 0;        // normalized [-1, +1]
let stickActive = false, stickId = -1, stickCX = 0, stickCY = 0;

const stickZone = document.getElementById('stickZone');
const stickBase = document.getElementById('stickBase');
const stickKnob = document.getElementById('stickKnob');
const lookZone  = document.getElementById('lookZone');
const jumpBtn   = document.getElementById('jumpBtn');

function placeStickAt(clientX, clientY) {
  // Anchor the base where the finger touched down, and put the knob centered.
  const rect = stickZone.getBoundingClientRect();
  stickCX = clientX - rect.left;
  stickCY = clientY - rect.top;
  stickBase.style.left = (stickCX - 55) + 'px';
  stickBase.style.top  = (stickCY - 55) + 'px';
  stickKnob.style.left = (stickCX - 28) + 'px';
  stickKnob.style.top  = (stickCY - 28) + 'px';
}
function updateStickAt(clientX, clientY) {
  const rect = stickZone.getBoundingClientRect();
  const x = clientX - rect.left - stickCX;
  const y = clientY - rect.top  - stickCY;
  const maxR = 55;
  const r = Math.min(maxR, Math.sqrt(x*x + y*y));
  const ang = Math.atan2(y, x);
  const kx = Math.cos(ang) * r, ky = Math.sin(ang) * r;
  stickKnob.style.left = (stickCX + kx - 28) + 'px';
  stickKnob.style.top  = (stickCY + ky - 28) + 'px';
  stickX = kx / maxR;
  stickY = ky / maxR;
}
function resetStick() {
  stickActive = false; stickId = -1; stickX = 0; stickY = 0;
  stickZone.classList.remove('live');
  // hide knob/base by leaving in place at low opacity
}

stickZone.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
  e.preventDefault();
  document.body.dataset.touch = '1';
  unlockAudio();
  stickActive = true; stickId = e.pointerId;
  stickZone.classList.add('live');
  placeStickAt(e.clientX, e.clientY);
  try { stickZone.setPointerCapture(e.pointerId); } catch (_) {}
});
stickZone.addEventListener('pointermove', e => {
  if (!stickActive || e.pointerId !== stickId) return;
  e.preventDefault();
  updateStickAt(e.clientX, e.clientY);
});
stickZone.addEventListener('pointerup', e => {
  if (e.pointerId !== stickId) return;
  e.preventDefault();
  resetStick();
});
stickZone.addEventListener('pointercancel', () => resetStick());

// look-drag — right half
lookZone.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
  e.preventDefault();
  document.body.dataset.touch = '1';
  unlockAudio();
  lookActive = true; lookId = e.pointerId; lookLX = e.clientX; lookLY = e.clientY;
  try { lookZone.setPointerCapture(e.pointerId); } catch (_) {}
});
lookZone.addEventListener('pointermove', e => {
  if (!lookActive || e.pointerId !== lookId) return;
  e.preventDefault();
  const dx = e.clientX - lookLX, dy = e.clientY - lookLY;
  azim -= dx * 0.008;
  elev = Math.max(-0.6, Math.min(1.30, elev - dy * 0.008));
  lookLX = e.clientX; lookLY = e.clientY;
});
lookZone.addEventListener('pointerup', e => {
  if (e.pointerId !== lookId) return;
  e.preventDefault();
  lookActive = false; lookId = -1;
});
lookZone.addEventListener('pointercancel', () => { lookActive = false; lookId = -1; });

jumpBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  document.body.dataset.touch = '1';
  unlockAudio();
  jumpBtn.classList.add('live');
  doJump();
});
jumpBtn.addEventListener('pointerup', () => { jumpBtn.classList.remove('live'); });
jumpBtn.addEventListener('pointercancel', () => { jumpBtn.classList.remove('live'); });

// ============ COLLISION ==============================================
// Resolve a vertical capsule (center=player.pos, radius=r, halfH=h)
// against a box AABB by post-move separating-axis correction.
const _tmpPt = new THREE.Vector3();
function resolveCapsuleVsBox(box) {
  const r = player.radius;
  const halfH = player.halfH;
  // Capsule axis segment: from (pos - (0,h,0)) to (pos + (0,h,0)).
  // The closest point on the capsule's axis to a box is the player's pos.x/z
  // clamped INTO the box's xz, with y picked as the closest point on the
  // segment to the box's y-range. For simplicity (and at our speeds), we
  // pick the y on the axis nearest the box's y center.
  const axisY = Math.max(box.min.y, Math.min(player.pos.y, box.max.y));
  const ax = player.pos.x;
  const ay = Math.max(player.pos.y - halfH, Math.min(axisY, player.pos.y + halfH));
  const az = player.pos.z;
  // Closest point on box to (ax, ay, az):
  _tmpPt.set(
    Math.max(box.min.x, Math.min(ax, box.max.x)),
    Math.max(box.min.y, Math.min(ay, box.max.y)),
    Math.max(box.min.z, Math.min(az, box.max.z))
  );
  // Vector from box-closest-point to capsule axis point.
  const dx = ax - _tmpPt.x, dy = ay - _tmpPt.y, dz = az - _tmpPt.z;
  const distSq = dx*dx + dy*dy + dz*dz;
  if (distSq >= r * r) return false;
  const dist = Math.sqrt(distSq) || 1e-6;
  const pen = r - dist;
  // Push the player out along the contact normal.
  const nx = dx / dist, ny = dy / dist, nz = dz / dist;
  player.pos.x += nx * pen;
  player.pos.y += ny * pen;
  player.pos.z += nz * pen;
  // If the contact normal points mostly +Y, we landed on top.
  if (ny > 0.6) {
    if (player.vel.y < 0) {
      if (!player.onGround) sfx('land');
      player.vel.y = 0;
    }
    player.onGround = true;
    return true;
  }
  // Side contact — kill horizontal velocity in the normal direction.
  if (Math.abs(nx) > 0.5 || Math.abs(nz) > 0.5) {
    const vDotN = player.vel.x * nx + player.vel.z * nz;
    if (vDotN < 0) {
      player.vel.x -= vDotN * nx;
      player.vel.z -= vDotN * nz;
    }
  }
  // Hit ceiling — kill upward velocity.
  if (ny < -0.6 && player.vel.y > 0) player.vel.y = 0;
  return true;
}

// ============ STEP =================================================
function stepPlay(dt) {
  // 1. Build wishDir in camera-yaw space.
  // forward direction projected onto XZ: (-sin(azim), 0, -cos(azim)) (camera looks toward -azim).
  const fx = -Math.sin(azim), fz = -Math.cos(azim);
  const rx =  Math.cos(azim), rz = -Math.sin(azim);
  // Move axis combines keyboard WASD + touch joystick (whichever is non-zero).
  let mx = 0, mz = 0;
  if (input.w) mz += 1;
  if (input.s) mz -= 1;
  if (input.d) mx += 1;
  if (input.a) mx -= 1;
  if (stickX || stickY) {
    // stick y is screen-down +1 = into screen (forward), so mz = -stickY.
    mx += stickX;
    mz += -stickY;
  }
  const ml = Math.hypot(mx, mz);
  if (ml > 1) { mx /= ml; mz /= ml; }
  const wishX = (fx * mz + rx * mx) * WALK_SPEED;
  const wishZ = (fz * mz + rz * mx) * WALK_SPEED;
  player.vel.x = wishX;
  player.vel.z = wishZ;
  // 2. Gravity.
  player.vel.y -= GRAV * dt;
  // 3. Integrate.
  player.pos.x += player.vel.x * dt;
  player.pos.y += player.vel.y * dt;
  player.pos.z += player.vel.z * dt;
  // 4. Reset ground flag, resolve collisions.
  player.onGround = false;
  for (const pl of platforms) resolveCapsuleVsBox(pl.box);
  // 5. Face the wishDir if moving.
  if (ml > 0.05) {
    const targetYaw = Math.atan2(wishX, wishZ);
    // shortest-arc lerp
    let diff = targetYaw - player.yaw;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.yaw += diff * Math.min(1, dt * 14);
  }
  // 6. Death zone (void below).
  if (player.pos.y < -10) startRespawn();
}

function startRespawn() {
  if (state !== 'play') return;
  state = 'respawning';
  dieT = 0;
  dieStartPos.copy(player.pos);
  sfx('hit');
}

function stepRespawn(dt) {
  // 1.6-s LAUNCH/TUMBLE/LAND lifted from runner v34 (proto/runner/
  // index.html lines 3367–3411), adapted to player.pos instead of
  // danny.position.
  dieT += dt;
  if (dieT < 0.40) {
    const p = dieT / 0.40;
    player.pos.x = dieStartPos.x;
    player.pos.y = dieStartPos.y + p * 3.4;
    player.pos.z = dieStartPos.z + p * 1.2;
    danny.rotation.x = -p * Math.PI * 0.9;
    danny.rotation.z = p * 0.3;
    danny.scale.set(1, 1, 1);
  } else if (dieT < 1.10) {
    const p = (dieT - 0.40) / 0.70;
    const peak = dieStartPos.y + 3.4;
    const land = 0.10;
    player.pos.y = peak + (land - peak) * (p * p);
    player.pos.z = dieStartPos.z + 1.2 + p * 1.6;
    danny.rotation.x = -Math.PI * 0.9 - Math.PI * 2.0 * p;
    danny.rotation.z = 0.3 + p * 1.1;
  } else if (dieT < 1.60) {
    const p = (dieT - 1.10) / 0.50;
    player.pos.y = 0.10;
    player.pos.z = dieStartPos.z + 2.8;
    danny.rotation.x = Math.PI * 0.5;
    danny.rotation.z = 1.4 + 0.25 * Math.sin(p * Math.PI * 4) * (1 - p);
    const bounce = 1 - p;
    danny.scale.set(1 + 0.25 * bounce, 1 - 0.18 * bounce, 1 + 0.25 * bounce);
  } else {
    // Respawn complete.
    state = 'play';
    player.pos.copy(lastCheckpointPos);
    player.vel.set(0, 0, 0);
    danny.rotation.set(0, 0, 0);
    danny.scale.set(1, 1, 1);
    sfx('respawn');
  }
}

// ============ TICK / RENDER LOOP =====================================
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  runT += dt;

  if (state === 'play') {
    timeSec += dt;
    stepPlay(dt);
  } else if (state === 'respawning') {
    stepRespawn(dt);
  } // 'won' is idle.

  // Sync the visual to the physics position + facing. Danny's local
  // origin is at his sneaker bottoms (y=0), so to put his feet at the
  // capsule's lower point (player.pos.y - halfH - radius) we offset
  // by that full amount.
  danny.position.set(
    player.pos.x,
    player.pos.y - player.halfH - player.radius,
    player.pos.z
  );
  if (state === 'play') danny.rotation.y = player.yaw;
  // Floor-shadow under the player.
  const shadow = danny.userData.shadow;
  if (shadow) {
    shadow.position.set(player.pos.x, 0.02, player.pos.z);
    // Find the highest platform under the player to anchor the shadow.
    let topY = -Infinity;
    for (const pl of platforms) {
      if (player.pos.x >= pl.box.min.x - 0.3 && player.pos.x <= pl.box.max.x + 0.3 &&
          player.pos.z >= pl.box.min.z - 0.3 && player.pos.z <= pl.box.max.z + 0.3 &&
          pl.box.max.y <= player.pos.y + 0.5) {
        if (pl.box.max.y > topY) topY = pl.box.max.y;
      }
    }
    if (topY > -Infinity) {
      shadow.position.y = topY + 0.005;
      const flight = Math.max(0, (player.pos.y - player.halfH - player.radius) - topY);
      const k = Math.max(0.35, 1 - flight * 0.18);
      shadow.scale.set(k, 1, k);
      shadow.material.opacity = Math.max(0.05, 0.32 - flight * 0.04);
    }
    shadow.visible = topY > -Infinity;
  }

  updateCamera(dt);
  renderer.render(scene, camera);

  // HUD updates
  document.getElementById('ui-time').textContent = formatTime(timeSec);
  document.getElementById('vsize').textContent = canvas.width + '×' + canvas.height;

  requestAnimationFrame(tick);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const ss = Math.floor(s - m * 60);
  return m + ':' + String(ss).padStart(2, '0');
}

// ============ RESET ==================================================
function reset() {
  state = 'play';
  player.pos.set(0, 2, 0);
  player.vel.set(0, 0, 0);
  player.yaw = 0;
  player.onGround = false;
  lastCheckpointPos.copy(player.pos);
  timeSec = 0;
  dieT = 0;
  danny.rotation.set(0, 0, 0);
  danny.scale.set(1, 1, 1);
  document.getElementById('overlay').classList.remove('on');
}

// ============ INIT / RESIZE ==========================================
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

// Show the touch UI on touch-capable devices.
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  document.body.dataset.touch = '1';
}

// Pre-position camera so the first frame isn't a hard snap.
camPos.set(0, 4.0, 7.0);
camTgt.set(0, 1.0, 0);
camera.position.copy(camPos);
camera.lookAt(camTgt);

resize();
tick();
</script>
