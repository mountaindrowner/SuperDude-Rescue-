<!DOCTYPE html>
<html lang="en">
<head>

<meta name="theme-color" content="#9fd8ff">
<title>Super Dude OBBY v3 — Phase 3 first map</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; height: 100%; background: #9fd8ff; overflow: hidden;
    font-family: system-ui, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#game { background: #9fd8ff; width: 100vw; height: 100vh; display: block; }

  /* HUD overlay shell — patterned after runner v34. */
  #ui { position: fixed; inset: 0; pointer-events: none;
        font-family: system-ui, "Segoe UI", sans-serif; }
  #topbar { position: absolute; top: 8px; left: 8px; right: 8px;
            background: rgba(20,24,38,0.74); border-radius: 10px; padding: 8px 12px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .row { display: flex; justify-content: space-between; align-items: center; color: #e8ecf3; }
  .row + .row { margin-top: 4px; }
  .lbl { font-weight: 700; font-size: 16px; }
  .lbl.big { font-size: 22px; color: #ffd23a; text-shadow: 0 0 10px rgba(255,210,58,0.45); }
  .lbl.dim { color: #9aa0c4; font-weight: 600; font-size: 13px; }
  .lbl.cyan { color: #46f0ff; }
  .bar { height: 4px; background: rgba(255,210,58,0.20); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: linear-gradient(to right, #46f0ff, #ffd23a); transition: width .2s linear;
               box-shadow: 0 0 10px rgba(255,210,58,0.5); }
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
             flex-direction: column; background: rgba(10,12,20,0.86); color: #fff; pointer-events: auto; cursor: pointer; }
  #overlay.on { display: flex; }
  #overlay h1 { margin: 0; font-size: 48px; letter-spacing: 2px; color: #ffd23a;
                text-shadow: 0 0 16px rgba(255,210,58,0.5); }
  #overlay h2 { margin: 6px 0 12px; font-size: 28px; color: #e8a516; }
  #overlay p  { margin: 4px 0; color: #cfd6e4; }
  #overlay .blink { margin-top: 24px; font-size: 18px; opacity: .9; }
  #hint { position: fixed; bottom: 8px; left: 0; right: 0; text-align: center;
          color: #15192a; font-size: 12px; pointer-events: none; opacity: 0.85; }

  /* ---------- mobile touch controls (only shown on touch-capable) ----------
     Layout per Mark v3 request: gameplay = top 80% of screen, controls = bottom
     ~20% strip. Stick on the left side of the strip, JUMP button on the right.
     The look-drag area spans the entire top 80% so the player can orbit anywhere
     above the strip. */
  body:not([data-touch]) #touchUI { display: none; }
  #touchUI { position: fixed; inset: 0; pointer-events: none; z-index: 12; }
  /* Top 80% — anywhere you drag here = orbit the camera */
  #lookZone { position: absolute; left: 0; right: 0; top: 0; height: 80vh; pointer-events: auto; }
  /* Bottom 20% strip — translucent dark band for control affordance */
  #ctrlBar { position: absolute; left: 0; right: 0; bottom: 0; height: 20vh; min-height: 140px;
             pointer-events: none;
             background: linear-gradient(180deg, rgba(20,24,38,0.0), rgba(20,24,38,0.45) 60%, rgba(20,24,38,0.60));
             border-top: 1px solid rgba(255,255,255,0.10); }
  #stickZone { position: absolute; left: 0; right: 50%; bottom: 0; height: 20vh; min-height: 140px;
               pointer-events: auto; }
  #stickBase, #stickKnob { position: absolute; border-radius: 50%;
               background: rgba(20,24,38,0.30); border: 2px solid rgba(255,255,255,0.55);
               box-shadow: 0 2px 12px rgba(0,0,0,0.30);
               transition: opacity .12s; opacity: 0.55; pointer-events: none; }
  #stickBase { width: 110px; height: 110px; }
  #stickKnob { width: 56px; height: 56px; background: rgba(255,255,255,0.92); border: 2px solid rgba(20,24,38,0.65); }
  #stickZone.live #stickBase, #stickZone.live #stickKnob { opacity: 1.0; }
  #jumpBtn { position: absolute; right: 24px; bottom: 22px; width: 96px; height: 96px;
             border-radius: 50%; background: rgba(70,240,255,0.78); border: 3px solid #fff;
             color: #15192a; font-weight: 900; font-size: 18px; letter-spacing: 2px;
             box-shadow: 0 4px 14px rgba(0,0,0,0.35); pointer-events: auto;
             display: flex; align-items: center; justify-content: center; user-select: none;
             touch-action: none; -webkit-touch-callout: none; z-index: 13; }
  #jumpBtn:active, #jumpBtn.live { background: #ffd23a; transform: scale(0.94); }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }

<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="ui">
  <div id="topbar">
    <div class="row">
      <span class="lbl big">STAGE <span id="ui-stage">1</span><span style="color:#9aa0c4"> / </span><span id="ui-total" style="color:#9aa0c4">1</span></span>
      <span class="lbl"><span style="color:#9aa0c4">CHECKPOINT</span> <span id="ui-cp" class="cyan">0</span></span>
    </div>
    <div class="row">
      <span class="lbl dim">TIME <span id="ui-time">0:00</span></span>
      <span class="lbl dim">v3 &nbsp;•&nbsp; <span id="vsize">—</span></span>
    </div>
    <div class="bar"><div id="ui-prog" style="width:0%"></div></div>
  </div>
  <div id="overlay">
    <h1 id="ov-h1">YOU MADE IT!</h1>
    <h2 id="ov-h2"></h2>

</div>

<div id="touchUI">
  <div id="lookZone"></div>
  <div id="ctrlBar"></div>
  <div id="stickZone">
    <div id="stickBase"></div>
    <div id="stickKnob"></div>
  </div>
  <button id="jumpBtn" type="button">JUMP</button>
</div>

<script type="module">
import * as THREE from 'three';

// ============ RENDERER / SCENE / LIGHTING ============================
// Lifted from proto/runner/index.html boot block. Trimmed for OBBY:
// bright sky background, warm sun, no specimen-tube point lights.
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd8ff);
scene.fog = new THREE.Fog(0x9fd8ff, 35, 160);

// PMREM env — a small canvas gradient so PBR materials read correctly.
const envCanvas = document.createElement('canvas');
envCanvas.width = 32; envCanvas.height = 32;
{
  const g = envCanvas.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 32);
  grad.addColorStop(0, '#fff5d8');
  grad.addColorStop(0.5, '#9fd8ff');
  grad.addColorStop(1, '#6bcf6b');
  g.fillStyle = grad; g.fillRect(0, 0, 32, 32);
}
const envTex = new THREE.CanvasTexture(envCanvas);
envTex.mapping = THREE.EquirectangularReflectionMapping;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(envTex).texture;

// Lights — warm sun + cool fill (OBBY palette).
const ambient = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff4d8, 1.55);
sun.position.set(8, 16, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
sun.shadow.camera.top = 25; sun.shadow.camera.bottom = -25;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0008;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fd8ff, 0.45);
fill.position.set(-6, 8, -4);
scene.add(fill);

// ============ CAMERA =================================================
// Orbit-follow: azim/elev/radius captured from input; target = player +
// head-height offset; lerp toward the desired position each frame.
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 240);
let azim = 0.0;          // radians, around +Y
let elev = 0.65;         // v3: raised from 0.35 → 0.65 (~37°, just under 45°
                         //     per Mark "maybe a little lower than 45°").
let radius = 7.8;        // v3: slight push-back for the steeper view
let autoFollowCooldown = 0; // seconds; after user drags, we briefly pause
                            // auto-camera-follow so manual input isn't fought.
const camPos  = new THREE.Vector3();
const camTgt  = new THREE.Vector3();
const camWish = new THREE.Vector3();
function updateCamera(dt) {
  // v3: auto-follow Danny's back when he's moving and the user isn't
  // dragging. Desired azim = player.yaw + π so the camera sits on the
  // OPPOSITE side of Danny's facing direction. Shortest-arc lerp at a
  // slow rate so the camera doesn't whip around behind every wiggle of
  // the joystick.
  const horizSpeed = Math.hypot(player.vel.x, player.vel.z);
  if (autoFollowCooldown > 0) autoFollowCooldown = Math.max(0, autoFollowCooldown - dt);
  if (state === 'play' && horizSpeed > 0.6 && !lookActive && autoFollowCooldown === 0) {
    let desired = player.yaw + Math.PI;
    let diff = desired - azim;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    azim += diff * Math.min(1, dt * 2.4);
  }

  // Desired look target: head height of the player.
  const tx = player.pos.x;
  const ty = player.pos.y + 1.0;
  const tz = player.pos.z;
  const cx = tx + Math.cos(elev) * Math.sin(azim) * radius;
  const cy = ty + Math.sin(elev) * radius;
  const cz = tz + Math.cos(elev) * Math.cos(azim) * radius;
  camWish.set(cx, cy, cz);
  const k = Math.min(1, dt * 9);
  camPos.lerp(camWish, k);
  camTgt.lerp({ x: tx, y: ty, z: tz }, k);
  camera.position.copy(camPos);
  camera.lookAt(camTgt);
}

// ============ DANNY RIG ==============================================
// v3: rebuilt with HIP and SHOULDER pivot groups for run animation, and
// a capsule torso for a smoother body. Local origin still at sneaker
// bottoms (y=0) so the visual sits flat on whatever surface he's on.
const danny  = new THREE.Group();          // root, yaw-rotated to face wishDir
const rigParts = {};                       // named handles for animation
function buildDanny() {
  const skin     = new THREE.MeshStandardMaterial({ color: 0xf0c8a0, metalness: 0.05, roughness: 0.7 });
  const coat     = new THREE.MeshStandardMaterial({ color: 0xf8fafc, metalness: 0.15, roughness: 0.55 });
  const shirt    = new THREE.MeshStandardMaterial({ color: 0xc8d0dc, metalness: 0.45, roughness: 0.45 });
  const pants    = new THREE.MeshStandardMaterial({ color: 0x3a4a6a, metalness: 0.20, roughness: 0.55 });
  const sneaker  = new THREE.MeshStandardMaterial({ color: 0x1a2030, metalness: 0.35, roughness: 0.50 });
  const cap      = new THREE.MeshStandardMaterial({ color: 0xd33a3a, metalness: 0.20, roughness: 0.45 });
  const eyeWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const eyeDark  = new THREE.MeshStandardMaterial({ color: 0x1a2030 });

  function mesh(geom, mat) {
    const m = new THREE.Mesh(geom, mat);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }

  // ---- LEGS as hip-pivot groups (so they can swing for the run) -----
  // Hip joint sits at danny-local y=0.85 (top of the leg cylinder).
  // Children hang DOWN from the pivot: leg cylinder + sneaker box.
  const LEG_LEN = 0.85;
  for (const side of [-1, +1]) {
    const hip = new THREE.Group();
    hip.position.set(side * 0.18, LEG_LEN, 0);
    danny.add(hip);
    // leg cylinder hangs down from pivot
    const leg = mesh(new THREE.CylinderGeometry(0.16, 0.16, LEG_LEN, 12), pants);
    leg.position.y = -LEG_LEN / 2;
    hip.add(leg);
    // sneaker box at the ankle (slightly forward in +Z so toe points fwd)
    const shoe = mesh(new THREE.BoxGeometry(0.30, 0.16, 0.50), sneaker);
    shoe.position.set(0, -LEG_LEN + 0.08, 0.05);
    hip.add(shoe);
    // white sneaker stripe — sits on top of the shoe
    const stripe = mesh(new THREE.BoxGeometry(0.31, 0.04, 0.50),
                        new THREE.MeshStandardMaterial({ color: 0xffffff }));
    stripe.position.set(0, -LEG_LEN + 0.10, 0.05);
    hip.add(stripe);
    rigParts[side < 0 ? 'hipL' : 'hipR'] = hip;
  }

  // ---- TORSO — capsule (smoother than the previous box) + coat slabs -
  const TORSO_Y = 1.18;
  const torso = mesh(new THREE.CapsuleGeometry(0.32, 0.46, 6, 14), shirt);
  torso.position.y = TORSO_Y;
  danny.add(torso);
  // white lab-coat slab over the front
  const coatFront = mesh(new THREE.BoxGeometry(0.62, 0.78, 0.06), coat);
  coatFront.position.set(0, TORSO_Y - 0.04, 0.30);
  danny.add(coatFront);
  // lab-coat hem (wraps the bottom of the torso to read as a coat skirt)
  const hem = mesh(new THREE.BoxGeometry(0.72, 0.30, 0.50), coat);
  hem.position.set(0, 0.86, 0);
  danny.add(hem);

  // ---- ARMS as shoulder-pivot groups -------------------------------
  // Shoulder joint at danny-local y=1.59 (top of the arm cylinder).
  const ARM_LEN = 0.78;
  for (const side of [-1, +1]) {
    const sh = new THREE.Group();
    sh.position.set(side * 0.44, 1.59, 0);
    danny.add(sh);
    const arm = mesh(new THREE.CylinderGeometry(0.10, 0.10, ARM_LEN, 10), coat);
    arm.position.y = -ARM_LEN / 2;
    sh.add(arm);
    const hand = mesh(new THREE.SphereGeometry(0.13, 14, 10), skin);
    hand.position.y = -ARM_LEN + 0.04;
    sh.add(hand);
    rigParts[side < 0 ? 'shoulderL' : 'shoulderR'] = sh;
  }

  // ---- HEAD ---------------------------------------------------------
  const headY = 1.92;
  // a head group so the head can subtly bob with the run cadence
  const headGrp = new THREE.Group();
  headGrp.position.y = headY;
  danny.add(headGrp);
  rigParts.headGrp = headGrp;

  headGrp.add(mesh(new THREE.SphereGeometry(0.28, 18, 14), skin));
  // eyes (whites then dark pupils, both positioned in head-local coords)
  function eye(side, dx, dy, dz, r, mat) {
    const e = mesh(new THREE.SphereGeometry(r, 10, 8), mat);
    e.position.set(side * dx, dy, dz);
    headGrp.add(e); return e;
  }
  eye(-1, 0.10, 0.04, 0.22, 0.055, eyeWhite);
  eye( 1, 0.10, 0.04, 0.22, 0.055, eyeWhite);
  eye(-1, 0.10, 0.03, 0.26, 0.028, eyeDark);
  eye( 1, 0.10, 0.03, 0.26, 0.028, eyeDark);
  // mouth (smirk)
  const mouth = mesh(new THREE.BoxGeometry(0.16, 0.03, 0.04), eyeDark);
  mouth.position.set(0, -0.10, 0.25);
  headGrp.add(mouth);
  // hair tuft peeking out the back under the cap
  const hair = mesh(new THREE.SphereGeometry(0.12, 10, 8),
                    new THREE.MeshStandardMaterial({ color: 0x3a2418 }));
  hair.position.set(0, 0.18, -0.18);
  headGrp.add(hair);

  // ---- CAP (worn backwards, brim points -Z) ------------------------
  const dome = mesh(new THREE.SphereGeometry(0.31, 18, 14, 0, Math.PI*2, 0, Math.PI*0.55), cap);
  dome.position.set(0, 0.18, 0);
  headGrp.add(dome);
  const brim = mesh(new THREE.BoxGeometry(0.48, 0.04, 0.22), cap);
  brim.position.set(0, 0.12, -0.28);
  brim.rotation.x = 0.10;
  headGrp.add(brim);
  // gold SD patch on the front of the cap
  const patch = mesh(new THREE.BoxGeometry(0.18, 0.10, 0.02),
        new THREE.MeshStandardMaterial({ color: 0xffd23a, emissive: 0xffd23a, emissiveIntensity: 0.22 }));
  patch.position.set(0, 0.18, 0.30);
  headGrp.add(patch);

  // ---- Drop shadow (lives in the SCENE, not under danny, so it stays
  //      pinned to the platform top when Danny is in the air). -------
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.55, 24),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32 })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.02;
  shadow.renderOrder = -1;
  danny.userData.shadow = shadow;
  scene.add(shadow);
}
buildDanny();
scene.add(danny);

// ============ RUN / IDLE ANIMATION ===================================
// Stride phase accumulates while moving; lerps everything back to a
// neutral pose when stopped (or while respawning).
let stridePhase = 0;
function tickRig(dt, isMoving) {
  const speed = Math.hypot(player.vel.x, player.vel.z);
  if (isMoving) {
    // Cadence ramps with movement speed so the run reads fast at high
    // speed and natural at base speed.
    stridePhase += dt * (3.5 + speed * 0.55);
  }
  const swing = isMoving ? Math.sin(stridePhase) * 0.65 : 0;
  const armSwing = isMoving ? Math.sin(stridePhase) * 0.55 : 0;
  const k = Math.min(1, dt * 14);
  // Hips swing opposite to each other.
  rigParts.hipL.rotation.x += ( swing - rigParts.hipL.rotation.x) * k;
  rigParts.hipR.rotation.x += (-swing - rigParts.hipR.rotation.x) * k;
  // Arms swing opposite to hips, ~85% amplitude.
  rigParts.shoulderL.rotation.x += (-armSwing - rigParts.shoulderL.rotation.x) * k;
  rigParts.shoulderR.rotation.x += ( armSwing - rigParts.shoulderR.rotation.x) * k;
  // Head bob — small up/down on every footfall (twice per stride cycle).
  const bobTarget = isMoving ? Math.abs(Math.sin(stridePhase * 2)) * 0.05 : 0;
  rigParts.headGrp.position.y += (1.92 + bobTarget - rigParts.headGrp.position.y) * k;
}

// ============ PLAYER STATE + PHYSICS CONSTANTS =======================
const GRAV = 18, JUMP_V0 = 7.0, WALK_SPEED = 8.0;
const player = {
  pos: new THREE.Vector3(0, 2, 0),
  vel: new THREE.Vector3(0, 0, 0),
  yaw: 0,
  onGround: false,
  radius: 0.4,
  halfH: 0.70,           // capsule axis half-length (exclusive of radius caps)
};
let lastCheckpointPos = player.pos.clone();
let state = 'play';      // 'play' | 'respawning' | 'won'
let dieT = 0;
const dieStartPos = new THREE.Vector3();
let runT = 0;
let timeSec = 0;

// ============ PHASE 3: MAP DATA ======================================
// Linear chain of stages extending in the -Z direction. Each stage
// teaches a new verb (per OBBY genre-research rule: one new mechanic
// per stage), and the difficulty escalates with the occasional easier
// breather. Mark's note: "big nice extensive logical map" — 12 stages,
// ~25 z-units each, ~300-unit total run.
//
// Coordinate convention: platform `pos` is the CENTER, `size` is full
// extents (width, height, depth). Players walk in -Z direction.
//
// Obstacle kinds:
//   'solid'         standard platform
//   'disappearing'  HOLD → flash → GONE → HOLD cycle (tHold,tFade,tCool)
//   'moving'        oscillates between `from` and `to` over `period`
//   'jumpPad'       on top-face contact, sets vel.y = impulse
// Hazards:
//   'lava'          touch = die + respawn at last checkpoint
// Triggers:
//   checkpoint:     small flag pad, lights up on first touch, saves
//                   respawn position, advances stage counter.
//   finish:         big gold star pad — touch = WIN overlay.
const MAP = {
  start: [0, 2, 0],
  startYaw: Math.PI,     // face -Z (away from camera, INTO the obstacle course)
  voidY: -12,
  stages: [
    // -------- 1. WARMUP — plain gap jumps. Teaches walk + jump. -------
    { id: 1, name: 'WARMUP',
      platforms: [
        { pos:[ 0,  0,    0],  size:[10, 1, 10], color:'#6bcf6b', kind:'solid' },
        { pos:[ 0,  0,  -10],  size:[ 4, 1,  4], color:'#6bcf6b', kind:'solid' },
        { pos:[ 0,  0,  -18],  size:[ 4, 1,  4], color:'#6bcf6b', kind:'solid' },
        { pos:[ 0,  0,  -28],  size:[ 8, 1,  6], color:'#a8e87a', kind:'solid' },
      ],
      checkpoint: { pos:[0, 1.0, -28], color:'#46f0ff' } },

    // -------- 2. STAIRWAY — vertical reach. Combines gaps + height. ---
    { id: 2, name: 'STAIRWAY',
      platforms: [
        { pos:[ 0,  0.6, -36], size:[ 4, 1,  4], color:'#79c8ff', kind:'solid' },
        { pos:[ 0,  1.6, -42], size:[ 4, 1,  4], color:'#79c8ff', kind:'solid' },
        { pos:[ 0,  2.6, -48], size:[ 4, 1,  4], color:'#79c8ff', kind:'solid' },
        { pos:[ 0,  1.6, -54], size:[ 4, 1,  4], color:'#79c8ff', kind:'solid' },
        { pos:[ 0,  0,   -62], size:[ 8, 1,  6], color:'#a8e87a', kind:'solid' },
      ],
      checkpoint: { pos:[0, 1.0, -62], color:'#46f0ff' } },

    // -------- 3. STEPPING STONES — lateral planning. -----------------
    { id: 3, name: 'STEPPING STONES',
      platforms: [
        { pos:[-2,  0, -70], size:[2.4, 1, 2.4], color:'#ff8aa0', kind:'solid' },
        { pos:[ 2,  0, -76], size:[2.4, 1, 2.4], color:'#ff8aa0', kind:'solid' },
        { pos:[-2,  0, -82], size:[2.4, 1, 2.4], color:'#ff8aa0', kind:'solid' },
        { pos:[ 2,  0, -88], size:[2.4, 1, 2.4], color:'#ff8aa0', kind:'solid' },
        { pos:[ 0,  0, -96], size:[ 8, 1,  6], color:'#a8e87a', kind:'solid' },
      ],
      checkpoint: { pos:[0, 1.0, -96], color:'#46f0ff' } },

    // -------- 4. NOW YOU DON'T — disappearing tiles. -----------------
    { id: 4, name: 'NOW YOU DON\'T',
      platforms: [
        { pos:[ 0,  0, -104], size:[ 4, 1, 4], color:'#b89aff', kind:'solid' },
        { pos:[ 0,  0, -110], size:[ 3, 1, 3], color:'#b89aff', kind:'disappearing', tHold:1.4, tFade:0.30, tCool:1.0 },

// platforms[] = collidable scenery. Each entry:
//   { mesh, box: Box3 (live), kind, data, collidable: true|false }
const platforms = [];
// hazards[] = death triggers (lava). Each entry: { mesh, box, kind, data }
const hazards = [];
// triggers[] = checkpoint + finish pads. Each: { mesh, kind, stageId, pos, radius }
const triggers = [];
let currentStage = 0;       // most recent checkpoint stage id (0 = haven't hit one yet)
let checkpointCount = 0;
let stageStarted = 1;       // the stage we're currently IN (cosmetic only)

function scaffoldMap() {
  for (const stage of MAP.stages) {
    if (stage.platforms) for (const p of stage.platforms) {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(p.size[0], p.size[1], p.size[2]),
        new THREE.MeshStandardMaterial({
          color: p.color || '#6bcf6b',
          metalness: 0.10, roughness: 0.60,
          emissive: p.kind === 'jumpPad' ? p.color : 0x000000,
          emissiveIntensity: p.kind === 'jumpPad' ? 0.40 : 0,
        })
      );
      m.position.set(p.pos[0], p.pos[1], p.pos[2]);
      m.castShadow = true; m.receiveShadow = true;
      scene.add(m);
      const box = new THREE.Box3().setFromObject(m);
      const entry = {
        mesh: m, box,
        kind: p.kind || 'solid',
        data: Object.assign({ stageId: stage.id }, p),
        collidable: true,
      };
      // initial phase offset for disappearing cycles (so a row of them is staggered)
      if (entry.kind === 'disappearing') entry.data.cycleT = p.phase || 0;
      platforms.push(entry);
    }
    if (stage.hazards) for (const h of stage.hazards) {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(h.size[0], h.size[1], h.size[2]),
        new THREE.MeshStandardMaterial({
          color: 0xff5a30, emissive: 0xff2200, emissiveIntensity: 0.55, roughness: 0.55,
        })
      );
      m.position.set(h.pos[0], h.pos[1], h.pos[2]);
      m.receiveShadow = true;
      scene.add(m);
      const box = new THREE.Box3().setFromObject(m);
      hazards.push({ mesh: m, box, kind: h.kind, data: h });
    }
    if (stage.checkpoint) buildCheckpointPad(stage.checkpoint, stage.id, false);
    if (stage.finish)     buildFinishPad(stage.finish, stage.id);
  }
  // Patch the total-stage display.
  document.getElementById('ui-total').textContent = MAP.stages.length;
}

function buildCheckpointPad(cp, stageId, lit) {
  const grp = new THREE.Group();
  grp.position.set(cp.pos[0], cp.pos[1] - 0.02, cp.pos[2]);
  // pad disc on the floor
  const pad = new THREE.Mesh(
    new THREE.CylinderGeometry(1.05, 1.15, 0.10, 24),
    new THREE.MeshStandardMaterial({ color: cp.color, emissive: cp.color, emissiveIntensity: 0.45, transparent: true, opacity: 0.92 })
  );
  grp.add(pad);
  // pole
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.07, 0.09, 1.6, 8),
    new THREE.MeshStandardMaterial({ color: 0x445566, metalness: 0.6, roughness: 0.4 })
  );
  pole.position.y = 0.80;
  grp.add(pole);
  // flag (zone-tinted)
  const flag = new THREE.Mesh(
    new THREE.BoxGeometry(0.55, 0.36, 0.04),
    new THREE.MeshStandardMaterial({ color: cp.color, emissive: cp.color, emissiveIntensity: 0.5 })
  );
  flag.position.set(0.32, 1.35, 0);
  grp.add(flag);
  scene.add(grp);
  triggers.push({
    mesh: grp, kind: 'checkpoint', stageId,
    pos: new THREE.Vector3(cp.pos[0], cp.pos[1], cp.pos[2]),
    radius: 1.7, pad, flag, pole,
    pulseT: 0, lit,
  });
}

function buildFinishPad(f, stageId) {
  const grp = new THREE.Group();
  grp.position.set(f.pos[0], f.pos[1] - 0.05, f.pos[2]);
  const pad = new THREE.Mesh(
    new THREE.CylinderGeometry(1.5, 1.6, 0.16, 36),
    new THREE.MeshStandardMaterial({ color: 0xffd23a, emissive: 0xffd23a, emissiveIntensity: 0.85, roughness: 0.30, metalness: 0.40 })
  );
  grp.add(pad);
  // a glowing octahedron floats over the pad
  const star = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.50, 0),
    new THREE.MeshStandardMaterial({ color: 0xfff5b0, emissive: 0xffd23a, emissiveIntensity: 1.4 })
  );
  star.position.y = 1.2;
  grp.add(star);
  scene.add(grp);
  triggers.push({
    mesh: grp, kind: 'finish', stageId,
    pos: new THREE.Vector3(f.pos[0], f.pos[1], f.pos[2]),
    radius: 2.0, star,
  });
}

// --------------- per-frame obstacle behaviour ------------------
function tickObstacles(dt) {
  for (const pl of platforms) {
    if (pl.kind === 'disappearing') {
      const d = pl.data;
      const tHold = d.tHold ?? 1.4, tFade = d.tFade ?? 0.3, tCool = d.tCool ?? 1.0;
      const total = tHold + tFade + tCool;
      d.cycleT = (d.cycleT + dt) % total;
      if (d.cycleT < tHold) {
        pl.mesh.visible = true;
        pl.mesh.material.emissive.setHex(0x000000);
        pl.mesh.material.emissiveIntensity = 0;
        pl.collidable = true;
      } else if (d.cycleT < tHold + tFade) {
        // about-to-vanish flash
        pl.mesh.visible = true;
        pl.mesh.material.emissive.setHex(0xff5530);
        pl.mesh.material.emissiveIntensity = 0.3 + 0.5 * Math.sin(d.cycleT * 30);
        pl.collidable = true;
      } else {
        pl.mesh.visible = false;
        pl.collidable = false;
      }
    } else if (pl.kind === 'moving') {
      const d = pl.data;
      const period = d.period || 3.0;
      // smooth sine 0..1
      const k = 0.5 - 0.5 * Math.cos((runT % period) / period * Math.PI * 2);
      pl.mesh.position.x = d.from[0] + (d.to[0] - d.from[0]) * k;
      pl.mesh.position.y = d.from[1] + (d.to[1] - d.from[1]) * k;
      pl.mesh.position.z = d.from[2] + (d.to[2] - d.from[2]) * k;
      pl.box.setFromObject(pl.mesh);
    } else if (pl.kind === 'jumpPad') {
      // gentle pulse
      pl.mesh.material.emissiveIntensity = 0.30 + 0.25 * Math.sin(runT * 5);
    }
  }
  for (const h of hazards) {
    if (h.kind === 'lava') {
      h.mesh.material.emissiveIntensity = 0.55 + 0.25 * Math.sin(runT * 3);
    }
  }
  for (const t of triggers) {
    if (t.kind === 'finish' && t.star) {
      t.star.rotation.y += dt * 2.0;
      t.star.rotation.x = Math.sin(runT * 1.2) * 0.20;
      t.star.position.y = 1.2 + Math.sin(runT * 2.4) * 0.18;
    }
    if (t.kind === 'checkpoint') {
      // pulse on activation
      if (t.pulseT > 0) {
        t.pulseT = Math.max(0, t.pulseT - dt);
        const k = t.pulseT / 0.6;
        const scale = 1.0 + k * 0.6;
        t.pad.scale.set(scale, 1, scale);
      } else {
        t.pad.scale.set(1, 1, 1);
      }
      if (t.lit) {
        // gentle bob on the lit flag so it reads as "claimed"
        t.flag.position.y = 1.35 + Math.sin(runT * 2 + t.stageId) * 0.05;
      }
    }
  }
}

// ============ AUDIO ==================================================
// Lifted/adapted from runner. Web Audio synthesis only — no MP3s for
// Phase 2. Lazy init on first user gesture (iOS Safari).
const AUDIO = { ctx: null, master: null, sfxGain: null, initialized: false, unlocked: false,
                master_vol: 0.7, sfx_vol: 0.65 };
function initAudio() {
  if (AUDIO.initialized) return;
  try {
    AUDIO.ctx = new (window.AudioContext || window.webkitAudioContext)();
    AUDIO.master = AUDIO.ctx.createGain(); AUDIO.master.gain.value = AUDIO.master_vol;
    AUDIO.master.connect(AUDIO.ctx.destination);
    AUDIO.sfxGain = AUDIO.ctx.createGain(); AUDIO.sfxGain.gain.value = AUDIO.sfx_vol;
    AUDIO.sfxGain.connect(AUDIO.master);
    AUDIO.initialized = true;
  } catch (e) { console.warn('audio init failed', e); }
}
function unlockAudio() {
  if (AUDIO.unlocked) return;
  initAudio();
  if (!AUDIO.ctx) return;
  if (AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume().catch(()=>{});
  // warm the iOS AVAudioSession with a 1-frame silent buffer
  try {
    const buf = AUDIO.ctx.createBuffer(1, 1, 22050);
    const src = AUDIO.ctx.createBufferSource();
    src.buffer = buf; src.connect(AUDIO.master); src.start(0);
  } catch (_) {}
  AUDIO.unlocked = true;
}
function tone(freq, dur, type = 'sine', vol = 0.5, attack = 0.005, decay = 0.06) {
  if (!AUDIO.unlocked) return;
  const ctx = AUDIO.ctx, t0 = ctx.currentTime;
  const osc = ctx.createOscillator(); osc.type = type; osc.frequency.value = freq;
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(g); g.connect(AUDIO.sfxGain);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.3, hp = 800) {
  if (!AUDIO.unlocked) return;
  const ctx = AUDIO.ctx, sr = ctx.sampleRate;
  const buf = ctx.createBuffer(1, Math.floor(sr * dur), sr);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain(); g.gain.value = vol;
  const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  src.connect(f); f.connect(g); g.connect(AUDIO.sfxGain);
  src.start(0);
}
function sfx(name) {
  switch (name) {
    case 'jump':     tone(540, 0.10, 'square', 0.30); tone(720, 0.10, 'sine', 0.18, 0.02); break;
    case 'land':     noise(0.08, 0.18, 400); tone(180, 0.06, 'sine', 0.18); break;
    case 'checkpoint': tone(720, 0.10, 'triangle', 0.35); setTimeout(() => tone(1080, 0.16, 'triangle', 0.32), 90); break;
    case 'respawn': tone(720, 0.08, 'sine', 0.30); setTimeout(() => tone(540, 0.08, 'sine', 0.28), 80);
                     setTimeout(() => tone(360, 0.18, 'sine', 0.30), 160); break;
    case 'hit':      noise(0.18, 0.35, 200); tone(120, 0.12, 'sawtooth', 0.40); break;
    case 'gameover': tone(220, 0.30, 'sawtooth', 0.30); setTimeout(() => tone(110, 0.40, 'sawtooth', 0.35), 220); break;
    case 'win':      tone(540, 0.10, 'triangle', 0.35); setTimeout(() => tone(720, 0.10, 'triangle', 0.35), 110);
                     setTimeout(() => tone(900, 0.10, 'triangle', 0.35), 220);
                     setTimeout(() => tone(1200, 0.30, 'triangle', 0.35), 330); break;
  }
}

const input = { w: false, a: false, s: false, d: false };
let pointerDown = false, lookActive = false, lookId = -1, lookLX = 0, lookLY = 0;

function doJump() {
  if (state !== 'play') return;
  if (player.onGround) {
    player.vel.y = JUMP_V0;
    player.onGround = false;
    sfx('jump');
  }
}

window.addEventListener('keydown', e => {
  unlockAudio();
  if (state !== 'play') return;
  if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp')    input.w = true;
  else if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft')  input.a = true;
  else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown')  input.s = true;
  else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') input.d = true;
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); doJump(); }
});
window.addEventListener('keyup', e => {
  if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp')    input.w = false;
  else if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft')  input.a = false;
  else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown')  input.s = false;
  else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') input.d = false;
});

// Mouse drag on the canvas → camera orbit. Wheel → zoom.
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') return;     // touch is handled separately
  pointerDown = true; lookActive = true; lookLX = e.clientX; lookLY = e.clientY;
  unlockAudio();
});
window.addEventListener('pointermove', e => {
  if (!pointerDown || e.pointerType === 'touch') return;
  const dx = e.clientX - lookLX, dy = e.clientY - lookLY;
  azim -= dx * 0.006;
  elev = Math.max(-0.6, Math.min(1.30, elev - dy * 0.006));
  lookLX = e.clientX; lookLY = e.clientY;
  // v3: pause auto-follow for ~1.5s after the user drags so we don't
  // fight their input.
  if (Math.abs(dx) + Math.abs(dy) > 1) autoFollowCooldown = 1.5;
});
window.addEventListener('pointerup', e => {
  if (e.pointerType === 'touch') return;
  pointerDown = false; lookActive = false;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  radius = Math.max(3.5, Math.min(16, radius + e.deltaY * 0.005));
}, { passive: false });

// Detect touch and turn on the touch UI. Stick: left half. Look: right half.
// Jump: bottom-right button.
let stickX = 0, stickY = 0;        // normalized [-1, +1]
let stickActive = false, stickId = -1, stickCX = 0, stickCY = 0;

const stickZone = document.getElementById('stickZone');
const stickBase = document.getElementById('stickBase');
const stickKnob = document.getElementById('stickKnob');
const lookZone  = document.getElementById('lookZone');
const jumpBtn   = document.getElementById('jumpBtn');

function placeStickAt(clientX, clientY) {
  // Anchor the base where the finger touched down, and put the knob centered.
  const rect = stickZone.getBoundingClientRect();
  stickCX = clientX - rect.left;
  stickCY = clientY - rect.top;
  stickBase.style.left = (stickCX - 55) + 'px';
  stickBase.style.top  = (stickCY - 55) + 'px';
  stickKnob.style.left = (stickCX - 28) + 'px';
  stickKnob.style.top  = (stickCY - 28) + 'px';
}
function updateStickAt(clientX, clientY) {
  const rect = stickZone.getBoundingClientRect();
  const x = clientX - rect.left - stickCX;
  const y = clientY - rect.top  - stickCY;
  const maxR = 55;
  const r = Math.min(maxR, Math.sqrt(x*x + y*y));
  const ang = Math.atan2(y, x);
  const kx = Math.cos(ang) * r, ky = Math.sin(ang) * r;
  stickKnob.style.left = (stickCX + kx - 28) + 'px';
  stickKnob.style.top  = (stickCY + ky - 28) + 'px';
  stickX = kx / maxR;
  stickY = ky / maxR;
}
function resetStick() {
  stickActive = false; stickId = -1; stickX = 0; stickY = 0;
  stickZone.classList.remove('live');
  // hide knob/base by leaving in place at low opacity
}

stickZone.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
  e.preventDefault();
  document.body.dataset.touch = '1';
  unlockAudio();
  stickActive = true; stickId = e.pointerId;
  stickZone.classList.add('live');
  placeStickAt(e.clientX, e.clientY);
  try { stickZone.setPointerCapture(e.pointerId); } catch (_) {}
});
stickZone.addEventListener('pointermove', e => {
  if (!stickActive || e.pointerId !== stickId) return;
  e.preventDefault();
  updateStickAt(e.clientX, e.clientY);
});
stickZone.addEventListener('pointerup', e => {
  if (e.pointerId !== stickId) return;
  e.preventDefault();
  resetStick();
});
stickZone.addEventListener('pointercancel', () => resetStick());

// look-drag — right half
lookZone.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
  e.preventDefault();
  document.body.dataset.touch = '1';
  unlockAudio();
  lookActive = true; lookId = e.pointerId; lookLX = e.clientX; lookLY = e.clientY;
  try { lookZone.setPointerCapture(e.pointerId); } catch (_) {}
});
lookZone.addEventListener('pointermove', e => {
  if (!lookActive || e.pointerId !== lookId) return;
  e.preventDefault();
  const dx = e.clientX - lookLX, dy = e.clientY - lookLY;
  azim -= dx * 0.008;
  elev = Math.max(-0.6, Math.min(1.30, elev - dy * 0.008));
  lookLX = e.clientX; lookLY = e.clientY;
  if (Math.abs(dx) + Math.abs(dy) > 1) autoFollowCooldown = 1.5;
});
lookZone.addEventListener('pointerup', e => {
  if (e.pointerId !== lookId) return;
  e.preventDefault();
  lookActive = false; lookId = -1;
});
lookZone.addEventListener('pointercancel', () => { lookActive = false; lookId = -1; });

jumpBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  document.body.dataset.touch = '1';
  unlockAudio();
  jumpBtn.classList.add('live');
  doJump();
});
jumpBtn.addEventListener('pointerup', () => { jumpBtn.classList.remove('live'); });
jumpBtn.addEventListener('pointercancel', () => { jumpBtn.classList.remove('live'); });

// ============ COLLISION ==============================================
// Resolve a vertical capsule (center=player.pos, radius=r, halfH=h)
// against a box AABB. Returns 'top', 'side', 'ceiling', or null (no
// contact). The caller uses 'top' to detect jump-pad activations.
const _tmpPt = new THREE.Vector3();
function resolveCapsuleVsBox(box) {
  const r = player.radius;
  const halfH = player.halfH;
  const axisY = Math.max(box.min.y, Math.min(player.pos.y, box.max.y));
  const ax = player.pos.x;
  const ay = Math.max(player.pos.y - halfH, Math.min(axisY, player.pos.y + halfH));
  const az = player.pos.z;
  _tmpPt.set(
    Math.max(box.min.x, Math.min(ax, box.max.x)),
    Math.max(box.min.y, Math.min(ay, box.max.y)),
    Math.max(box.min.z, Math.min(az, box.max.z))
  );
  const dx = ax - _tmpPt.x, dy = ay - _tmpPt.y, dz = az - _tmpPt.z;
  const distSq = dx*dx + dy*dy + dz*dz;
  if (distSq >= r * r) return null;
  const dist = Math.sqrt(distSq) || 1e-6;
  const pen = r - dist;
  const nx = dx / dist, ny = dy / dist, nz = dz / dist;
  player.pos.x += nx * pen;
  player.pos.y += ny * pen;
  player.pos.z += nz * pen;
  if (ny > 0.6) {
    // top — landed on the platform
    if (player.vel.y < 0) {
      if (!player.onGround) sfx('land');
      player.vel.y = 0;
    }
    player.onGround = true;
    return 'top';
  }
  if (Math.abs(nx) > 0.5 || Math.abs(nz) > 0.5) {
    const vDotN = player.vel.x * nx + player.vel.z * nz;
    if (vDotN < 0) {
      player.vel.x -= vDotN * nx;
      player.vel.z -= vDotN * nz;
    }
    return 'side';
  }
  if (ny < -0.6 && player.vel.y > 0) { player.vel.y = 0; return 'ceiling'; }
  return null;
}

// ============ HAZARDS / TRIGGERS =====================================
function checkHazards() {
  if (state !== 'play') return;
  for (const h of hazards) {
    // capsule-vs-AABB overlap (approximate: use capsule's vertical
    // extents + radius pad in X/Z).
    const r = player.radius;
    if (player.pos.x > h.box.min.x - r && player.pos.x < h.box.max.x + r &&
        player.pos.z > h.box.min.z - r && player.pos.z < h.box.max.z + r &&
        (player.pos.y - player.halfH - r) < h.box.max.y + 0.05 &&
        (player.pos.y + player.halfH + r) > h.box.min.y - 0.05) {
      startRespawn();
      return;
    }
  }
}

function checkTriggers() {
  if (state !== 'play') return;
  for (const t of triggers) {
    const dx = player.pos.x - t.pos.x;
    const dz = player.pos.z - t.pos.z;
    const dy = (player.pos.y - player.halfH - player.radius) - t.pos.y;
    const horizDist = Math.hypot(dx, dz);
    if (horizDist < t.radius && Math.abs(dy) < 2.0) {
      if (t.kind === 'checkpoint' && !t.lit) {
        t.lit = true;
        t.pulseT = 0.6;
        if (t.stageId > currentStage) currentStage = t.stageId;
        checkpointCount++;
        // respawn position: above the pad, well clear of any moving parts
        lastCheckpointPos.set(t.pos.x, t.pos.y + 1.4, t.pos.z);
        sfx('checkpoint');
        document.getElementById('ui-stage').textContent = currentStage + 1 > MAP.stages.length ? MAP.stages.length : currentStage + 1;
        document.getElementById('ui-cp').textContent = checkpointCount;
        // progress bar = ratio of stages cleared
        document.getElementById('ui-prog').style.width =
          (Math.min(1, currentStage / MAP.stages.length) * 100) + '%';
      } else if (t.kind === 'finish' && state === 'play') {
        state = 'won';
        sfx('win');
        showWinOverlay();
      }
    }
  }
}

function showWinOverlay() {
  document.getElementById('ov-h1').textContent = 'YOU MADE IT!';
  document.getElementById('ov-h2').textContent = 'TIMELINE STABILIZED';
  document.getElementById('ov-h1').style.color = '#ffd23a';
  document.getElementById('ov-h2').style.color = '#46f0ff';
  document.getElementById('ov-p1').textContent = '⏱ ' + formatTime(timeSec) + '   •   🚩 ' + checkpointCount + ' checkpoints';
  document.getElementById('ov-p2').textContent = MAP.stages.length + ' stages cleared';
  document.getElementById('overlay').classList.add('on');
}

// ============ STEP =================================================
function stepPlay(dt) {
  // 1. Build wishDir in camera-yaw space.
  // forward direction projected onto XZ: (-sin(azim), 0, -cos(azim)) (camera looks toward -azim).
  const fx = -Math.sin(azim), fz = -Math.cos(azim);
  const rx =  Math.cos(azim), rz = -Math.sin(azim);
  // Move axis combines keyboard WASD + touch joystick (whichever is non-zero).
  let mx = 0, mz = 0;
  if (input.w) mz += 1;
  if (input.s) mz -= 1;
  if (input.d) mx += 1;
  if (input.a) mx -= 1;
  if (stickX || stickY) {
    // stick y is screen-down +1 = into screen (forward), so mz = -stickY.
    mx += stickX;
    mz += -stickY;
  }
  const ml = Math.hypot(mx, mz);
  if (ml > 1) { mx /= ml; mz /= ml; }
  const wishX = (fx * mz + rx * mx) * WALK_SPEED;
  const wishZ = (fz * mz + rz * mx) * WALK_SPEED;
  player.vel.x = wishX;
  player.vel.z = wishZ;
  // 2. Gravity.
  player.vel.y -= GRAV * dt;
  // 3. Integrate.
  player.pos.x += player.vel.x * dt;
  player.pos.y += player.vel.y * dt;
  player.pos.z += player.vel.z * dt;
  // 4. Reset ground flag, resolve collisions. Track the LAST top-face
  //    contact so we can fire a jump pad's impulse if that's what we
  //    just landed on.
  player.onGround = false;
  let topContactPad = null;
  for (const pl of platforms) {
    if (pl.collidable === false) continue;
    const r = resolveCapsuleVsBox(pl.box);
    if (r === 'top' && pl.kind === 'jumpPad') topContactPad = pl;
  }
  if (topContactPad) {
    player.vel.y = topContactPad.data.impulse || 13;
    player.onGround = false;
    sfx('jump');
  }
  // 5. Hazards (lava) + triggers (checkpoints, finish).
  checkHazards();
  checkTriggers();
  // 6. Face the wishDir if moving.
  if (ml > 0.05) {
    const targetYaw = Math.atan2(wishX, wishZ);
    let diff = targetYaw - player.yaw;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.yaw += diff * Math.min(1, dt * 14);
  }
  // 7. Death zone (void below).
  if (player.pos.y < (MAP.voidY ?? -12)) startRespawn();
}

function startRespawn() {
  if (state !== 'play') return;
  state = 'respawning';
  dieT = 0;
  dieStartPos.copy(player.pos);
  sfx('hit');
}

function stepRespawn(dt) {
  // 1.6-s LAUNCH/TUMBLE/LAND lifted from runner v34 (proto/runner/
  // index.html lines 3367–3411), adapted to player.pos instead of
  // danny.position.
  dieT += dt;
  if (dieT < 0.40) {
    const p = dieT / 0.40;
    player.pos.x = dieStartPos.x;
    player.pos.y = dieStartPos.y + p * 3.4;
    player.pos.z = dieStartPos.z + p * 1.2;
    danny.rotation.x = -p * Math.PI * 0.9;
    danny.rotation.z = p * 0.3;
    danny.scale.set(1, 1, 1);
  } else if (dieT < 1.10) {
    const p = (dieT - 0.40) / 0.70;
    const peak = dieStartPos.y + 3.4;
    const land = 0.10;
    player.pos.y = peak + (land - peak) * (p * p);
    player.pos.z = dieStartPos.z + 1.2 + p * 1.6;
    danny.rotation.x = -Math.PI * 0.9 - Math.PI * 2.0 * p;
    danny.rotation.z = 0.3 + p * 1.1;
  } else if (dieT < 1.60) {
    const p = (dieT - 1.10) / 0.50;
    player.pos.y = 0.10;
    player.pos.z = dieStartPos.z + 2.8;
    danny.rotation.x = Math.PI * 0.5;
    danny.rotation.z = 1.4 + 0.25 * Math.sin(p * Math.PI * 4) * (1 - p);
    const bounce = 1 - p;
    danny.scale.set(1 + 0.25 * bounce, 1 - 0.18 * bounce, 1 + 0.25 * bounce);
  } else {
    // Respawn complete.
    state = 'play';
    player.pos.copy(lastCheckpointPos);
    player.vel.set(0, 0, 0);
    danny.rotation.set(0, 0, 0);
    danny.scale.set(1, 1, 1);
    sfx('respawn');
  }
}

// ============ TICK / RENDER LOOP =====================================
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  runT += dt;
  tickObstacles(dt);

  if (state === 'play') {
    timeSec += dt;
    stepPlay(dt);
  } else if (state === 'respawning') {
    stepRespawn(dt);
  } // 'won' is idle.

  // Sync the visual to the physics position + facing. Danny's local
  // origin is at his sneaker bottoms (y=0), so to put his feet at the
  // capsule's lower point (player.pos.y - halfH - radius) we offset
  // by that full amount.
  danny.position.set(
    player.pos.x,
    player.pos.y - player.halfH - player.radius,
    player.pos.z
  );
  if (state === 'play') danny.rotation.y = player.yaw;

  // v3: run/idle animation — only when on the ground in play state so
  // limbs don't flap mid-air or mid-tumble.
  const moving = state === 'play' && player.onGround &&
                 Math.hypot(player.vel.x, player.vel.z) > 0.8;
  tickRig(dt, moving);
  // Floor-shadow under the player.
  const shadow = danny.userData.shadow;
  if (shadow) {
    shadow.position.set(player.pos.x, 0.02, player.pos.z);
    // Find the highest platform under the player to anchor the shadow.
    let topY = -Infinity;
    for (const pl of platforms) {
      if (player.pos.x >= pl.box.min.x - 0.3 && player.pos.x <= pl.box.max.x + 0.3 &&
          player.pos.z >= pl.box.min.z - 0.3 && player.pos.z <= pl.box.max.z + 0.3 &&
          pl.box.max.y <= player.pos.y + 0.5) {
        if (pl.box.max.y > topY) topY = pl.box.max.y;
      }
    }
    if (topY > -Infinity) {
      shadow.position.y = topY + 0.005;
      const flight = Math.max(0, (player.pos.y - player.halfH - player.radius) - topY);
      const k = Math.max(0.35, 1 - flight * 0.18);
      shadow.scale.set(k, 1, k);
      shadow.material.opacity = Math.max(0.05, 0.32 - flight * 0.04);
    }
    shadow.visible = topY > -Infinity;
  }

  updateCamera(dt);
  renderer.render(scene, camera);

  // HUD updates
  document.getElementById('ui-time').textContent = formatTime(timeSec);
  document.getElementById('vsize').textContent = canvas.width + '×' + canvas.height;

  requestAnimationFrame(tick);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const ss = Math.floor(s - m * 60);
  return m + ':' + String(ss).padStart(2, '0');
}

// ============ RESET ==================================================
function reset() {
  state = 'play';
  player.pos.set(MAP.start[0], MAP.start[1], MAP.start[2]);
  player.vel.set(0, 0, 0);
  player.yaw = MAP.startYaw ?? 0;
  player.onGround = false;
  lastCheckpointPos.copy(player.pos);
  timeSec = 0;
  dieT = 0;
  currentStage = 0;
  checkpointCount = 0;
  // Clear all checkpoint "lit" flags so they reactivate on the new run.
  for (const t of triggers) if (t.kind === 'checkpoint') { t.lit = false; t.pulseT = 0; }
  danny.rotation.set(0, 0, 0);
  danny.scale.set(1, 1, 1);
  document.getElementById('overlay').classList.remove('on');
  document.getElementById('ui-stage').textContent = '1';
  document.getElementById('ui-cp').textContent = '0';
  document.getElementById('ui-prog').style.width = '0%';
}
// Set the initial player position + yaw to the map's spawn now that
// MAP is defined (this overrides the earlier placeholder defaults).
player.pos.set(MAP.start[0], MAP.start[1], MAP.start[2]);
player.yaw = MAP.startYaw ?? 0;
lastCheckpointPos.copy(player.pos);
document.getElementById('ui-stage').textContent = '1';
document.getElementById('ui-total').textContent = MAP.stages.length;

// ============ INIT / RESIZE ==========================================
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

// Show the touch UI on touch-capable devices.
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  document.body.dataset.touch = '1';
}

// Pre-position camera so the first frame isn't a hard snap. Compute
// the spawn camera pos from the live elev/azim/radius defaults.
{
  const tx = MAP.start[0], ty = MAP.start[1] + 1.0, tz = MAP.start[2];
  camPos.set(
    tx + Math.cos(elev) * Math.sin(azim) * radius,
    ty + Math.sin(elev) * radius,
    tz + Math.cos(elev) * Math.cos(azim) * radius
  );
  camTgt.set(tx, ty, tz);
  camera.position.copy(camPos);
  camera.lookAt(camTgt);
}

resize();
tick();
</script>
