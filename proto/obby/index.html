// ============ COLLISION ==============================================
// Resolve a vertical capsule (center=player.pos, radius=r, halfH=h)
// against a box AABB. Returns 'top', 'side', 'ceiling', or null (no
// contact). The caller uses 'top' to detect jump-pad activations.
const _tmpPt = new THREE.Vector3();
function resolveCapsuleVsBox(box) {
  const r = player.radius;
  const halfH = player.halfH;
  const axisY = Math.max(box.min.y, Math.min(player.pos.y, box.max.y));
  const ax = player.pos.x;
  const ay = Math.max(player.pos.y - halfH, Math.min(axisY, player.pos.y + halfH));
  const az = player.pos.z;
  _tmpPt.set(
    Math.max(box.min.x, Math.min(ax, box.max.x)),
    Math.max(box.min.y, Math.min(ay, box.max.y)),
    Math.max(box.min.z, Math.min(az, box.max.z))
  );
  const dx = ax - _tmpPt.x, dy = ay - _tmpPt.y, dz = az - _tmpPt.z;
  const distSq = dx*dx + dy*dy + dz*dz;
  if (distSq >= r * r) return null;
  const dist = Math.sqrt(distSq) || 1e-6;
  const pen = r - dist;
  const nx = dx / dist, ny = dy / dist, nz = dz / dist;
  player.pos.x += nx * pen;
  player.pos.y += ny * pen;
  player.pos.z += nz * pen;
  if (ny > 0.6) {
    // top — landed on the platform
    if (player.vel.y < 0) {
      if (!player.onGround) sfx('land');
      player.vel.y = 0;
    }
    player.onGround = true;
    return 'top';
  }
  if (Math.abs(nx) > 0.5 || Math.abs(nz) > 0.5) {
    const vDotN = player.vel.x * nx + player.vel.z * nz;
    if (vDotN < 0) {
      player.vel.x -= vDotN * nx;
      player.vel.z -= vDotN * nz;
    }
    return 'side';
  }
  if (ny < -0.6 && player.vel.y > 0) { player.vel.y = 0; return 'ceiling'; }
  return null;
}

// ============ HAZARDS / TRIGGERS =====================================
function checkHazards() {
  if (state !== 'play') return;
  for (const h of hazards) {
    // capsule-vs-AABB overlap (approximate: use capsule's vertical
    // extents + radius pad in X/Z).
    const r = player.radius;
    if (player.pos.x > h.box.min.x - r && player.pos.x < h.box.max.x + r &&
        player.pos.z > h.box.min.z - r && player.pos.z < h.box.max.z + r &&
        (player.pos.y - player.halfH - r) < h.box.max.y + 0.05 &&
        (player.pos.y + player.halfH + r) > h.box.min.y - 0.05) {
      startRespawn();
      return;
    }
  }
}

function checkTriggers() {
  if (state !== 'play') return;
  for (const t of triggers) {
    const dx = player.pos.x - t.pos.x;
    const dz = player.pos.z - t.pos.z;
    const dy = (player.pos.y - player.halfH - player.radius) - t.pos.y;
    const horizDist = Math.hypot(dx, dz);
    if (horizDist < t.radius && Math.abs(dy) < 2.0) {
      if (t.kind === 'checkpoint' && !t.lit) {
        t.lit = true;
        t.pulseT = 0.6;
        if (t.stageId > currentStage) currentStage = t.stageId;
        checkpointCount++;
        // respawn position: above the pad, well clear of any moving parts
        lastCheckpointPos.set(t.pos.x, t.pos.y + 1.4, t.pos.z);
        sfx('checkpoint');
        document.getElementById('ui-stage').textContent = currentStage + 1 > MAP.stages.length ? MAP.stages.length : currentStage + 1;
        document.getElementById('ui-cp').textContent = checkpointCount;
        // progress bar = ratio of stages cleared
        document.getElementById('ui-prog').style.width =
          (Math.min(1, currentStage / MAP.stages.length) * 100) + '%';
        // v4: HUD toast — show the cleared stage's name for 1.6s.
        showToast(t.stageId, currentStage);
      } else if (t.kind === 'finish' && state === 'play') {
        state = 'won';
        sfx('win');
        showWinOverlay();
      }
    }
  }
}

// v4: small toast that slides in for ~1.6s with the just-cleared stage label.
let _toastTimer = null;
function showToast(stageId, justClearedId) {
  const el = document.getElementById('toast');
  const txt = document.getElementById('toast-text');
  const stage = MAP.stages.find(s => s.id === stageId);
  txt.textContent = 'CHECKPOINT ' + justClearedId + (stage ? '  ·  ' + stage.name : '');
  el.classList.add('on');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('on'), 1600);
}

function showWinOverlay() {
  document.getElementById('ov-h1').textContent = 'YOU MADE IT!';
  document.getElementById('ov-h2').textContent = 'TIMELINE STABILIZED';
  document.getElementById('ov-h1').style.color = '#ffd23a';
  document.getElementById('ov-h2').style.color = '#46f0ff';
  document.getElementById('ov-p1').textContent = '⏱ ' + formatTime(timeSec) + '   •   🚩 ' + checkpointCount + ' checkpoints';
  document.getElementById('ov-p2').textContent = MAP.stages.length + ' stages cleared';
  document.getElementById('overlay').classList.add('on');
}

// ============ STEP =================================================
function stepPlay(dt) {
  // ---- 0. Pre-step: moving-platform carry (§9.2). -------------------
  // If we were standing on a moving platform at the END of last frame,
  // hitch a ride with its delta BEFORE gravity + integration. Uses
  // player.onGround (which still holds last frame's resolved value at
  // this point — gets reset to false later in step 4).
  if (player.onPlatform && player.onPlatform.kind === 'moving' && player.onGround) {
    player.pos.add(player.onPlatform.deltaPos);
  }

  // ---- 1. wishDir in camera-yaw space ------------------------------
  const fx = -Math.sin(azim), fz = -Math.cos(azim);
  const rx =  Math.cos(azim), rz = -Math.sin(azim);
  let mx = 0, mz = 0;
  if (input.w) mz += 1;
  if (input.s) mz -= 1;
  if (input.d) mx += 1;
  if (input.a) mx -= 1;
  // v4.2 §3.2 — joystick deadzone. Tiny finger drift below the noise
  // floor → exactly zero; above it, remap so full deflection still hits 1.0.
  const sLen = Math.hypot(stickX, stickY);
  if (sLen > TUNING.joystickDeadzone) {
    const remap = (sLen - TUNING.joystickDeadzone) / (1 - TUNING.joystickDeadzone);
    const k = remap / sLen;
    mx += stickX * k;
    mz += -stickY * k;
  }
  const ml = Math.hypot(mx, mz);
  if (ml > 1) { mx /= ml; mz /= ml; }
  const targetVX = (fx * mz + rx * mx) * WALK_SPEED;
  const targetVZ = (fz * mz + rz * mx) * WALK_SPEED;

  // ---- 1b. Acceleration-based horizontal velocity (§6.5). -----------
  // Ramp vel.x/.z toward target instead of snapping. In the air, accel
  // is reduced (per §6.5 "reduced but not absent") so jumps preserve
  // committed momentum but can still be course-corrected. Friction
  // applies only on the ground with no input — in the air with no
  // input we keep momentum, which is critical for the OBBY jump arc.
  const inputting = ml > 0.05;
  if (inputting) {
    const accel = (player.onGround ? TUNING.acceleration : TUNING.airAcceleration) * dt;
    player.vel.x = approach(player.vel.x, targetVX, accel);
    player.vel.z = approach(player.vel.z, targetVZ, accel);
  } else if (player.onGround) {
    const fric = TUNING.friction * dt;
    player.vel.x = approach(player.vel.x, 0, fric);
    player.vel.z = approach(player.vel.z, 0, fric);
  }

  // ---- 2. Coyote timer + jump buffer tick --------------------------
  if (player.onGround) player.coyoteTimer = 0;
  else                  player.coyoteTimer += dt;
  if (player.jumpBuffer > 0) player.jumpBuffer = Math.max(0, player.jumpBuffer - dt);

  // ---- 3. Gravity + integrate --------------------------------------
  player.vel.y -= GRAV * dt;
  // §9.1 maxFallSpeed — long-drop tunneling guard.
  if (player.vel.y < -TUNING.maxFallSpeed) player.vel.y = -TUNING.maxFallSpeed;
  player.pos.x += player.vel.x * dt;
  player.pos.y += player.vel.y * dt;
  player.pos.z += player.vel.z * dt;

  // ---- 4. Reset ground flag, resolve collisions --------------------
  player.prevOnGround = player.onGround;
  player.onGround = false;
  let topContactPad = null;
  let landedPlatform = null;
  for (const pl of platforms) {
    if (pl.collidable === false) continue;
    const r = resolveCapsuleVsBox(pl.box);
    if (r === 'top') {
      landedPlatform = pl;
      if (pl.kind === 'jumpPad') topContactPad = pl;
    }
  }
  // Track which platform Danny is on so the next frame can carry him.
  player.onPlatform = landedPlatform;

  // ---- 5. Jump pad — top contact fires the impulse -----------------
  if (topContactPad) {
    player.vel.y = topContactPad.data.impulse || 13;
    player.onGround = false;
    sfx('jump');
  }

  // ---- 6. Buffered jump — if we just landed and buffer's still hot,
  //         fire automatically. Subtracted out so it can't double-fire.
  if (player.onGround && !player.prevOnGround && player.jumpBuffer > 0) {
    player.vel.y = JUMP_V0;
    player.onGround = false;
    player.jumpBuffer = 0;
    player.coyoteTimer = TUNING.coyoteTime + 1;
    sfx('jump');
  }

  // ---- 7. Landing squash + stride reset — trigger on the first
  //         frame we touched down after time in the air. Resetting
  //         stridePhase keeps the run animation from popping mid-cycle.
  if (player.onGround && !player.prevOnGround) {
    landSquashT = TUNING.landingSquashTime;
    stridePhase = 0;
  }

  // ---- 8. Hazards + triggers ---------------------------------------
  checkHazards();
  checkTriggers();

  // ---- 9. Face wishDir -------------------------------------------
  if (ml > 0.05) {
    const targetYaw = Math.atan2(targetVX, targetVZ);
    let diff = targetYaw - player.yaw;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    player.yaw += diff * Math.min(1, dt * 14);
  }

  // ---- 10. Void below = respawn ------------------------------------
  if (player.pos.y < (MAP.voidY ?? -12)) startRespawn();
}

function startRespawn() {
  if (state !== 'play') return;
  state = 'respawning';
  dieT = 0;
  dieStartPos.copy(player.pos);
  sfx('hit');
}

function stepRespawn(dt) {
  // 1.6-s LAUNCH/TUMBLE/LAND lifted from runner v34 (proto/runner/
  // index.html lines 3367–3411), adapted to player.pos instead of
  // danny.position.
  dieT += dt;
  if (dieT < 0.40) {
    const p = dieT / 0.40;
    player.pos.x = dieStartPos.x;
    player.pos.y = dieStartPos.y + p * 3.4;
    player.pos.z = dieStartPos.z + p * 1.2;
    danny.rotation.x = -p * Math.PI * 0.9;
    danny.rotation.z = p * 0.3;
    danny.scale.set(1, 1, 1);
  } else if (dieT < 1.10) {
    const p = (dieT - 0.40) / 0.70;
    const peak = dieStartPos.y + 3.4;
    const land = 0.10;
    player.pos.y = peak + (land - peak) * (p * p);
    player.pos.z = dieStartPos.z + 1.2 + p * 1.6;
    danny.rotation.x = -Math.PI * 0.9 - Math.PI * 2.0 * p;
    danny.rotation.z = 0.3 + p * 1.1;
  } else if (dieT < 1.60) {
    const p = (dieT - 1.10) / 0.50;
    player.pos.y = 0.10;
    player.pos.z = dieStartPos.z + 2.8;
    danny.rotation.x = Math.PI * 0.5;
    danny.rotation.z = 1.4 + 0.25 * Math.sin(p * Math.PI * 4) * (1 - p);
    const bounce = 1 - p;
    danny.scale.set(1 + 0.25 * bounce, 1 - 0.18 * bounce, 1 + 0.25 * bounce);
  } else {
    // Respawn complete.
    state = 'play';
    player.pos.copy(lastCheckpointPos);
    player.vel.set(0, 0, 0);
    danny.rotation.set(0, 0, 0);
    danny.scale.set(1, 1, 1);
    sfx('respawn');
  }
}

// ============ TICK / RENDER LOOP =====================================
const clock = new THREE.Clock();
let dbgFrameAcc = 0, dbgFrames = 0, dbgFps = 0;   // FPS estimator
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  runT += dt;
  // FPS rolling estimate, updated every 0.4s.
  dbgFrameAcc += dt; dbgFrames++;
  if (dbgFrameAcc >= 0.4) { dbgFps = dbgFrames / dbgFrameAcc; dbgFrameAcc = 0; dbgFrames = 0; }
  tickObstacles(dt);

  if (state === 'play') {
    timeSec += dt;
    stepPlay(dt);
  } else if (state === 'respawning') {
    stepRespawn(dt);
  } else if (state === 'review') {
    // v4.5: review mode — physics paused, Danny holds the selected
    // pose. The camera auto-orbits (handled in updateCamera).
    tickRigReview(dt);
  } // 'won' is idle.

  // Sync the visual to the physics position + facing. In 'review' we
  // freeze Danny exactly where he was when C was pressed, so the camera
  // can orbit him cleanly.
  if (state !== 'review') {
    danny.position.set(
      player.pos.x,
      player.pos.y - player.halfH - player.radius,
      player.pos.z
    );
  }
  if (state === 'play') danny.rotation.y = player.yaw;

  // v3: run/idle animation — only when on the ground in play state so
  // limbs don't flap mid-air or mid-tumble. Review mode runs its own
  // pose rig above, so skip the standard rig tick there.
  const moving = state === 'play' && player.onGround &&
                 Math.hypot(player.vel.x, player.vel.z) > 0.8;
  if (state !== 'review') tickRig(dt, moving);

  // v4 Pass B-lite: landing-squash decay. Owns Danny's scale only
  // during 'play' — 'respawning' has its own scale animation.
  if (state === 'play') {
    if (landSquashT > 0) {
      landSquashT = Math.max(0, landSquashT - dt);
      const k = landSquashT / TUNING.landingSquashTime;   // 1 → 0 over the window
      danny.scale.set(1 + 0.10 * k, 1 - 0.18 * k, 1 + 0.10 * k);
    } else {
      danny.scale.set(1, 1, 1);
    }
  }
  // Floor-shadow under the player.
  const shadow = danny.userData.shadow;
  if (shadow) {
    shadow.position.set(player.pos.x, 0.02, player.pos.z);
    // Find the highest platform under the player to anchor the shadow.
    let topY = -Infinity;
    for (const pl of platforms) {
      if (player.pos.x >= pl.box.min.x - 0.3 && player.pos.x <= pl.box.max.x + 0.3 &&
          player.pos.z >= pl.box.min.z - 0.3 && player.pos.z <= pl.box.max.z + 0.3 &&
          pl.box.max.y <= player.pos.y + 0.5) {
        if (pl.box.max.y > topY) topY = pl.box.max.y;
      }
    }
    if (topY > -Infinity) {
      shadow.position.y = topY + 0.005;
      const flight = Math.max(0, (player.pos.y - player.halfH - player.radius) - topY);
      const k = Math.max(0.35, 1 - flight * 0.18);
      shadow.scale.set(k, 1, k);
      shadow.material.opacity = Math.max(0.05, 0.32 - flight * 0.04);
    }
    shadow.visible = topY > -Infinity;
  }

  updateCamera(dt);
  renderer.render(scene, camera);

  // HUD updates
  document.getElementById('ui-time').textContent = formatTime(timeSec);
  document.getElementById('vsize').textContent = canvas.width + '×' + canvas.height;
  // v4 Debug overlay — only when visible (avoids DOM thrash).
  const dbgEl = document.getElementById('debug');
  if (dbgEl.classList.contains('on')) {
    document.getElementById('dbg-fps').textContent   = dbgFps.toFixed(0);
    document.getElementById('dbg-draws').textContent = renderer.info.render.calls;
    document.getElementById('dbg-tris').textContent  = renderer.info.render.triangles;
    document.getElementById('dbg-geos').textContent  = renderer.info.memory.geometries;
    document.getElementById('dbg-stage').textContent = (currentStage + 1) + '/' + MAP.stages.length;
    document.getElementById('dbg-pos').textContent   =
      player.pos.x.toFixed(1) + ',' + player.pos.y.toFixed(1) + ',' + player.pos.z.toFixed(1);
  }

  requestAnimationFrame(tick);
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const ss = Math.floor(s - m * 60);
  return m + ':' + String(ss).padStart(2, '0');
}

// ============ RESET ==================================================
function reset() {
  state = 'play';
  player.pos.set(MAP.start[0], MAP.start[1], MAP.start[2]);
  player.vel.set(0, 0, 0);
  player.yaw = MAP.startYaw ?? 0;
  player.onGround = false;
  player.prevOnGround = false;
  player.coyoteTimer = TUNING.coyoteTime + 1;
  player.jumpBuffer = 0;
  player.jumpHeld = false;
  player.onPlatform = null;
  landSquashT = 0;
  lastCheckpointPos.copy(player.pos);
  timeSec = 0;
  dieT = 0;
  currentStage = 0;
  checkpointCount = 0;
  // Clear all checkpoint "lit" flags so they reactivate on the new run.
  for (const t of triggers) if (t.kind === 'checkpoint') { t.lit = false; t.pulseT = 0; }
  danny.rotation.set(0, 0, 0);
  danny.scale.set(1, 1, 1);
  document.getElementById('overlay').classList.remove('on');
  document.getElementById('toast').classList.remove('on');
  document.getElementById('ui-stage').textContent = '1';
  document.getElementById('ui-cp').textContent = '0';
  document.getElementById('ui-prog').style.width = '0%';
}
// Set the initial player position + yaw to the map's spawn now that
// MAP is defined (this overrides the earlier placeholder defaults).
player.pos.set(MAP.start[0], MAP.start[1], MAP.start[2]);
player.yaw = MAP.startYaw ?? 0;
lastCheckpointPos.copy(player.pos);
document.getElementById('ui-stage').textContent = '1';
document.getElementById('ui-total').textContent = MAP.stages.length;

// ============ INIT / RESIZE ==========================================
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

// Show the touch UI on touch-capable devices.
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  document.body.dataset.touch = '1';
}

// Pre-position camera so the first frame isn't a hard snap. Compute
// the spawn camera pos from the live elev/azim/radius defaults.
{
  const tx = MAP.start[0], ty = MAP.start[1] + 1.0, tz = MAP.start[2];
  camPos.set(
    tx + Math.cos(elev) * Math.sin(azim) * radius,
    ty + Math.sin(elev) * radius,
    tz + Math.cos(elev) * Math.cos(azim) * radius
  );
  camTgt.set(tx, ty, tz);
  camera.position.copy(camPos);
  camera.lookAt(camTgt);
}

resize();
tick();
</script>
